[package]
name = "yanet-cli-counters"
version = "0.3.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
ynpb = { path = "../../../common/rust/ynpb", package = "yanet-ynpb" }
ync = { path = "../../core", package = "yanet-cli" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }
bytesize = "2"
tabled = { version = "0.22", default-features = false, features = ["ansi", "derive"] }
serde_yaml = "0.9"
