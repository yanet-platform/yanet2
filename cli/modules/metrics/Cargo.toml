[package]
name = "yanet-cli-metrics"
version = "0.3.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
ync = { path = "../../core", package = "yanet-cli" }
commonpb = { path = "../../../common/rust/commonpb", package = "yanet-commonpb" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
tabled = { version = "0.22", default-features = false, features = ["ansi", "derive"] }
