[package]
name = "yanet-cli-inspect"
version = "0.1.0"
edition = "2024"
publish = false

rust-version = "1.88"

[lints]
workspace = true

[dependencies]
ynpb = { path = "../../../common/rust/ynpb", version = "0.1", package = "yanet-ynpb" }
ync = { path = "../../core", version = "0.1", package = "yanet-cli" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tonic = { version = "0.13", features = ["gzip"] }
ptree = "0.5"
bytesize = "2"
