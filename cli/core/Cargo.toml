[package]
name = "yanet-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["cargo", "env", "string", "wrap_help"] }
clap_complete.workspace = true
log.workspace = true
simple_logger = { version = "5", features = ["timestamps", "stderr"] }
colored.workspace = true
tabled.workspace = true
terminal_size = "0.4"
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
prost.workspace = true
prost-types.workspace = true
tonic = { workspace = true, features = ["tls-aws-lc", "tls-native-roots"] }
tonic-prost.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
ynpb.workspace = true
ync-rpc.workspace = true
commonpb.workspace = true
tower.workspace = true
http.workspace = true
http-body = "1"
ssh-key = "0.6"
byteorder = "1"
base64 = "0.23"
erased-serde = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
humantime.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-health.workspace = true
socket2 = "0.6"
