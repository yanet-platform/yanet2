[package]
name = "yanet-cli"
version = "0.1.0"
edition = "2021"
publish = false

rust-version = "1.88"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["cargo", "derive", "env", "string", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
log = "0.4"
simple_logger = { version = "5", features = ["timestamps", "stderr"] }
colored = "3"
tabled = { version = "0.18", features = ["ansi"] }
terminal_size = "0.4"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.13", features = ["gzip", "tls-aws-lc", "tls-native-roots"] }
ynpb = { path = "../../common/rust/ynpb", version = "0.1", package = "yanet-ynpb" }
commonpb = { path = "../../common/rust/commonpb", version = "0.1", package = "yanet-commonpb" }
tower = "0.5"
http = "1"
ssh-key = "0.6"
byteorder = "1"
base64 = "0.22"
erased-serde = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
humantime = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-health = "0.13"
socket2 = "0.5"
