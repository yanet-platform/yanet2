[package]
name = "yanet-cp"
version = "0.1.0"
description = "Single control-plane static library: the C ABI of the Rust api crates, plus the rure C API, for the Go control plane."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "yanet_cp"
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[dependencies]
decap-api = { path = "../decap-api" }
# Go already links Rust code through librure.a; a second Rust static library
# would duplicate the Rust runtime symbols, so this one carries the rure C
# API and replaces librure.a in the Go link.
rure = { path = "../../../subprojects/regex/regex-capi" }
yanet-sys = { path = "../yanet-sys", default-features = false, features = ["cp"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
