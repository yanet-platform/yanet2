[package]
name = "yanet-readinesspb"
version = "0.1.0"
edition = "2024"
publish = false

rust-version = "1.88"

[lints]
workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.14", features = ["gzip"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
