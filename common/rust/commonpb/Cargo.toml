[package]
name = "yanet-commonpb"
version = "0.2.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
netip = "0.3"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }

[dev-dependencies]
serde_json = "1"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
