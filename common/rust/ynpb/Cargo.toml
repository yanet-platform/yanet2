[package]
name = "yanet-ynpb"
version = "0.3.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }
commonpb = { path = "../commonpb", package = "yanet-commonpb" }
ync-rpc = { path = "../../../cli/rpc", package = "yanet-cli-rpc" }

[build-dependencies]
ync-build = { path = "../../../cli/ync-build", package = "yanet-cli-build" }
