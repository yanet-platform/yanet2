[package]
name = "yanet-ynpb"
version = "0.1.0"
edition = "2024"
publish = false

rust-version = "1.88"

[lints]
workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
commonpb = { path = "../commonpb", version = "0.1", package = "yanet-commonpb" }

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
