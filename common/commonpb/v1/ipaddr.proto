syntax = "proto3";

package common.commonpb.v1;

option go_package = "github.com/yanet-platform/yanet2/common/commonpb/v1;commonpb";

// IPAddress represents an IPv4 or IPv6 host address.
//
// Family is determined by the length of addr:
//   - 4 bytes  - IPv4 in network byte order;
//   - 16 bytes - IPv6 in network byte order.
// Any other length is invalid.
message IPAddress {
  // Network-byte-order address bytes.
  //
  // MUST be exactly 4 (IPv4) or 16 (IPv6) bytes. Any other length is a
  // malformed message.
  bytes addr = 1;
  // Reserved for zone.
  reserved 2;
}

// IPv4Address represents an IPv4 host address.
//
// Unlike IPAddress, the family is fixed by the type and every value is a
// valid address: there is no malformed state to validate after decoding.
message IPv4Address {
  // The address as a big-endian u32 value.
  //
  // 10.1.2.3 is 0x0a010203.
  fixed32 addr = 1;
}
