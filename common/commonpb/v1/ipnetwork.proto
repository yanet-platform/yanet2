syntax = "proto3";

package common.commonpb.v1;

option go_package = "github.com/yanet-platform/yanet2/common/commonpb/v1;commonpb";

import "common/commonpb/v1/ipaddr.proto";

// ContiguousIPNetwork represents an IPv4 or IPv6 CIDR prefix.
//
// "Contiguous" distinguishes this from a general per-bit mask: the network
// mask must be expressible as a prefix length. Family is determined by the
// length of addr, consistently with IPAddress.
message ContiguousIPNetwork {
  // Masked network base address.
  //
  // Host bits below prefix_len MUST be zero.
  IPAddress addr = 1;
  // Prefix length, in bits.
  //
  // MUST be <= 32 for a 4-byte addr and <= 128 for a 16-byte addr.
  uint32 prefix_len = 2;
}

// ContiguousIPv4Network represents an IPv4 CIDR prefix.
//
// Unlike ContiguousIPNetwork, the family is fixed by the type: the
// address cannot carry IPv6, and an absent addr is the only malformed
// state.
message ContiguousIPv4Network {
  // Network base address.
  //
  // MUST be present. Host bits below prefix_len are masked off on
  // decode, so producers need not normalize.
  IPv4Address addr = 1;
  // Prefix length, in bits.
  //
  // MUST be <= 32.
  uint32 prefix_len = 2;
}

// ContiguousIPv6Network represents an IPv6 CIDR prefix.
//
// Unlike ContiguousIPNetwork, the family is fixed by the type: the
// address cannot carry IPv4, and an absent addr is the only malformed
// state.
message ContiguousIPv6Network {
  // Network base address.
  //
  // MUST be present. Host bits below prefix_len are masked off on
  // decode, so producers need not normalize.
  IPv6Address addr = 1;
  // Prefix length, in bits.
  //
  // MUST be <= 128.
  uint32 prefix_len = 2;
}

// BiContiguousIPv6Network represents an IPv6 network whose two 64-bit
// mask halves are independently contiguous.
//
// This is the filter compiler's valid IPv6 class: each mask half is a
// leading run of one bits, so a hole exactly at the /64 boundary is
// expressible while a mask with a hole inside either half is
// unrepresentable. Globally contiguous CIDR masks are the subset with
// hi_prefix_len 64 or lo_prefix_len 0. An absent message means no
// network. The wildcard ::/0 is the explicit all-zero encoding, and an
// absent addr is the only malformed state.
message BiContiguousIPv6Network {
  // Network base address.
  //
  // MUST be present. Address bits not covered by the two half-masks are
  // masked off on decode, so producers need not normalize.
  IPv6Address addr = 1;
  // Leading-ones run length of the high 64-bit mask half.
  //
  // MUST be <= 64.
  uint32 hi_prefix_len = 2;
  // Leading-ones run length of the low 64-bit mask half.
  //
  // MUST be <= 64.
  uint32 lo_prefix_len = 3;
}
