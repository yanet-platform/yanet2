[package]
name = "yanet-cli-device-vlan"
version = "0.3.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
commonpb = { path = "../../../common/rust/commonpb", package = "yanet-commonpb" }
ynpb = { path = "../../../common/rust/ynpb", package = "yanet-ynpb" }
ync = { path = "../../../cli/core", package = "yanet-cli" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tabled = { version = "0.22", default-features = false, features = ["ansi"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }

[build-dependencies]
ync-build = { path = "../../../cli/ync-build", package = "yanet-cli-build" }
