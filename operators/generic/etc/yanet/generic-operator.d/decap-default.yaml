name: decap

logging:
  level: info

# Debug server with the Go runtime profiles under /debug/pprof/, off
# unless an endpoint is set.
#
# It has no authentication, and its profiles expose the process internals
# and can load it, so keep it on a unix socket, which is created owner-only,
# or on a loopback address. The endpoint is "host:port" or an absolute
# socket path whose directory must exist.
#
# debug:
#   endpoint: /run/yanet-generic-operator-decap-debug.sock

gateways:
  - name: numa0
    endpoint: "[::1]:8080"
    # TLS towards the gateway.
    #
    # Absent: plaintext. Present, even empty: TLS with the system roots.
    #
    #   tls:
    #     # PEM bundle that replaces the system roots.
    #     ca_file: /etc/yanet2/tls/ca.pem
    #     # Client certificates, reread without a restart.
    #     #
    #     # A handshake presents the first pair that is valid and that the
    #     # gateway accepts, else none. Replace the files by rename or
    #     # symlink swap. Paths cannot be set from the environment.
    #     key_pairs:
    #       - type: file
    #         config:
    #           cert_file: /etc/yanet2/tls/operator.pem
    #           key_file: /etc/yanet2/tls/operator.key
    #     # Host the server certificate is checked against, defaults to the
    #     # host of the endpoint.
    #     server_name: gateway.numa0

register:
  interval: 30s

reconcile:
  interval: 30s
  initial_backoff: 500ms
  max_backoff: 30s

configs:
  - name: decap0
    method: modules.decap.controlplane.decappb.v1.DecapService/UpdateConfig
    file: /etc/yanet2/decap.d/default.yaml

functions:
  - name: fn:decap
    chains:
      - chain:
          name: default
          modules:
            - type: decap
              name: decap0
        weight: 1
