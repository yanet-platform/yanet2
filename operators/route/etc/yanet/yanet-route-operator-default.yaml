# YANET Route Operator Configuration
---
# Logging configuration.
logging:
  level: debug

# One entry per dataplane instance (typically one per NUMA node).
gateways:
  - name: numa0
    endpoint: "[::1]:8080"
    # TLS towards the gateway.
    #
    # Absent: plaintext. Present, even empty: TLS with the system roots.
    #
    #   tls:
    #     # PEM bundle that replaces the system roots.
    #     ca_file: /etc/yanet2/tls/ca.pem
    #     # Client certificate, both files or neither.
    #     cert_file: /etc/yanet2/tls/operator.pem
    #     key_file: /etc/yanet2/tls/operator.key
    #     # Host the server certificate is checked against, defaults to the
    #     # host of the endpoint.
    #     server_name: gateway.numa0

# The operator's own gRPC server.
#
# `endpoint` is what it binds, with port 0 picking a free one.
# `advertise_endpoint` overrides the address registered with gateways. Leave it
# empty when the bound address is reachable; set it for a wildcard or loopback
# bind that gateways reach through another address. Names are registered as
# written and resolved by the gateway on each dial.
#
#   server:
#     endpoint: "[::]:8080"
#     advertise_endpoint: "yanet-route-operator.yanet:8080"

# Per-gateway device ownership: maps a gateway name to the devices its
# dataplane instance owns. The operator pushes each gateway only the FIB
# nexthops on its devices. An empty or unlisted gateway gets the full FIB.
#
#   gateway_devices:
#     numa0: [kni0, eth0]
gateway_devices: {}

# Heartbeat interval for self-registration with each gateway's module
# registry.
register:
  interval: 30s

# Reconcile loop: snapshot RIB + neighbour-table -> build FIB ->
# fan-out per-gateway.
#
# Backoffs apply on per-gateway push errors.
reconcile:
  interval: 30s
  initial_backoff: 500ms
  max_backoff: 30s

# The single network function published by the operator on every
# gateway.
#
# Re-applied every reconcile pass (idempotent). One operator manages exactly
# one function with one chain and one route module.
function:
  name: "fn:route"
  chain: "default"
  weight: 1
  module: "route0"

# Static seed data applied on startup, before serving requests.
static:
  # Static routes seeded into the operator RIB (module above).
  routes:
    - prefix: 2a02:6b8:c00::/40
      nexthop_addr: fe80::1
      # interface: eth0  # Required only when netlink_sidecar is enabled.
    - prefix: 2a02:6b8:fc00::/40
      nexthop_addr: fe80::1
      # interface: eth0  # Required only when netlink_sidecar is enabled.
  # Static neighbour entries seeded into operator-managed tables.
  neighbours: []

# Mapping from OS interface names to logical dataplane device names.
#
# With sidecar publication enabled, use the same mapping as the sidecar so
# configured static interfaces resolve against the published neighbour devices.
link_map: {}

# RIB session TTL — stale FeedRIB sessions are garbage-collected
# after this duration once superseded by a newer session id.
rib_ttl: 5m

# Kernel neighbour discovery via netlink (ND/ARP). Disable when
# the operator is not running on a host with the same network
# namespace as the dataplane.
netlink_monitor:
  disabled: false
  table_name: kernel
  default_priority: 100

# Publish the configured static-route snapshot to the host netlink sidecar,
# trying gateway connections in order until one succeeds. Disabled preserves
# legacy RIB-only seeding.
#
# Static interfaces also constrain dataplane egress after link-name mapping.
# One prefix and next-hop pair cannot use multiple interfaces. Readiness
# consumers must include the whole-pass "reconcile" scope when this is enabled.
netlink_sidecar:
  enabled: false
  update_timeout: 30s

# Readiness probes reported to the gateway.
#
# expect_bird: set to true when a BIRD adapter is expected; the rib scope
# stays NOT_READY (SYNCING) until the FeedRIB update rate settles, then
# becomes READY for the duration of the session. Set false for static-only
# deployments; rib scope is driven by route presence only.
readiness:
  expect_bird: false
  # rate_threshold: maximum RIB updates/sec below which the bulk-load
  # gate starts counting toward the stability window.
  rate_threshold: 50
  # stability_window: how long the update rate must stay below
  # rate_threshold before the "rib" scope is marked ready.
  stability_window: 5s
  # sample_interval: how often the rate helper samples the update counter.
  sample_interval: 1s
  # reconnect_grace: diagnostics-only — after a BIRD session ends, the
  # bird-session reason flips from RECONNECTING to DOWN once this duration
  # elapses without a new session. Has no effect on the rib scope or on
  # announce decisions; tune for observability only.
  reconnect_grace: 15s
