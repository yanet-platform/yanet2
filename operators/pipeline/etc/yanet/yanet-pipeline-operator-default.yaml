logging:
  level: debug

gateways:
  - name: numa0
    endpoint: "[::1]:8080"
    # TLS towards the gateway.
    #
    # Absent: plaintext. Present, even empty: TLS with the system roots.
    #
    #   tls:
    #     # PEM bundle that replaces the system roots.
    #     ca_file: /etc/yanet2/tls/ca.pem
    #     # Client certificate, both files or neither.
    #     cert_file: /etc/yanet2/tls/operator.pem
    #     key_file: /etc/yanet2/tls/operator.key
    #     # Host the server certificate is checked against, defaults to the
    #     # host of the endpoint.
    #     server_name: gateway.numa0

register:
  interval: 30s

reconcile:
  interval: 30s
  initial_backoff: 500ms
  max_backoff: 30s

stages:
  - name: bootstrap
    pipelines:
      - name: main
        functions:
          - "fn:decap"
          - "fn:acl"
          - "fn:route"
      - name: bypass
        functions: []
    devices:
      plain:
        - name: virtio_user_kni0
          input:
            - name: main
              weight: 1
          output:
            - name: bypass
              weight: 1
      vlan: []
  - name: production
    pipelines:
      - name: main
        functions:
          - "fn:decap"
          - "fn:acl"
          - "fn:pdump"
          - "fn:route"
      - name: bypass
        functions: []
    devices:
      plain:
        - name: virtio_user_kni0
          input:
            - name: main
              weight: 1
          output:
            - name: bypass
              weight: 1
      vlan: []
