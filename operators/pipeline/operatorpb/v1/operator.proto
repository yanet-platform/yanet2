syntax = "proto3";

package operators.pipeline.operatorpb.v1;

option go_package = "github.com/yanet-platform/yanet2/operators/pipeline/operatorpb/v1;operatorpb";

import "common/commonpb/v1/metric.proto";

// PipelineOperatorService is the intent surface for pipeline lifecycle
// management.
//
// Intentionally deferred: RPCs (SetTargetStage / Activate / Deactivate) will
// be added once the YAML-bootstrap workflow proves out.
service PipelineOperatorService {}

service MetricsService {
  // GetMetrics returns a snapshot of operator runtime metrics.
  rpc GetMetrics(common.commonpb.v1.GetMetricsRequest) returns (common.commonpb.v1.GetMetricsResponse);
}
