        - from: 1770
          to: 1771
        - from: 1774
          to: 1775
        - from: 1778
          to: 1779
        - from: 1782
          to: 1783
        - from: 1786
          to: 1787
        - from: 1790
          to: 1791
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0


  # Deny TCP RST
  # 4
  # add deny tcp from any to any tcpflags rst
  - Filter:
      Src4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges:
        - from: 1540
          to: 1543
        - from: 1548
          to: 1551
        - from: 1556
          to: 1559
        - from: 1564
          to: 1567
        - from: 1572
