#  ACL Rules Configuration
#  =============================================
#
#  Формат: YAML
#
#  Структура:
#    Rule:
#      - Filter:    # Условия фильтрации
#          Src6s:   # IPv6 источники (массив)
#            - ip: string   # Адрес
#              prefix: int  # Длина префикса (0-128)
#          Src4s:   # IPv4 источники (аналогично)
#            - ip: string   # Адрес
#              prefix: int  # Длина префикса (0-128)
#          DstPortRanges:   # Диапазоны портов
#            - from: int
#              to: int
#          ProtoRanges:     # Диапазоны протоколов
#                           # Значения from/to содержат:
#                               - В старшем байте (биты 8-15): номер протокола (IPPROTO_*)
#                               - В младшем байте (биты 0-7): параметры протокола (тип ICMP, для TCP - флаги итд)
#            - from: int
#              to: int
#          Devices:
#          KeepState: bool  # Сохранять состояние
#        Action:      enum(Pass|Deny|Count|CheckState)
#        Log:         bool  # Логировать действие
#        SkipToCount: int   # Количество SkipTo, которые привели к этому правилу в изначальном рулсете (0 по умолчанию)
#

Rule:
  # ===== BASIC ALLOW/DENY RULES =====
  # Allow UDP 192.0.2.2 -> 192.0.3.1 ports 150-450,600
  # 1
  # add allow udp from 192.0.2.2 to 192.0.3.1 150-450,600
  - Filter:
      Src4s:
        - ip: "192.0.2.2"
          prefix: 32
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 150
          to: 450
        - from: 600
          to: 600
      ProtoRanges:
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # Deny UDP 192.0.2.99 -> 192.0.3.1 port 600
  # 2
  # add deny udp from 192.0.2.99 to 192.0.3.1 600
  - Filter:
      Src4s:
        - ip: "192.0.2.99"
          prefix: 32
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 600
          to: 600
      ProtoRanges:
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # ===== PROTOCOL-SPECIFIC RULES =====
  # Allow TCP SYN (setup flag)
  # 3
  # add allow tcp from 192.0.2.2 to 192.0.3.1 600 tcpflags syn
