      Src4s:
        - ip: "192.0.2.2"
          prefix: 32
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 600
          to: 600
      ProtoRanges: # all protos where for i := 1 to 255: i & SYN != 0 (SYN = 0x02)
        - from: 1538
          to: 1539
        - from: 1542
          to: 1543
        - from: 1546
          to: 1547
        - from: 1550
          to: 1551
        - from: 1554
          to: 1555
        - from: 1558
          to: 1559
        - from: 1562
          to: 1563
