        - from: 1772
          to: 1775
        - from: 1780
          to: 1783
        - from: 1788
          to: 1791
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # Allow ICMP Echo
  # 5
  # add allow icmp from 192.0.2.2 to 192.0.3.1 icmptypes 8
  - Filter:
      Src4s:
        - ip: "192.0.2.2"
          prefix: 32
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges:
        - from: 264
          to: 264
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # ===== PORT RANGE VALIDATION =====
  # Allow UDP ports 150-450
  # 6
  # add allow udp from 192.0.2.2 to 192.0.3.1 150-450
  - Filter:
      Src4s:
        - ip: "192.0.2.2"
          prefix: 32
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 150
          to: 450
      ProtoRanges:
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # ===== SUBNET VALIDATION =====
  # Allow subnet 192.0.2.0/24
  # 7
  # add allow udp from 192.0.2.0/24 to 192.0.3.1 600
  - Filter:
      Src4s:
        - ip: "192.0.2.0"
          prefix: 24
      Dst4s:
        - ip: "192.0.3.1"
          prefix: 32
      Src6s: []
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 600
          to: 600
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # Deny subnet 192.0.99.0/24
  # 8
  # add deny udp from 192.0.99.0/24 to any
  - Filter:
      Src4s:
        - ip: "192.0.99.0"
          prefix: 24
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # ===== IPv6 RULES =====
  # Allow TCPv6
  # 9
  # add allow tcp from 2001:db8::1 to 2001:db8::2 600
  - Filter:
      Src4s: []
      Dst4s: []
      Src6s:
        - ip: "2001:db8::1"
          prefix: 128
      Dst6s:
        - ip: "2001:db8::2"
          prefix: 128
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 600
          to: 600
      ProtoRanges: # TCPv6
        - from: 1536
          to: 1791
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # Allow ICMPv6 Echo
  # 10
  # add allow ipv6-icmp from 2001:db8::1 to 2001:db8::2 icmp6types 128,129
  - Filter:
      Src4s: []
      Dst4s: []
      Src6s:
        - ip: "2001:db8::1"
          prefix: 128
      Dst6s:
        - ip: "2001:db8::2"
          prefix: 128
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges: # ICMPv6 (128,129)
        - from: 14976
          to: 14976
        - from: 14977
          to: 14977
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # Deny UDPv6
  # 11
  # add deny udp from 2001:db8::99 to 2001:db8::2 600
  - Filter:
      Src4s: []
      Dst4s: []
      Src6s:
        - ip: "2001:db8::99"
          prefix: 128
      Dst6s:
        - ip: "2001:db8::2"
          prefix: 128
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 600
          to: 600
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # ===== OVERLAPPING RULES =====
  # Rule pyramid (ordered from most specific to most general)
  # 12
  # add allow udp from 192.0.2.0/31 to any 100-200
  - Filter:
      Src4s:
        - ip: "192.0.2.0"
          prefix: 31
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges:
        - from: 100
          to: 200
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # 13
  # add deny udp from 192.0.2.0/28 to any
  - Filter:
      Src4s:
        - ip: "192.0.2.0"
          prefix: 28
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # 14
  # add allow udp from 192.0.2.0/24 to any
  - Filter:
      Src4s:
        - ip: "192.0.2.0"
          prefix: 24
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Pass
    Log: false
    SkipToCount: 0

  # 15
  # add deny udp from 192.0.0.0/16 to any
  - Filter:
      Src4s:
        - ip: "192.0.0.0"
          prefix: 16
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: []
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges: # UDP
        - from: 4352
          to: 4607
      Devices: []
      KeepState: false
    Action: Deny
    Log: false
    SkipToCount: 0

  # ===== LOGGING =====
  # 16
  # add deny log all from any to any
  - Filter:
      Src4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Dst4s: # (IPv4 any)
        - ip: "0.0.0.0"
          prefix: 0
      Src6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      Dst6s: # (IPv6 any)
        - ip: "::"
          prefix: 0
      SrcPortRanges: # (all ports)
        - from: 0
          to: 65535
      DstPortRanges: # (all ports)
        - from: 0
          to: 65535
      ProtoRanges:
        - from: 0
          to: 65535
      Devices: []
      KeepState: false
    Action: Deny
    Log: true
    SkipToCount: 0
