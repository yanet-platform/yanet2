[package]
name = "yanet-cli-pdump"
version = "0.2.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "signal"] }
tonic = { version = "0.14", features = ["gzip", "zstd"] }
prost = "0.14"
ync = { path = "../../../cli/core", package = "yanet-cli" }
# Pinned exactly: semver sorts rc.N below rc1, so a caret requirement
# resolves back to rc1.
pcap-file = "=3.0.0-rc.3"
tokio-util = "0.7"
pnet_packet = "0.35"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
ync-build = { path = "../../../cli/ync-build", package = "yanet-cli-build" }
