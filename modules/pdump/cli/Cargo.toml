[package]
name = "yanet-cli-pdump"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["wrap_help"] }
clap_complete.workspace = true
