syntax = "proto3";

package modules.forward.controlplane.forwardpb.v1;

import "common/filterpb/v1/filter.proto";
import "common/commonpb/v1/ipv4network.proto";
import "common/commonpb/v1/ipv6network.proto";
import "common/commonpb/v1/metric.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/forward/controlplane/forwardpb/v1;forwardpb";

// ForwardService is a controlplane service for forwarding module.
service ForwardService {
  // ListConfigs returns all forward module configurations of all
  // dataplane instances.
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);

  // ShowConfig returns the current configuration for the forward module.
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);

  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // Allows to delete forward config if it is not referenced
  // by any pipeline.
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
}

// MetricsService exposes Forward module per-rule metrics.
service MetricsService {
  // GetMetrics returns a snapshot of Forward per-rule metrics.
  rpc GetMetrics(common.commonpb.v1.GetMetricsRequest) returns (common.commonpb.v1.GetMetricsResponse);
}

message Config {
  // TODO
}

message ListConfigsRequest {}

// ListConfigsResponse contains existing configurations.
message ListConfigsResponse { repeated string configs = 1; }

// ShowConfigResponse retrieves the runtime configuration for the forward
// module.
message ShowConfigRequest { string name = 1; }

// ShowConfigResponse contains the configuration details of the forward module.
message ShowConfigResponse {
  string name = 1;
  repeated Rule rules = 2;
}

enum ForwardMode {
  NONE = 0;
  IN = 1;
  OUT = 2;
}

message Rule {
  Action action = 1;

  repeated common.filterpb.v1.Device devices = 2;
  repeated common.filterpb.v1.VlanRange vlan_ranges = 3;
  repeated common.commonpb.v1.IPv4Network sources4 = 4;
  repeated common.commonpb.v1.IPv6Network sources6 = 5;
  repeated common.commonpb.v1.IPv4Network destinations4 = 6;
  repeated common.commonpb.v1.IPv6Network destinations6 = 7;
}

message Action {
  string target = 1;
  ForwardMode mode = 2;

  // Name of the per-rule dataplane counter.
  //
  // May be left empty. UpdateConfig then stores "to_" plus the rule's
  // target, bounded to the counter-name limit, so a rule applied through it
  // never carries an empty name. A config the dataplane received directly
  // through the C API still can, though ShowConfig does not report those.
  string counter = 3;
}

message UpdateConfigRequest {
  string name = 1;
  repeated Rule rules = 2;
}

message UpdateConfigResponse {}

// Delete config with specified name.
message DeleteConfigRequest {
  // Specifies module name and
  // dataplane instance of forward agent to delete.
  string name = 1;
}

message DeleteConfigResponse {}
