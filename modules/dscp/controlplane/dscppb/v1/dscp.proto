syntax = "proto3";

package modules.dscp.controlplane.dscppb.v1;

import "common/commonpb/v1/ipv4prefix.proto";
import "common/commonpb/v1/ipv6prefix.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/dscp/controlplane/dscppb/v1;dscppb";

// DscpService is a service for Differentiated Services Code Point module.
service DscpService {
  // ListConfigs returns all dscp module configurations of all
  // dataplane instances.
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);

  // ShowConfig returns the current configuration for the dscp module.
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);

  // UpdateConfig replaces the whole named configuration with the one the
  // request carries.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // AddPrefixes is replaced by UpdateConfig, and the server answers it with
  // Unimplemented.
  rpc AddPrefixes(AddPrefixesRequest) returns (AddPrefixesResponse) {
    option deprecated = true;
  }
  // RemovePrefixes is replaced by UpdateConfig, and the server answers it
  // with Unimplemented.
  rpc RemovePrefixes(RemovePrefixesRequest) returns (RemovePrefixesResponse) {
    option deprecated = true;
  }
  // SetDscpMarking is replaced by UpdateConfig, and the server answers it
  // with Unimplemented.
  rpc SetDscpMarking(SetDscpMarkingRequest) returns (SetDscpMarkingResponse) {
    option deprecated = true;
  }
  // DeleteConfig removes the named config when it is no longer referenced
  // by any pipeline.
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse) {}
}

message Config {
  // Source prefixes. A packet must match every nonempty direction's set;
  // a set without prefixes of the packet's address family never matches.
  repeated common.commonpb.v1.IPv4Prefix source_prefixes4 = 4;
  repeated common.commonpb.v1.IPv6Prefix source_prefixes6 = 5;
  // Destination prefixes. An empty destination set imposes no restriction
  // when a source set is present; two empty sets select no packets.
  repeated common.commonpb.v1.IPv4Prefix destination_prefixes4 = 1;
  repeated common.commonpb.v1.IPv6Prefix destination_prefixes6 = 2;
  DscpConfig dscp_config = 3;
}

message ListConfigsRequest {}

// ListConfigsResponse contains existing configurations.
message ListConfigsResponse { repeated string configs = 1; }

// ShowConfigResponse retrieves the runtime configuration for the dscp module.
message ShowConfigRequest { string name = 1; }

// DscpConfig contains the DSCP marking configuration.
message DscpConfig {
  // Flag indicates when to apply DSCP marking.
  // 0 - Never, 1 - Default (mark only if original DSCP is 0), 2 - Always
  uint32 flag = 1;
  // DSCP value to set
  uint32 mark = 2;
}

// ShowConfigResponse contains the configuration details of the dscp module.
message ShowConfigResponse { Config config = 1; }

// UpdateConfigRequest carries the whole desired configuration of the named
// config.
message UpdateConfigRequest {
  string name = 1;
  // Configuration that replaces the whole published one; required.
  //
  // Prefixes absent from it are removed, and an unset marking is the zero
  // one, which never marks.
  Config config = 2;
}

// UpdateConfigResponse is the response to an UpdateConfig call.
message UpdateConfigResponse {}

// AddPrefixesRequest is the request of the retired AddPrefixes call.
message AddPrefixesRequest {
  string name = 1;
  repeated common.commonpb.v1.IPv4Prefix prefixes4 = 2;
  repeated common.commonpb.v1.IPv6Prefix prefixes6 = 3;
}
message AddPrefixesResponse {}

// RemovePrefixesRequest is the request of the retired RemovePrefixes call.
message RemovePrefixesRequest {
  string name = 1;
  repeated common.commonpb.v1.IPv4Prefix prefixes4 = 2;
  repeated common.commonpb.v1.IPv6Prefix prefixes6 = 3;
}
message RemovePrefixesResponse {}

// SetDscpMarkingRequest is the request of the retired SetDscpMarking call.
message SetDscpMarkingRequest {
  string name = 1;
  DscpConfig dscp_config = 2;
}
message SetDscpMarkingResponse {}

// DeleteConfigRequest names the config to delete.
message DeleteConfigRequest { string name = 1; }

// DeleteConfigResponse is the response to a DeleteConfig call.
message DeleteConfigResponse {}
