syntax = "proto3";

package modules.fwstate.controlplane.fwstatepb.v1;

import "common/commonpb/v1/ipaddr.proto";
import "common/commonpb/v1/macaddr.proto";
import "common/commonpb/v1/metric.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/fwstate/controlplane/fwstatepb/v1;fwstatepb";

service FWStateService {
  // Updates the complete FWState configuration
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  // Allows to delete fwstate config if it is not referenced
  // by any pipeline.
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
  // Show specific FWState configuration
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);
  // List all FWState configurations across instances
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);
}

// MetricsService exposes FWState module metrics.
service MetricsService {
  // GetMetrics returns a snapshot of FWState module metrics.
  rpc GetMetrics(common.commonpb.v1.GetMetricsRequest) returns (common.commonpb.v1.GetMetricsResponse);
}

message UpdateConfigRequest {
  string name = 1;
  // Names of the published fwstate_map_v4 / fwstate_map_v6 objects whose
  // fwtables receive the synced state. Both are required: the module owns
  // neither family's table itself.
  string map_name_v4 = 2;
  string map_name_v6 = 3;
  SyncConfig sync_config = 4;
}

message UpdateConfigResponse {}

message ShowConfigRequest {
  string name = 1;
  bool ok_if_not_found = 2;
}

message ShowConfigResponse {
  string name = 1;
  string map_name_v4 = 3;
  string map_name_v6 = 4;
  SyncConfig sync_config = 5;
}

message DeleteConfigRequest { string name = 1; }

message DeleteConfigResponse {}

message ListConfigsRequest {}

message ListConfigsResponse { repeated string configs = 1; }

// Firewall state synchronization configuration
// SyncConfig carries the receive-side fwstate synchronization parameters:
// incoming-packet matching, connection timeouts, and the suppression
// window. The emission addressing for modules that synthesize sync
// packets lives with the ACL module's own configuration.
message SyncConfig {
  common.commonpb.v1.IPAddress src_addr = 1; // IPv6 source address stamped on forwarded internal frames;
  // Deprecated: the emission-side destination MAC moved to the ACL
  // module's SyncConfig; fwstate ignores this field.
  common.commonpb.v1.MACAddress dst_ether = 2 [ deprecated = true ];
  common.commonpb.v1.IPAddress dst_addr_multicast = 3; // Multicast IPv6 address matched on incoming sync packets;
  uint32 port_multicast = 4;                           // Multicast port. The applied config requires 1..65535. Zero keeps the current port on update.
  // Deprecated: the emission-side unicast destination moved to the ACL
  // module's SyncConfig; fwstate ignores this field.
  common.commonpb.v1.IPAddress dst_addr_unicast = 5 [ deprecated = true ];
  // Deprecated: see dst_addr_unicast.
  uint32 port_unicast = 6 [ deprecated = true ]; // Unused. Ignored by fwstate.

  // Connection timeouts
  uint64 tcp_syn_ack = 7; // TCP SYN-ACK timeout in nanoseconds;
  uint64 tcp_syn = 8;     // TCP SYN timeout in nanoseconds;
  uint64 tcp_fin = 9;     // TCP FIN timeout in nanoseconds;
  uint64 tcp = 10;        // TCP established timeout in nanoseconds;
  uint64 udp = 11;        // UDP timeout in nanoseconds;
  uint64 default = 12;    // Default timeout in nanoseconds;

  // Sync suppression window in nanoseconds. A sync frame for an alive entry
  // whose new expiry lands within this window of the current one is discarded
  // (the fwmap record is left untouched), debouncing refreshes for busy
  // sessions. Every entry TTL is inflated by this value so the effective
  // keep-alive never falls below the configured timeout.
  uint64 sync_suppress_timeout = 13;
}
