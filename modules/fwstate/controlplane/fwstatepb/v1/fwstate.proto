syntax = "proto3";

package modules.fwstate.controlplane.fwstatepb.v1;

import "common/commonpb/v1/ipaddr.proto";
import "common/commonpb/v1/metric.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/fwstate/controlplane/fwstatepb/v1;fwstatepb";

service FWStateService {
  // Creates or atomically updates the named FWState configuration.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  // Allows to delete fwstate config if it is not referenced
  // by any pipeline.
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
  // Show specific FWState configuration
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);
  // List all FWState configurations across instances
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);
}

// MetricsService exposes FWState module metrics.
service MetricsService {
  // GetMetrics returns a snapshot of FWState module metrics.
  rpc GetMetrics(common.commonpb.v1.GetMetricsRequest) returns (common.commonpb.v1.GetMetricsResponse);
}

// UpdateConfigRequest changes only the fields it carries, zero values included.
//
// An absent field keeps the stored value, and a missing config starts from
// the defaults. An update carrying sync endpoints or listeners replaces the
// whole list it carries; no_endpoints and no_listeners remove theirs. The
// merged config must pass validation.
message UpdateConfigRequest {
  string name = 1;
  // Names of the published fwstate_map_v4 / fwstate_map_v6 objects whose
  // fwtables receive the synced state.
  //
  // The module owns neither family's table itself. An empty name unlinks that
  // family. A config without a link inserts no state for that family.
  optional string map_name_v4 = 2;
  optional string map_name_v6 = 3;
  SyncConfig sync_config = 4;
}

message UpdateConfigResponse {}

message ShowConfigRequest {
  string name = 1;
  bool ok_if_not_found = 2;
}

message ShowConfigResponse {
  string name = 1;
  string map_name_v4 = 3;
  string map_name_v6 = 4;
  SyncConfig sync_config = 5;
}

message DeleteConfigRequest { string name = 1; }

message DeleteConfigResponse {}

message ListConfigsRequest {}

message ListConfigsResponse { repeated string configs = 1; }

// One emission destination.
//
// Every endpoint receives a copy of each locally emitted sync packet,
// stamped with the endpoint's source and destination.
message SyncEndpoint {
  common.commonpb.v1.IPAddress src_addr = 1; // IPv6 source stamped on packets emitted toward dst_addr;
  common.commonpb.v1.IPAddress dst_addr = 2; // IPv6 destination of emitted packets;
  optional uint32 port = 3;                  // Destination port, 1..65535;
}

// One receive destination: an incoming packet naming it by IPv6 address and
// UDP port is claimed as external sync. Emission and reception are
// independent: a config listens without emitting, emits without listening,
// or does both on different addresses. A unicast listener names the
// router's own address and receives point-to-point sync.
message SyncListenEndpoint {
  common.commonpb.v1.IPAddress dst_addr = 1; // IPv6 destination matched on the wire;
  optional uint32 port = 2;                  // Destination port, 1..65535;
}

// SyncConfig carries the emission destinations, the receive listeners and
// the state-update parameters: timeouts and the suppression window.
//
// Both lists are optional: a config naming no endpoint emits nothing, one
// naming no listener claims no external sync traffic; state events ACL
// stashes in the linked maps are applied either way. An update carrying a
// list replaces it whole; no_endpoints and no_listeners remove theirs.
message SyncConfig {
  repeated SyncEndpoint endpoints = 1;
  optional bool no_endpoints = 2;               // Removes every emission endpoint when true;
  repeated SyncListenEndpoint listeners = 3;    // Receive contract, independent of emission;
  optional bool no_listeners = 4;               // Removes every listener when true;

  // Connection timeouts
  optional uint64 tcp_syn_ack = 7; // TCP SYN-ACK timeout in nanoseconds;
  optional uint64 tcp_syn = 8;     // TCP SYN timeout in nanoseconds;
  optional uint64 tcp_fin = 9;     // TCP FIN timeout in nanoseconds;
  optional uint64 tcp = 10;        // TCP established timeout in nanoseconds;
  optional uint64 udp = 11;        // UDP timeout in nanoseconds;
  optional uint64 default = 12;    // Default timeout in nanoseconds;

  // Sync suppression window in nanoseconds. A sync frame for an alive entry
  // whose new expiry lands within this window of the current one is discarded
  // (the fwmap record is left untouched), debouncing refreshes for busy
  // sessions. Every entry TTL is inflated by this value so the effective
  // keep-alive never falls below the configured timeout.
  optional uint64 sync_suppress_timeout = 13;

  // Largest IPv6 packet, headers included, of one emitted sync packet; it
  // bounds how many frames a packet batches. The mbuf data room bounds the
  // packet as well, so a sync_mtu above it yields smaller packets. Zero
  // selects 1500; a nonzero value must hold one frame (at least 104) and fit
  // in 16 bits.
  optional uint32 sync_mtu = 14;
}
