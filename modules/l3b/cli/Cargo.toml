[package]
name = "yanet-cli-l3b"
version = "0.2.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
ync = { path = "../../../cli/core", package = "yanet-cli" }
commonpb = { path = "../../../common/rust/commonpb", package = "yanet-commonpb" }
filterpb = { path = "../../../common/rust/filterpb", package = "yanet-filterpb" }
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
tonic = { version = "0.14", features = ["gzip", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
unsafe-libyaml = "0.2"
tabled = { version = "0.22", default-features = false, features = ["ansi", "derive"] }

[build-dependencies]
ync-build = { path = "../../../cli/ync-build", package = "yanet-cli-build" }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "time"] }
zstd = "0.13"
