[package]
name = "yanet-cli-l3b"
version = "0.2.0"
edition = "2024"
publish = false

rust-version = "1.99"

[lints]
workspace = true

[dependencies]
ync = { path = "../../../cli/core", package = "yanet-cli" }
commonpb = { path = "../../../common/rust/commonpb", package = "yanet-commonpb" }
filterpb = { path = "../../../common/rust/filterpb", package = "yanet-filterpb" }
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tabled = { version = "0.22", default-features = false, features = ["ansi", "derive"] }

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
