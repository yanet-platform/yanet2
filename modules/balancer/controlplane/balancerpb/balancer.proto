syntax = "proto3";

package balancerpb;

import "modules/balancer/controlplane/balancerpb/common.proto";
import "modules/balancer/controlplane/balancerpb/filter.proto";
import "modules/balancer/controlplane/balancerpb/memory.proto";
import "modules/balancer/controlplane/balancerpb/state.proto";

import "common/commonpb/metric.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/balancer/controlplane/balancerpb;balancerpb";

// Balancer service.
//
// Provides management operations for load balancer instances including
// configuration, real server updates, statistics, and runtime information.
service Balancer {
	// Create or update a balancer configuration.
	//
	// This RPC operates in two distinct modes:
	//
	// CREATE MODE (balancer doesn't exist):
	// - Creates a new balancer instance with the specified name
	// - ALL fields in BalancerConfig must be provided (including optional)
	// - refresh_period in StateConfig is REQUIRED
	// - Initializes session table and starts background tasks
	// - Returns error if any required field is missing
	//
	// UPDATE MODE (balancer exists):
	// - Updates existing balancer configuration
	// - Non-optional fields in PacketHandlerConfig MUST be provided:
	//	 * vs (virtual services list)
	//	 * source_address_v4
	//	 * source_address_v6
	//	 * decap_addresses
	//	 * sessions_timeouts
	// - Optional fields in StateConfig (only updated if specified):
	//	 * session_table_capacity
	//	 * session_table_max_load_factor
	//	 * adjust_weights_config
	//	 * refresh_period (if set to 0, disables periodic refresh)
	// - Session table may be resized if capacity changes
	// - Background tasks are restarted with new configuration
	//
	// Validation:
	// - Virtual service identifiers must be unique
	// - Pure L3 services (pure_l3=true) must have port=0
	// - No conflicting virtual services allowed
	//
	// Returns error if validation fails or operation cannot be completed.
	rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);

    // List all balancers.
	//
	// Returns a list of all balancer instances currently managed
	// by the controlplane
	rpc ListBalancers(ListBalancersRequest) returns (ListBalancersResponse);

	rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

    rpc GetState(GetStateRequest) returns (GetStateResponse);

    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

	rpc GetMemoryUsage(GetMemoryUsageRequest) returns (GetMemoryUsageResponse);

    // List active sessions.
	//
	// Returns detailed information about all active sessions tracked
	// by the balancer, including client addresses, virtual service
	// mappings, real server assignments, and timeout information.
	rpc ListSessions(ListSessionsRequest) returns (stream Session);

	// Update real server properties.
	//
	// Allows modifying real server weights and enabled/disabled state
	// without recreating the entire virtual service configuration.
	//
	// Supports two modes:
	// - Immediate: Updates are applied immediately (buffer=false)
	// - Buffered: Updates queued and applied atomically on flush
	//	 (buffer=true)
	//
	// Buffered mode is useful for applying multiple updates atomically
	// to avoid intermediate inconsistent states.
	rpc UpdateReals(UpdateRealsRequest) returns (UpdateRealsResponse);

	// Flush buffered real server updates.
	//
	// Applies all previously buffered real server updates atomically.
	// This ensures that all updates take effect simultaneously, avoiding
	// intermediate states where only some updates are applied.
	//
	// Returns the number of updates that were flushed.
	rpc FlushReals(FlushRealsRequest) returns (FlushRealsResponse);

	// Update specific virtual services.
	//
	// This RPC allows partial updates to the virtual services configuration
	// without requiring the full configuration to be provided. Only the
	// virtual services specified in the request are updated or added.
	//
	// Behavior:
	// - Virtual services in the request that already exist are replaced
	// - Virtual services in the request that don't exist are added
	// - Virtual services not in the request remain unchanged
	// - Full VS configuration must be provided for each VS in the request
	//
	// The response includes filter reuse metadata, but only for the virtual
	// services that were included in the update request. This allows
	// tracking which ACL filters were reused vs recompiled for the updated
	// VSs.
	//
	// Note: VS matcher filters (IPv4/IPv6) may be recompiled if the set of
	// VS identifiers changes.
	rpc UpdateVS(UpdateVSRequest) returns (UpdateVSResponse);

	// Delete specific virtual services.
	//
	// This RPC removes the specified virtual services from the balancer
	// configuration. Other virtual services remain unchanged.
	//
	// Behavior:
	// - Virtual services matching the identifiers in the request are
	// removed
	// - Virtual services not in the request remain unchanged
	// - Deleting a non-existent VS is not an error (idempotent)
	// - Active sessions for deleted VSs will eventually time out
	//
	// The response includes filter reuse metadata with an empty ACL reuse
	// list, since deleted VSs don't have ACL filters to reuse.
	//
	// Note: VS matcher filters (IPv4/IPv6) will be recompiled since the
	// set of VS identifiers changes.
	rpc DeleteVS(DeleteVSRequest) returns (DeleteVSResponse);
}

message GetMetricsRequest {
}

message GetMetricsResponse {
	// List of metrics
	repeated commonpb.Metric metrics = 1;
}

///////////////////////////////////////////////////////////////////////////////

// Request to create or update a balancer configuration.
message SetConfigRequest {
	// Balancer instance name (required).
	//
	// Unique identifier for this balancer instance.
	// Used to reference the balancer in subsequent operations.
	string name = 1;

	// Balancer configuration.
	//
	// CREATE mode: All fields must be fully specified
	// UPDATE mode: See UpdateConfig RPC documentation for field
	// requirements
	BalancerConfig config = 2;
}

message VsReuseReport {
	VsIdentifier vs_identifier = 1;
	bool acl_reused = 2;
	bool selector_reused = 3;
}

message ReuseReport {
    // Whether the IPv4 virtual service matcher was reused.
	//
	// The VS matcher is the filter that maps incoming packets to
	// virtual services based on destination IP, port, and protocol.
	//
	// true: IPv4 VS matcher was reused (not recompiled)
	// false: IPv4 VS matcher was recompiled
	//
	// Note: Always false when created=true (no previous config to reuse).
	bool ipv4_vs_matcher_reused = 1;

	// Whether the IPv6 virtual service matcher was reused.
	//
	// true: IPv6 VS matcher was reused (not recompiled)
	// false: IPv6 VS matcher was recompiled
	//
	// Note: Always false when created=true (no previous config to reuse).
	bool ipv6_vs_matcher_reused = 2;

	bool ipv4_decap_filter_reused = 3;

	bool ipv6_decap_filter_reused = 4;

	repeated VsReuseReport vs_reuse_reports = 5;
}

// Response to UpdateConfig request.
//
// Contains the balancer name and metadata about filter reuse during the update.
message SetConfigResponse {
	string name = 1;
	optional ReuseReport reuse = 2;

	// As resize can be done to the bigger size, it returns the new capacity
	uint64 session_table_capacity = 3;
}

///////////////////////////////////////////////////////////////////////////////

// Request to update real server properties.
message UpdateRealsRequest {
	// Balancer instance name (optional, auto-selects if only one exists)
	optional string name = 1;

	// List of real server updates to apply.
	//
	// Each update can modify the weight and/or enabled state
	// of a specific real server within a virtual service.
	repeated RealUpdate updates = 2;

	// Buffer updates instead of applying immediately (optional).
	//
	// When true: Updates are queued and applied atomically on flush
	// When false: Updates are applied immediately
	//
	// Buffering is useful for applying multiple updates atomically
	// to avoid intermediate inconsistent states.
	bool buffer = 3;
}

// Response to UpdateReals request.
message UpdateRealsResponse {
	string name = 1;

	// Number of updates that were buffered (not yet applied).
	//
	// This field is non-zero only when buffer=true in the request.
	// These updates are queued and will be applied atomically when
	// FlushRealUpdates is called.
	//
	// Buffered updates are stored in memory and can be inspected via
	// ShowConfig (buffered_real_updates field).
	uint32 updates_buffered = 2;

	// Number of updates that were applied immediately.
	//
	// This field is non-zero only when buffer=false in the request.
	// These updates were applied directly to the balancer configuration
	// and dataplane state.
	//
	// Note: Either updates_buffered OR updates_applied will be non-zero,
	// never both (determined by the buffer flag in the request).
	uint32 updates_applied = 3;
}

///////////////////////////////////////////////////////////////////////////////

// Request to flush buffered real updates.
message FlushRealsRequest {
	// Balancer instance name (optional, auto-selects if only one exists)
	optional string name = 1;
}

// Response to FlushRealUpdates request.
message FlushRealsResponse {
	string name = 1;
	// Number of buffered updates that were flushed and applied
	uint64 updates_flushed = 2;
}

///////////////////////////////////////////////////////////////////////////////

// Request to show balancer configuration.
message GetConfigRequest {
	// Balancer instance name (optional, auto-selects if only one exists)
	optional string name = 1;
}

// Response containing balancer configuration.
message GetConfigResponse {
	// Balancer instance name
	string name = 1;

	// Current balancer configuration
	BalancerConfig config = 2;

	// Real server updates that are buffered but not yet applied.
	//
	// These updates will be applied when FlushRealUpdates is called.
	// Empty if no updates are buffered.
	repeated RealUpdate buffered_real_updates = 3;
}

// Request to list all balancer configurations.
message ListBalancersRequest {
}

// Response containing list of balancer names.
message ListBalancersResponse {
	// Names of all balancer instances
	repeated string names = 1;
}

// Request to show active sessions.
message ListSessionsRequest {
	// Balancer instance name (optional, auto-selects if only one exists)
	optional string name = 1;

    optional Filter filter = 2;
}

// Response containing active session information.
message ListSessionsResponse {
	// Balancer instance name
	string name = 1;

	// List of all active sessions.
	//
	// Each session includes client information, virtual service mapping,
	// real server assignment, creation time, last packet time, and timeout.
	repeated Session sessions = 2;
}

// Request to show memory usage inspection.
message GetMemoryUsageRequest {
	optional string name = 1;
	optional Filter filter = 2;
}

// Response containing memory usage inspection.
message GetMemoryUsageResponse {
	// Agent-level memory inspection including all balancers
	AgentMemoryUsage memory_usage = 1;
}

// Request to update specific virtual services.
//
// Allows partial updates to the VS configuration by specifying only
// the virtual services that need to be updated or added.
message UpdateVSRequest {
	// Balancer instance name (optional, auto-selects if only one exists).
	//
	// If not specified and exactly one balancer manager exists, that
	// manager is automatically selected. If multiple managers exist,
	// the name must be explicitly provided.
	optional string name = 1;

	// List of virtual services to update or add.
	//
	// Each VS must include a complete configuration. VSs with matching
	// identifiers in the current config will be replaced; new identifiers
	// will be added. VSs not in this list remain unchanged.
	repeated VirtualService services = 2;
}

// Response to UpdateVS request.
//
// Contains the balancer name and metadata about filter reuse during the update.
message UpdateVSResponse {
	// Balancer instance name that was updated.
	string name = 1;
    ReuseReport reuse = 2;
}

// Request to delete specific virtual services.
//
// Removes the specified virtual services from the balancer configuration
// while leaving other virtual services unchanged.
message DeleteVSRequest {
	// Balancer instance name (optional, auto-selects if only one exists).
	//
	// If not specified and exactly one balancer manager exists, that
	// manager is automatically selected. If multiple managers exist,
	// the name must be explicitly provided.
	optional string name = 1;

	// List of virtual services to delete.
	//
	// Only the VS identifiers (id field) are used for matching; other
	// fields in the VirtualService message are ignored. VSs with matching
	// identifiers will be removed from the configuration.
	repeated VirtualService services = 2;
}

// Response to DeleteVS request.
//
// Contains the balancer name and metadata about filter reuse during the update.
message DeleteVSResponse {
	// Balancer instance name that was updated.
	string name = 1;
    ReuseReport reuse = 2;
}

message GetStateRequest {
	optional string name = 1;

	optional PacketHandlerRef packet_handler_ref = 2;

	optional Filter filter = 3;

	bool include_counters = 4;
}

message GetStateResponse { 
	repeated BalancerState state = 1;
}