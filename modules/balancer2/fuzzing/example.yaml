# Example sidecar runtime configuration for the balancer2 fuzzing CLI.
#
# Run with:
#   balancer2-fuzzer -config modules/balancer2/fuzzing/example.yaml
#
# All durations use Go time.ParseDuration syntax (e.g. "10ms", "30s", "5s").
# A zero or missing seed causes the loader to generate a non-zero seed and
# log it for replay.

endpoint: "[::1]:8080"
corpus_path: "appbalancer.services.conf"
config_name: "balancer0"
operation_interval: "10ms"
update_vs_every: 10
stats_interval: "30s"
request_timeout: "60s"
seed: 12345

# Virtual services that must remain present in every config the fuzzer
# produces. DeleteVS never removes a fixed VS. Each entry must match a
# virtual_server defined in the corpus.
#
# An entry is either a bare "addr:port" / "addr:port/proto" string (proto
# defaults to tcp; IPv6 uses the bracketed form), or a mapping that also
# pins the allowed sources so they stay constant for the whole run. Each
# pinned source is a CIDR whose family matches the virtual service family.
fixed_virtual_services:
  - vs: "[2a02:6b8:0:3400:0:853a:0:3]:80/tcp"
    allowed_sources:
      - "::/0"
  - vs: "[2a02:6b8:0:3400:0:853a:0:3]:80/udp"
    allowed_sources:
      - "::/0"

