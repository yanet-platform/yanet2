# Example sidecar runtime configuration for the balancer2 fuzzing CLI.
#
# Run with:
#   balancer2-fuzzer -config modules/balancer2/fuzzing/example.yaml
#
# All durations use Go time.ParseDuration syntax (e.g. "10ms", "30s", "5s").
# A zero or missing seed causes the loader to generate a non-zero seed and
# log it for replay.

endpoint: "[::1]:8080"
corpus_path: "appbalancer.services.conf"
config_name: "balancer0"
operation_interval: "10ms"
update_vs_every: 10
stats_interval: "30s"
request_timeout: "60s"
seed: 12345

# Virtual services that must remain present in every config the fuzzer
# produces. DeleteVS never removes a fixed VS. Each entry is "addr:port" or
# "addr:port/proto" (proto defaults to tcp); IPv6 uses the bracketed form.
# Every entry must match a virtual_server defined in the corpus.
fixed_virtual_services:
  - "213.180.204.242:443"
  - "[2a02:6b8::242]:443/tcp"

