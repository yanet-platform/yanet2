syntax = "proto3";

package modules.acl.controlplane.aclpb.v1;

import "common/filterpb/v1/filter.proto";
import "common/commonpb/v1/ipv4network.proto";
import "common/commonpb/v1/ipv6network.proto";
import "common/commonpb/v1/metric.proto";
import "common/commonpb/v1/ipaddr.proto";
import "common/commonpb/v1/macaddr.proto";

option go_package = "github.com/yanet-platform/yanet2/modules/acl/controlplane/aclpb/v1;aclpb";

// ACLService is a service for ACL module.
service ACLService {
  // Updates the complete ACL configuration with a new set of rules
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  // Allows to delete acl config if it is not referenced
  // by any pipeline.
  rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
  // Show specific ACL configuration
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);
  // List all ACL configurations across instances
  rpc ListConfigs(ListConfigsRequest) returns (ListConfigsResponse);
  // Returns per-rule counters of ACL configurations
  rpc GetRulesCounters(GetRulesCountersRequest) returns (GetRulesCountersResponse);
}

// MetricsService exposes ACL module metrics.
service MetricsService {
  // GetMetrics returns a snapshot of ACL module metrics, excluding per-rule counters.
  rpc GetMetrics(common.commonpb.v1.GetMetricsRequest) returns (common.commonpb.v1.GetMetricsResponse);
  // GetMetricsRules returns the per-rule counter metrics GetMetrics leaves out.
  rpc GetMetricsRules(GetMetricsRulesRequest) returns (common.commonpb.v1.GetMetricsResponse);
}

message UpdateConfigRequest {
  string name = 1;
  repeated Rule rules = 2;
  // fwtable_name_v4 references a standalone fwstate-map (kind V4) whose
  // fwtable this ACL config uses for state lookups.
  //
  // A non-empty name always declares a link, whatever the rules use, and
  // must resolve to a registered object when the config is wired into a
  // pipeline — an unresolvable name fails the whole config apply. An empty
  // name declares no link, and state lookups find no state for that
  // family.
  string fwtable_name_v4 = 3;
  // fwtable_name_v6 references a standalone fwstate-map (kind V6) whose
  // fwtable this ACL config uses for state lookups.
  //
  // Same linking contract as fwtable_name_v4.
  string fwtable_name_v6 = 4;
  // sync_config carries the emission-side synchronization parameters the
  // ACL dataplane uses for CREATE_STATE sync packets.
  //
  // Required when any rule uses ACTION_KIND_CREATE_STATE; otherwise
  // optional.
  SyncConfig sync_config = 5;
}

message UpdateConfigResponse {}

message ShowConfigRequest { string name = 1; }

message ShowConfigResponse {
  string name = 1;
  repeated Rule rules = 2;
  // fwtable_name_v4 is the standalone fwstate-map (kind V4) this ACL config
  // references.
  string fwtable_name_v4 = 4;
  // fwtable_name_v6 is the standalone fwstate-map (kind V6) this ACL config
  // references.
  string fwtable_name_v6 = 5;
  // sync_config is the emission-side synchronization parameters this ACL
  // config uses, absent when the config carries none.
  SyncConfig sync_config = 6;
}

message Rule {
  repeated Action actions = 1;
  string counter = 2;

  repeated common.filterpb.v1.Device devices = 3;
  repeated common.filterpb.v1.VlanRange vlan_ranges = 4;
  // srcs and dsts carry mixed-family networks with free-form byte
  // masks; they remain accepted for backward compatibility and merge
  // with the typed lists below. New clients use the typed lists, which
  // make invalid mask shapes unrepresentable.
  repeated common.filterpb.v1.IPNet srcs = 5 [deprecated = true];
  repeated common.filterpb.v1.IPNet dsts = 6 [deprecated = true];
  repeated common.filterpb.v1.ProtoRange proto_ranges = 7;
  repeated common.filterpb.v1.PortRange src_port_ranges = 8;
  repeated common.filterpb.v1.PortRange dst_port_ranges = 9;
  common.filterpb.v1.Fragment fragment = 10;
  repeated common.commonpb.v1.IPv4Network sources4 = 11;
  repeated common.commonpb.v1.IPv6Network sources6 = 12;
  repeated common.commonpb.v1.IPv4Network destinations4 = 13;
  repeated common.commonpb.v1.IPv6Network destinations6 = 14;
}

message Action { ActionKind kind = 1; }

// Defines possible actions for matched traffic
enum ActionKind {
  ACTION_KIND_PASS = 0;
  ACTION_KIND_DENY = 1;
  ACTION_KIND_COUNT = 2;
  ACTION_KIND_CHECK_STATE = 4;
  ACTION_KIND_CREATE_STATE = 5;
  ACTION_KIND_LOG = 6;
}

// Delete config with specified name.
message DeleteConfigRequest {
  // Specifies module name and
  // dataplane instance of acl agent to delete.
  string name = 1;
}

message DeleteConfigResponse {}

message ListConfigsRequest {}

message ListConfigsResponse { repeated string configs = 1; }

// SyncConfig carries the emission-side state-sync addressing: the outer
// header fields of the sync frames a CREATE_STATE action synthesizes.
// The receive-side parameters (timeouts, suppression) belong to the
// fwstate module's own configuration.
message SyncConfig {
  common.commonpb.v1.MACAddress dst_ether = 1;         // Destination MAC address;
  common.commonpb.v1.IPAddress dst_addr_multicast = 2; // Multicast IPv6 address;
  uint32 port_multicast = 3;                           // Multicast port. Required. Accepted range: 1..65535.
  common.commonpb.v1.IPAddress dst_addr_unicast = 4;   // Unicast IPv6 address;
  uint32 port_unicast = 5;                             // Unicast port. Accepted range: 0..65535.
}

// Request for per-rule counters. An empty name returns the rule counters
// of every configuration.
message GetRulesCountersRequest {
  // Optional ACL configuration name.
  string name = 1;
}

// Positions to report per-rule counters of; an empty field matches every value.
message GetMetricsRulesRequest {
  string config = 1;
  string device = 2;
  string pipeline = 3;
  string function = 4;
  string chain = 5;
}

// One per-rule counter at the module position holding it.
message RuleCounter {
  string config = 1;
  string device = 2;
  string pipeline = 3;
  string function = 4;
  string chain = 5;
  // Rule counter name, as set on the rule.
  string counter = 6;
  uint64 packets = 7;
  uint64 bytes = 8;
}

message GetRulesCountersResponse { repeated RuleCounter counters = 1; }
