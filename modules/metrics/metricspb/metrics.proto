syntax = "proto3";

package metrics;
option go_package = "github.com/yanet-platform/yanet2/modules/metrics/metricspb";

import "commonpb/metric.proto";


service MetricsService {
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {}
}

message GetMetricsRequest {
  repeated commonpb.Metric metrics = 1;
}

message GetMetricsResponse {
  string metrics = 1;
}
