syntax = "proto3";

package metricspb;
option go_package = "github.com/yanet-platform/yanet2/modules/metrics/metricspb;metricspb";

import "commonpb/metric.proto";

service MetricsAdapter {
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {}
}

message GetMetricsRequest {}

message GetMetricsResponse { string metrics = 1; }
