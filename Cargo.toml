[workspace]

resolver = "2"

# Module CLI crates are listed explicitly rather than globbed.
#
# A glob would also match out-of-tree (gitignored) modules, and any
# workspace member necessarily lands in the tracked `Cargo.lock`. Contract:
# an out-of-tree module's CLI crate is not a workspace member, so it carries
# its own `[workspace]` table and is built through its own manifest path.
members = [
    "common/rust/commonpb",
    "common/rust/filterpb",
    "common/rust/readinesspb",
    "common/rust/ynpb",
    "cli/ync-build",
    "cli/rpc",
    "cli/core",
    "cli/modules/common",
    "cli/modules/inspect",
    "cli/modules/pipeline",
    "cli/modules/function",
    "cli/modules/counters",
    "cli/modules/gateway",
    "cli/modules/ready",
    "cli/modules/metrics",
    "cli/modules/device",
    "cli/modules/device-delete",
    "modules/acl/cli",
    "modules/blackhole/cli",
    "modules/decap/cli",
    "modules/dscp/cli",
    "modules/forward/cli",
    "modules/fwstate/cli",
    "modules/l3b/cli",
    "modules/mirror/cli",
    "modules/nat64/cli",
    "modules/pdump/cli",
    "modules/route-mpls/cli",
    "modules/route/cli",
    "modules/unrdup/cli",
    "devices/plain/cli",
    "devices/vlan/cli",
    "devices/vxlan/cli",
    "devices/trafgen/cli",
    "objects/fwstate/cli",
    "objects/ring/cli",
    "operators/pipeline/cli",
    "operators/route/cli/route",
    "operators/route/cli/neighbour",
]

[workspace.lints.rust]
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
std_instead_of_core = "deny"

[profile.release]
panic = "abort"

# CI builds the CLI with `--profile ci`; packages and local builds use release.
#
# LLVM spends most of a CLI build optimising the workspace crates, which are
# glue around dependencies that keep the release settings (TLS, compression,
# HTTP/2, YAML). Built for size, each binary-only crate in one codegen unit,
# they compile in about three quarters of the time, at a few percent of run
# time on the largest outputs. A new CLI crate gets an entry here; a missing
# one only builds slower, a stale one makes cargo warn. The build-script
# helper has none: like release, it builds unoptimised.
[profile.ci]
inherits = "release"

[profile.ci.package]
yanet-cli = { opt-level = "s" }
yanet-cli-acl = { opt-level = "s", codegen-units = 1 }
yanet-cli-blackhole = { opt-level = "s", codegen-units = 1 }
yanet-cli-common = { opt-level = "s", codegen-units = 1 }
yanet-cli-counters = { opt-level = "s", codegen-units = 1 }
yanet-cli-decap = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-delete = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-list = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-plain = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-trafgen = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-vlan = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-vxlan = { opt-level = "s", codegen-units = 1 }
yanet-cli-dscp = { opt-level = "s", codegen-units = 1 }
