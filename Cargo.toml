[workspace]

# The MSRV-aware resolver: a lock update prefers dependency versions that
# build on the members' rust-version.
resolver = "3"

# The Rust module SDK is a workspace of its own. Excluding it keeps cargo from
# taking this workspace as the root of its crates when a consumer reaches them
# by path through a crate of this one, which fails on the SDK's inherited
# fields.
exclude = ["bindings/rust"]

# Module CLI crates are listed explicitly rather than globbed.
#
# A glob would also match out-of-tree (gitignored) modules, and any
# workspace member necessarily lands in the tracked `Cargo.lock`. Contract:
# an out-of-tree module's CLI crate is not a workspace member, so it carries
# its own `[workspace]` table and is built through its own manifest path.
members = [
    "common/rust/commonpb",
    "common/rust/filterpb",
    "common/rust/readinesspb",
    "common/rust/ynpb",
    "cli/ync-build",
    "cli/rpc",
    "cli/core",
    "cli/modules/common",
    "cli/modules/inspect",
    "cli/modules/pipeline",
    "cli/modules/function",
    "cli/modules/counters",
    "cli/modules/gateway",
    "cli/modules/ready",
    "cli/modules/metrics",
    "cli/modules/device",
    "cli/modules/device-delete",
    "modules/acl/cli",
    "modules/blackhole/cli",
    "modules/decap/cli",
    "modules/dscp/cli",
    "modules/forward/cli",
    "modules/fwstate/cli",
    "modules/l3b/cli",
    "modules/mirror/cli",
    "modules/nat64/cli",
    "modules/pdump/cli",
    "modules/route-mpls/cli",
    "modules/route/cli",
    "modules/unrdup/cli",
    "devices/plain/cli",
    "devices/vlan/cli",
    "devices/vxlan/cli",
    "devices/trafgen/cli",
    "objects/fwstate/cli",
    "objects/ring/cli",
    "operators/pipeline/cli",
    "operators/route/cli/route",
    "operators/route/cli/neighbour",
]

# Every member takes these, so a release or toolchain bump edits one line.
[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
publish = false

# The workspace crates, every external crate two or more members use, and the
# tonic and prost crates released together with those.
#
# An entry carries only the features all its users share; a member adds its
# own on top. Any other dependency stays in the manifest of the member that
# uses it.
[workspace.dependencies]
commonpb = { path = "common/rust/commonpb", package = "yanet-commonpb" }
filterpb = { path = "common/rust/filterpb", package = "yanet-filterpb" }
readinesspb = { path = "common/rust/readinesspb", package = "yanet-readinesspb" }
ync = { path = "cli/core", package = "yanet-cli" }
ync-build = { path = "cli/ync-build", package = "yanet-cli-build" }
ync-rpc = { path = "cli/rpc", package = "yanet-cli-rpc" }
ynpb = { path = "common/rust/ynpb", package = "yanet-ynpb" }

bytesize = "2"
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
colored = "3"
http = "1"
humantime = "2"
log = "0.4"
netip = "0.5.0"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
tabled = { version = "0.22", default-features = false, features = ["ansi"] }
tempfile = "3"
tokio = "1"
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
std_instead_of_core = "deny"

[profile.release]
panic = "abort"

# CI builds the CLI with `--profile ci`; packages and local builds use release.
#
# LLVM spends most of a CLI build optimising the workspace crates, which are
# glue around dependencies that keep the release settings (TLS, compression,
# HTTP/2, YAML). Built for size, each binary-only crate in one codegen unit,
# they compile in about three quarters of the time, at a few percent of run
# time on the largest outputs. A new CLI crate gets an entry here; a missing
# one only builds slower, a stale one makes cargo warn. The build-script
# helper has none: like release, it builds unoptimised.
[profile.ci]
inherits = "release"

[profile.ci.package]
yanet-cli = { opt-level = "s" }
yanet-cli-acl = { opt-level = "s", codegen-units = 1 }
yanet-cli-blackhole = { opt-level = "s", codegen-units = 1 }
yanet-cli-common = { opt-level = "s", codegen-units = 1 }
yanet-cli-counters = { opt-level = "s", codegen-units = 1 }
yanet-cli-decap = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-delete = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-list = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-plain = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-trafgen = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-vlan = { opt-level = "s", codegen-units = 1 }
yanet-cli-device-vxlan = { opt-level = "s", codegen-units = 1 }
yanet-cli-dscp = { opt-level = "s", codegen-units = 1 }
yanet-cli-forward = { opt-level = "s", codegen-units = 1 }
yanet-cli-function = { opt-level = "s", codegen-units = 1 }
yanet-cli-fwstate = { opt-level = "s", codegen-units = 1 }
yanet-cli-fwstatemap = { opt-level = "s", codegen-units = 1 }
yanet-cli-gateway = { opt-level = "s", codegen-units = 1 }
yanet-cli-inspect = { opt-level = "s", codegen-units = 1 }
yanet-cli-l3b = { opt-level = "s", codegen-units = 1 }
yanet-cli-metrics = { opt-level = "s", codegen-units = 1 }
yanet-cli-mirror = { opt-level = "s", codegen-units = 1 }
yanet-cli-nat64 = { opt-level = "s", codegen-units = 1 }
yanet-cli-operator-neighbour = { opt-level = "s", codegen-units = 1 }
yanet-cli-operator-pipeline = { opt-level = "s", codegen-units = 1 }
yanet-cli-operator-route = { opt-level = "s", codegen-units = 1 }
yanet-cli-pdump = { opt-level = "s", codegen-units = 1 }
yanet-cli-pipeline = { opt-level = "s", codegen-units = 1 }
yanet-cli-ready = { opt-level = "s", codegen-units = 1 }
yanet-cli-ring = { opt-level = "s", codegen-units = 1 }
yanet-cli-route = { opt-level = "s", codegen-units = 1 }
yanet-cli-route-mpls = { opt-level = "s", codegen-units = 1 }
yanet-cli-rpc = { opt-level = "s" }
yanet-cli-unrdup = { opt-level = "s", codegen-units = 1 }
yanet-commonpb = { opt-level = "s" }
yanet-filterpb = { opt-level = "s" }
yanet-readinesspb = { opt-level = "s" }
yanet-ynpb = { opt-level = "s" }
