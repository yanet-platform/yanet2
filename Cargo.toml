[workspace]

resolver = "2"

# Module CLI crates are listed explicitly rather than globbed.
#
# A glob would also match out-of-tree (gitignored) modules, and any
# workspace member necessarily lands in the tracked `Cargo.lock`. Contract:
# an out-of-tree module's CLI crate is not a workspace member, so it carries
# its own `[workspace]` table and is built through its own manifest path.
members = [
    "common/rust/commonpb",
    "common/rust/filterpb",
    "common/rust/readinesspb",
    "common/rust/ynpb",
    "cli/core",
    "cli/modules/common",
    "cli/modules/inspect",
    "cli/modules/pipeline",
    "cli/modules/function",
    "cli/modules/counters",
    "cli/modules/gateway",
    "cli/modules/ready",
    "cli/modules/metrics",
    "cli/modules/device",
    "modules/acl/cli",
    "modules/balancer2/cli",
    "modules/blackhole/cli",
    "modules/decap/cli",
    "modules/dscp/cli",
    "modules/forward/cli",
    "modules/fwstate/cli",
    "modules/mirror/cli",
    "modules/nat64/cli",
    "modules/pdump/cli",
    "modules/route-mpls/cli",
    "modules/route/cli/route",
    "devices/plain/cli",
    "devices/vlan/cli",
    "devices/trafgen/cli",
    "operators/decap/cli",
    "operators/forward/cli",
    "operators/pipeline/cli",
    "operators/route/cli/route",
    "operators/route/cli/neighbour",
]

exclude = ["modules/route/cli"]

[profile.release]
panic = "abort"
