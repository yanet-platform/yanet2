name: 'YANET build setup'
description: 'Common build environment setup for build-sanitize and build-release jobs.'

inputs:
  profile:
    description: 'Profile id (asan, tsan, release) — scopes ccache and Go cache keys.'
    required: true
  install-llvm:
    description: 'Install LLVM 19 toolchain (needed for clang-tidy). Defaults to false.'
    required: false
    default: 'false'

outputs:
  dpdk-sha:
    description: 'DPDK submodule commit SHA pinned in the parent tree.'
    value: ${{ steps.dpdk.outputs.sha }}

runs:
  using: 'composite'
  steps:
    - name: update apt (act hack)
      if: ${{ env.ACT }}
      shell: bash
      run: apt-get update

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.94.0

    - name: Cache rust
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - uses: awalsh128/cache-apt-pkgs-action@v1.6.0
      with:
        packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq clang-tidy-19
        version: 1.3

    - name: Install latest git-restore-mtime
      shell: bash
      run: |
        # Ubuntu 24.04 ships git-restore-mtime 2022.12, which uses `git
        # whatchanged` internally. That command was deprecated in Git 2.51
        # and the runner has Git 2.54+, so the walk silently misbehaves and
        # ~25% of files end up in "WARNING: not found in the log" output,
        # defeating the build cache. v2025.08 uses `git log --raw` instead.
        VERSION=v2025.08
        DEST=/usr/local/bin/git-restore-mtime
        sudo curl -sSLo "$DEST" "https://raw.githubusercontent.com/MestreLion/git-tools/$VERSION/git-restore-mtime"
        sudo chmod +x "$DEST"
        echo "Installed git-restore-mtime $VERSION at $DEST"

    - name: Restore source mtimes from git history
      shell: bash
      run: git-restore-mtime

    - name: Install LLVM 19 toolchain
      if: ${{ inputs.install-llvm == 'true' }}
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "19.1.1"
        directory: ${{ runner.temp }}/llvm

    - name: Resolve DPDK submodule SHA
      id: dpdk
      shell: bash
      run: |
        sha="$(git ls-tree HEAD subprojects/dpdk | awk '{print $3}')"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "DPDK pinned at $sha"

    - uses: hendrikmuhs/ccache-action@v1.2.18
      with:
        key: ${{ runner.os }}-ccache-${{ inputs.profile }}
        max-size: 2G
        verbose: 2

    - uses: actions/setup-go@v5
      with:
        go-version: "1.24.13"
        cache: false
        check-latest: true

    - name: Get Go environment
      id: goenv
      shell: bash
      run: |
        echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Set up go cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.goenv.outputs.cache }}
          ${{ steps.goenv.outputs.modcache }}
        key: build-and-test-${{ inputs.profile }}-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          build-and-test-${{ inputs.profile }}-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
          build-and-test-${{ inputs.profile }}-${{ runner.os }}-go-

    - name: Install Go Protobuf Plugins
      shell: bash
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
