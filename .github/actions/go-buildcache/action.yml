name: 'Go build cache (restore)'
description: 'Restore compatible Go compilation snapshots for the selected build profile.'

inputs:
  profile:
    description: 'Build profile: release, asan, or race'
    required: true

outputs:
  path:
    description: 'Scoped absolute GOCACHE directory'
    value: ${{ steps.resolve.outputs.path }}
  key:
    description: 'Immutable snapshot key for the checked-out source and workflow run'
    value: ${{ steps.resolve.outputs.key }}
  cache-hit:
    description: 'True only on an exact-key match'
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Resolve the build cache location and compatibility
      id: resolve
      shell: bash
      env:
        CACHE_PROFILE: ${{ inputs.profile }}
        CACHE_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        case "$CACHE_PROFILE" in
          release|asan|race) ;;
          *) echo "Unsupported Go build cache profile: $CACHE_PROFILE" >&2; exit 1 ;;
        esac

        # Packages restored from the runner's APT cache bypass the package
        # database, so only a container image's packages identify the toolchain.
        if [[ ! -f /.dockerenv ]]; then
          echo "Go build cache requires a job that runs in a container" >&2
          exit 1
        fi

        path=$(go env GOCACHE)
        case "$path" in
          /*) ;;
          *) echo "Go build cache must have an absolute path: $path" >&2; exit 1 ;;
        esac

        # The image's packages cover every system native input.
        packages=$(dpkg-query -W -f='${Package}\t${Architecture}\t${Version}\t${Status}\n')
        if [[ -z "$packages" ]]; then
          echo "Go build cache requires installed package provenance" >&2
          exit 1
        fi
        native_hash=$(
          {
            printf 'native-scope=ci-image-packages-v1\0'
            printf '%s\n' "$packages" |
              LC_ALL=C sort
          } | sha256sum
        )
        native_hash=${native_hash%% *}
        if [[ ! "$native_hash" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Invalid Go build cache native fingerprint" >&2
          exit 1
        fi
        path="${path%/}/yanet-ci-${CACHE_PROFILE}-${native_hash}"

        . /etc/os-release
        goos=$(go env GOOS)
        goarch=$(go env GOARCH)
        goversion=$(go env GOVERSION)
        family="go-build-v2-${ID}-${VERSION_ID}-${goos}-${goarch}-${goversion}-${CACHE_PROFILE}-${native_hash}-"
        source=$(git rev-parse HEAD)
        echo "path=$path" >>"$GITHUB_OUTPUT"
        echo "key=${family}${source}-${CACHE_RUN_ID}" >>"$GITHUB_OUTPUT"
        echo "source-prefix=${family}${source}-" >>"$GITHUB_OUTPUT"
        echo "family-prefix=$family" >>"$GITHUB_OUTPUT"
        echo "GOCACHE=$path" >>"$GITHUB_ENV"

    - name: Restore the build cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}
        restore-keys: |
          ${{ steps.resolve.outputs.source-prefix }}
          ${{ steps.resolve.outputs.family-prefix }}
