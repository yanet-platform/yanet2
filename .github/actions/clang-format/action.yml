name: 'clang-format check'
description: 'Run clang-format on files matching given patterns'

inputs:
  include:
    description: 'Newline-separated file name patterns for find -name (e.g., *.h)'
    required: true
  exclude-regex:
    description: 'Extended regex to exclude file paths (grep -Ev)'
    required: false
    default: ''
  style:
    description: 'clang-format style'
    required: false
    default: 'file'

runs:
  using: 'docker'
  # Immutable digest pin: clang-format 19.1.7, built from llvmorg-19.1.7.
  # Read README.md before changing this line — a bump is a two-step process.
  image: 'docker://ghcr.io/yanet-platform/clang-format@sha256:d5929186c477ddddd58a03d81b4029c868d9736c1eedbf4f4bac30fd31a1b241'
