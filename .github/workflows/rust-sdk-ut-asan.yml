name: Rust SDK dataplane tests (ASan)

# The Go tests of the Rust module SDK fixtures (lib/rust) over the C dataplane
# harness under AddressSanitizer, with the Rust code instrumented.
# rust-sdk-ut.yml runs them natively and shares the setup steps below; change
# both files together.
#
# A pull request runs this job only when the Rust code changes; build.yml's
# ASan run does not build the fixtures, so a push to main runs it on every
# change the tests are built from or link, and a C change that breaks the
# plugins under ASan fails on main right after its merge. The job writes its
# ccache and cargo caches from main only, since a cache written on a
# pull-request ref is readable only from that pull request. The Go build cache
# has profiles of its own, since the cgo package of the fixtures is not in
# build.yml's.

on:
  push:
    branches: ["main"]
    paths:
      - "lib/rust/**"
      - "api/**.c"
      - "api/**.h"
      - "common/**.c"
      - "common/**.h"
      - "devices/plain/**.c"
      - "devices/plain/**.h"
      - "lib/**.c"
      - "lib/**.h"
      - "bindings/go/cerrors/**"
      - "bindings/go/dataplane_ut/**"
      - "common/go/dataplane/**"
      - "controlplane/ffi/**"
      - "devices/plain/bindings/go/cplain/**"
      - "**/meson.build"
      - "meson_options.txt"
      - "Makefile"
      - "scripts/go_cdeps.py"
      - "scripts/go_cgo_flags.py"
      - ".golangci.yml"
      - "go.mod"
      - "go.sum"
      - "subprojects/dpdk"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/go-modcache/**"
      - ".github/workflows/rust-sdk-ut-asan.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "lib/rust/**"
      - ".github/workflows/rust-sdk-ut-asan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # bindgen needs a clang and a libclang of the same LLVM major, both in the
  # CI image.
  CLANG_PATH: /usr/bin/clang-23
  LIBCLANG_PATH: /usr/lib/llvm-23/lib

defaults:
  run:
    # The runner's default shell, which container jobs would replace with sh.
    shell: bash -e {0}

permissions:
  contents: read

jobs:
  fixtures:
    name: fixture tests (asan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ghcr.io/yanet-platform/yanet2-ci@sha256:3cbb2aae05beb4efc16f160cfa4d5307deba5d3110005d6557fdb49e5e2ee7a1
    env:
      # The Makefile runs just these Go packages, and no meson tests.
      GO_TEST_PACKAGES: ./lib/rust/yanet-sdk-fixture-api/bindings/go/cfixture
      # Pinned with the rustfmt nightly, see rust-miri.yml.
      ASAN_TOOLCHAIN: nightly-2026-10-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: ccache
        with:
          key: ${{ runner.os }}-rust-sdk-ut-asan-image-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: rust-sdk-asan

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: ${{ env.ASAN_TOOLCHAIN }}

      - name: Configure meson
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: meson setup build -Dsdk_rust_fixtures=enabled

      # Meson has cargo build into this target directory.
      - name: Cache rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lib/rust -> ../../build/lib/rust/cargo-target
          shared-key: rust-sdk-ut-asan
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The target configures the sanitizers itself; meson then builds the
      # Rust code with the sanitizer of the nightly toolchain named here.
      - name: Test (ASan)
        env:
          RUSTUP_TOOLCHAIN: ${{ env.ASAN_TOOLCHAIN }}
        run: make test-asan-only

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}
