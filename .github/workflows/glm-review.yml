name: GLM Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review the pull request diff with GLM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post a GLM review comment for the diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_API_URL: ${{ vars.GLM_API_URL || 'https://api.z.ai/api/coding/paas/v4/chat/completions' }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-5.2' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$GLM_API_KEY" ]; then
            echo "Secret GLM_API_KEY is not configured; skipping review."
            exit 0
          fi

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be a pull request number." >&2
            exit 1
          fi

          pr=$(gh pr view "$PR_NUMBER" --json number,title,body,baseRefOid,headRefOid)
          PR_TITLE=$(jq -r '.title' <<<"$pr")
          PR_BODY=$(jq -r '.body // ""' <<<"$pr")
          BASE_SHA=$(jq -r '.baseRefOid' <<<"$pr")
          HEAD_SHA=$(jq -r '.headRefOid' <<<"$pr")
          git fetch origin "$BASE_SHA" "$HEAD_SHA"

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff "$merge_base" "$HEAD_SHA" \
            ':(exclude)package-lock.json' \
            ':(exclude)Cargo.lock' \
            ':(exclude)go.sum' \
            ':(exclude)*.pb.go' \
            ':(exclude)subprojects' \
            > full.diff

          if [ ! -s full.diff ]; then
            echo "No reviewable changes in the diff; skipping."
            exit 0
          fi

          max_bytes=$((256 * 1024))
          diff_bytes=$(wc -c < full.diff)
          truncate_note="The diff was complete."
          if [ "$diff_bytes" -gt "$max_bytes" ]; then
            head -c "$max_bytes" full.diff > review.diff
            truncate_note="The diff was truncated to ${max_bytes} of ${diff_bytes} bytes; only the first part was reviewed."
          else
            mv full.diff review.diff
          fi

          conventions=""
          added="|"
          while IFS= read -r name; do
            case $name in
              *.c|*.h) conv=.agents/conventions/c.md ;;
              *.go) conv=.agents/conventions/go.md ;;
              *.rs) conv=.agents/conventions/rust.md ;;
              *.ts|*.tsx) conv=.agents/conventions/ts.md ;;
              *) continue ;;
            esac
            case $added in
              *"|$conv|"*) continue ;;
            esac
            added="$added$conv|"
            if git cat-file -e "$BASE_SHA:$conv" 2>/dev/null; then
              conventions="$conventions

          $(git show "$BASE_SHA:$conv")"
            fi
          done < <(git diff --name-only "$merge_base" "$HEAD_SHA")
          [ -n "$conventions" ] || conventions="(none applicable)"

          stat=$(git diff --stat "$merge_base" "$HEAD_SHA" | head -n 200 || true)
          user=$(printf 'Pull request #%s: %s\n\n%s\n\nChanged files:\n```\n%s\n```\n\nDiff:\n```diff\n%s\n```\n' \
            "$PR_NUMBER" "$PR_TITLE" "${PR_BODY:0:2000}" "$stat" "$(cat review.diff)")

          system="You are an expert code reviewer for the YANET project: a DPDK software router with a C dataplane, Go control plane, Rust CLI, and TypeScript web UI.
          Review the pull request diff below and report only findings that matter: correctness bugs, memory safety, concurrency hazards, broken contracts, security issues, and missing test coverage for changed behavior.
          Do not comment on formatting or style unless it violates the repository conventions provided below.
          Answer in GitHub-flavored markdown: one short verdict line first, then findings ordered by severity, each referencing the file and the diff hunk it belongs to.
          If you find nothing significant, say so in one sentence.

          Repository conventions:
          $conventions

          /no_think"

          system_file=$(mktemp)
          user_file=$(mktemp)
          payload_file=$(mktemp)
          trap 'rm -f "$system_file" "$user_file" "$payload_file"' EXIT
          printf '%s' "$system" > "$system_file"
          printf '%s' "$user" > "$user_file"
          jq -n \
            --arg model "$GLM_MODEL" \
            --rawfile system "$system_file" \
            --rawfile user "$user_file" \
            '{model: $model, max_tokens: 65536, thinking: {type: "disabled"}, messages: [{role: "system", content: $system}, {role: "user", content: $user}]}' \
            > "$payload_file"

          review=""
          api_error="unknown error"
          for attempt in 1 2 3; do
            echo "Requesting GLM review, attempt $attempt of 3."
            if response=$(curl -sS --fail-with-body --max-time 600 \
              -H "Authorization: Bearer $GLM_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary "@$payload_file" \
              "$GLM_API_URL"); then
              if review=$(jq -er '.choices[0].message.content | select(type == "string" and length > 0)' <<<"$response" 2>/dev/null); then
                break
              fi
              api_error=$(jq -r '"finish_reason " + (.choices[0].finish_reason // "unknown") + ", " + ((.usage.completion_tokens // 0) | tostring) + " completion tokens"' <<<"$response" 2>/dev/null) || api_error="unparseable response"
              echo "Attempt $attempt: model returned no review content ($api_error)." >&2
              printf '%s\n' "$response" >&2
            else
              api_error="curl exit $?"
              echo "Attempt $attempt: API request failed ($api_error)." >&2
              printf '%s\n' "$response" >&2
            fi
            review=""
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          if [ -z "$review" ]; then
            review="**The GLM review is unavailable for this push.** The API returned no review content after 3 attempts (last attempt: $api_error). The bot degrades to this notice instead of failing required checks; see the workflow run log for the full responses."
          fi

          max_chars=60000
          if [ "${#review}" -gt "$max_chars" ]; then
            review="${review:0:$max_chars}

          The review was truncated to ${max_chars} characters to fit the GitHub comment limit."
          fi

          marker="<!-- yanet-glm-review -->"
          body=$(printf '%s\n\n## GLM code review\n\nModel `%s` reviewed commit %s. %s Auto-generated; not a substitute for human review.\n\n%s' \
            "$marker" "$GLM_MODEL" "${HEAD_SHA:0:12}" "$truncate_note" "$review")
          comment=$(jq -n --arg body "$body" '{body: $body}')

          existing_id=$(curl -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100&sort=updated&direction=desc" \
            | jq -r --arg marker "$marker" '[.[] | select(.body | startswith($marker))][0].id // ""')

          if [ -n "$existing_id" ]; then
            curl -sS --fail-with-body -o /dev/null -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$comment" \
              "$GITHUB_API_URL/repos/$REPO/issues/comments/$existing_id"
          else
            curl -sS --fail-with-body -o /dev/null -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$comment" \
              "$GITHUB_API_URL/repos/$REPO/issues/$PR_NUMBER/comments"
          fi
