name: Web Check

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run test -w web
      # The production bundle can fail where the type check and tests pass.
      - run: npm run build -w web
