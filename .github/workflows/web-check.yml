name: Web Check

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run test -w web
