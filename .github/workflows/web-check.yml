name: Web Check

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npx tsc --noEmit -p web/tsconfig.json
      - run: npm run test -w web
      # The production bundle can fail where the type check and tests pass.
      - run: npm run build -w web
