name: Rust Check

# Cargo caches here are shared and written from main only.
#
# Clippy and test compile dependencies in different metadata modes, so
# each needs its own cache entry. A cache written on a pull-request ref
# is readable only from that same pull request, so saving one there
# costs repository quota and buys nothing.

on:
  push:
    branches: ["main"]
    paths:
      - "**.rs"
      # Crate build scripts compile the protobuf definitions.
      - "**.proto"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-check.yml"
      - ".github/actions/protoc/**"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**.rs"
      # Crate build scripts compile the protobuf definitions.
      - "**.proto"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-check.yml"
      - ".github/actions/protoc/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: a floating nightly rewraps comments differently from one
      # day to the next and turns untouched files red.
      #
      # Bump the date together with a reformat of the workspace, so the
      # toolchain and the checked-in formatting move in one change.
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-08-28
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/protoc
        timeout-minutes: 5
      # --locked: a manifest change passes only with its regenerated Cargo.lock.
      - run: cargo test --workspace --locked

  # Clippy runs the full compiler front end over the workspace, so a type
  # error fails it exactly as a dedicated cargo check job would, which is
  # why there is no separate compile-only job.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1
        with:
          components: clippy
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/protoc
        timeout-minutes: 5
      - run: cargo clippy --workspace --locked -- -D warnings
