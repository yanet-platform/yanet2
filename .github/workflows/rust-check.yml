name: Rust Check

# Cargo caches here are shared and written from main only.
#
# Clippy and test compile dependencies in different metadata modes, so
# each needs its own cache entry. A cache written on a pull-request ref
# is readable only from that same pull request, so saving one there
# costs repository quota and buys nothing.

on:
  push:
    branches: ["main"]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-check.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/apt-failover/**"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/rust-check.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/apt-failover/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: a floating nightly rewraps comments differently from one
      # day to the next and turns untouched files red.
      #
      # Bump the date together with a reformat of the workspace, so the
      # toolchain and the checked-in formatting move in one change.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-28
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: cmake protobuf-compiler
      - run: cargo test --workspace

  # Clippy runs the full compiler front end over the workspace, so a type
  # error fails it exactly as a dedicated cargo check job would, which is
  # why there is no separate compile-only job.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: rust-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: cmake protobuf-compiler
      - run: cargo clippy --workspace -- -D warnings
