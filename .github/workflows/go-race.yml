name: Go Race

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/meson.build"
      - "Makefile"
      - ".github/workflows/go-race.yml"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/apt-packages/**"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**/*.go"
      - "**/meson.build"
      - "Makefile"
      - ".github/workflows/go-race.yml"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/apt-packages/**"

concurrency:
  # The run_id fallback keeps non-PR runs from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go-race:
    name: Run Go race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        id: apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler ccache

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-go-race-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: race
          apt-fingerprint: ${{ steps.apt-packages.outputs.fingerprint }}

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Prepare Go tests
        run: |
          meson setup build -Dbuildtype=debug -Doptimization=0
          make go-test-prepare

      - name: Run Go race tests
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '^github.com/yanet-platform/yanet2/tests/functional/main')
          go test -race -count=1 $packages

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}
