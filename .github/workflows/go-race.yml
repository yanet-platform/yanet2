name: Go Race

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/meson.build"
      - "Makefile"
      - "scripts/go_cdeps.py"
      - "scripts/go_cgo_flags.py"
      - ".github/workflows/go-race.yml"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/go-modcache/**"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**/*.go"
      - "**/meson.build"
      - "Makefile"
      - "scripts/go_cdeps.py"
      - "scripts/go_cgo_flags.py"
      - ".github/workflows/go-race.yml"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/go-modcache/**"

concurrency:
  # The run_id fallback keeps non-PR runs from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # The runner's default shell, which container jobs would replace with sh.
    shell: bash -e {0}

permissions:
  contents: read

jobs:
  go-race:
    name: Run Go race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ghcr.io/yanet-platform/yanet2-ci@sha256:3cbb2aae05beb4efc16f160cfa4d5307deba5d3110005d6557fdb49e5e2ee7a1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: ccache
        with:
          key: ${{ runner.os }}-go-race-image-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: race

      - name: Prepare Go tests
        run: |
          meson setup build -Dbuildtype=debug -Doptimization=0
          make go-test-prepare

      - name: Run Go race tests
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '^github.com/yanet-platform/yanet2/tests/functional/main')
          go test -race -count=1 $packages

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}
