name: Go Formatting Check

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/go-formatting.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/go-formatting.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gofmt:
    name: Check Go Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # gofmt only reformats source text. It resolves no imports and never
      # touches GOMODCACHE, so this job needs no module cache.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check gofmt
        run: |
          set -euo pipefail
          # Find Go files that are not properly formatted
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted properly:"
            echo "$unformatted"
            exit 1
          fi
