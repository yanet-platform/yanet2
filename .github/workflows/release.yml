name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      package_version: ${{ steps.check.outputs.package_version }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      stage_tag: ${{ steps.check.outputs.stage_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check release tag and patch order
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF =~ ^refs/tags/v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] ||
            { echo "Invalid release tag: $GITHUB_REF" >&2; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          branch="release/$major.$minor"
          sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          if ((patch > 0)); then
            previous="v$major.$minor.$((patch - 1))"
            draft=$(gh release view "$previous" --json isDraft --jq '.isDraft')
            [[ $draft == false ]] ||
              { echo "Previous release is not published: $previous" >&2; exit 1; }
          fi
          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            while IFS= read -r tag; do
              [[ $tag =~ ^v${major}\.${minor}\.(0|[1-9][0-9]{0,8})$ ]] || continue
              ((BASH_REMATCH[1] <= patch)) ||
                { echo "Newer release tag exists: $tag" >&2; exit 1; }
            done < <(git tag --list "v$major.$minor.*")
            if ((patch == 0)); then
              git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$sha" >/dev/null ||
                { echo "$sha is not on main's first-parent history" >&2; exit 1; }
            else
              previous_sha=$(git rev-parse "refs/tags/$previous^{commit}")
              git rev-list --first-parent "$sha" | grep -Fx "$previous_sha" >/dev/null ||
                { echo "$sha does not descend from $previous on its first-parent history" >&2; exit 1; }
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$sha" >/dev/null
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          bash .github/scripts/release-ref.sh stable \
            "$GITHUB_REF" "$sha" >> "$GITHUB_OUTPUT"
          echo "stage_tag=${GITHUB_REF_NAME#v}-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  packages:
    needs: preflight
    uses: ./.github/workflows/build-deb.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      pkg_version: ${{ needs.preflight.outputs.package_version }}

  images:
    needs: [preflight, packages]
    uses: ./.github/workflows/build-push-images.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      image_tag: ${{ needs.preflight.outputs.stage_tag }}
      stable: true
      release_tag: ${{ needs.preflight.outputs.image_tag }}

  release:
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: verified-debs
          path: outdeb

      - uses: actions/download-artifact@v5
        with:
          name: release-images
          path: image-metadata

      - name: Check existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .assets[] | [.name, .digest] | @tsv')
          while IFS=$'\t' read -r name digest; do
            [[ -n $name ]] || continue
            [[ $name != */ && -f outdeb/$name ]] || { echo "Unexpected release asset: $name" >&2; exit 1; }
            expected="sha256:$(sha256sum "outdeb/$name" | cut -d' ' -f1)"
            [[ $digest == "$expected" ]] || { echo "Release asset differs: $name" >&2; exit 1; }
          done <<< "$assets"

      - name: Write release description
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          {
            printf 'Release %s from commit %s.\n\n## Docker images\n\n' "$GITHUB_REF_NAME" "$SOURCE_SHA"
            while IFS=$'\t' read -r image digest manifest_size; do
              printf -- '- `%s` (digest: `%s`; manifest: %s bytes)\n' \
                "$image" "$digest" "$manifest_size"
            done < image-metadata/images.tsv
            printf '\n## Verification\n\n```bash\n'
            while IFS=$'\t' read -r image _; do
              printf 'docker pull %s\n' "$image"
            done < image-metadata/images.tsv
            printf '```\n'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.preflight.outputs.source_sha }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            outdeb/*.deb
            outdeb/*.ddeb
