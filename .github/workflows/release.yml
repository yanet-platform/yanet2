name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release-branch-updater
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      package_version: ${{ steps.check.outputs.package_version }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      stage_tag: ${{ steps.check.outputs.stage_tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          [[ $GITHUB_REF == refs/heads/main ]] ||
            { echo "Run manual releases from main" >&2; exit 1; }
          [[ $REQUESTED_TAG =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] ||
            { echo "Invalid release tag: $REQUESTED_TAG" >&2; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_BRANCH_DEPLOY_KEY }}

      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Check release tag and patch order
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_ref=$GITHUB_REF
          release_helper=.github/scripts/release-ref.sh
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            release_ref="refs/tags/$REQUESTED_TAG"
            release_helper=release-tools/.github/scripts/release-ref.sh
          fi
          [[ $release_ref =~ ^refs/tags/v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] ||
            { echo "Invalid release tag: $release_ref" >&2; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          branch="release/$major.$minor"
          sha=$(git rev-parse "$release_ref^{commit}")
          if ((patch > 0)); then
            previous="v$major.$minor.$((patch - 1))"
            draft=$(gh release view "$previous" --json isDraft --jq '.isDraft')
            [[ $draft == false ]] ||
              { echo "Previous release is not published: $previous" >&2; exit 1; }
          fi
          while IFS= read -r tag; do
            [[ $tag =~ ^v${major}\.${minor}\.(0|[1-9][0-9]{0,8})$ ]] || continue
            ((BASH_REMATCH[1] > patch)) || continue
            newer_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            git rev-list --first-parent "$newer_sha" | grep -Fx "$sha" >/dev/null ||
              { echo "Newer release tag does not descend from $release_ref: $tag" >&2; exit 1; }
          done < <(git tag --list "v$major.$minor.*")
          if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            if ((patch == 0)); then
              git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$sha" >/dev/null ||
                { echo "$sha is not on main's first-parent history" >&2; exit 1; }
            else
              previous_sha=$(git rev-parse "refs/tags/$previous^{commit}")
              git rev-list --first-parent "$sha" | grep -Fx "$previous_sha" >/dev/null ||
                { echo "$sha does not descend from $previous on its first-parent history" >&2; exit 1; }
            fi
            git push origin "$sha:refs/heads/$branch"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          elif ! git rev-list --first-parent "refs/remotes/origin/$branch" | grep -Fx "$sha" >/dev/null; then
            git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$sha" >/dev/null ||
              { echo "$sha is not on main's first-parent history" >&2; exit 1; }
            branch_sha=$(git rev-parse "refs/remotes/origin/$branch")
            git rev-list --first-parent "$sha" | grep -Fx "$branch_sha" >/dev/null ||
              { echo "$branch is not on $sha's first-parent history" >&2; exit 1; }
            if ((patch > 0)); then
              previous_sha=$(git rev-parse "refs/tags/$previous^{commit}")
              git rev-list --first-parent "$sha" | grep -Fx "$previous_sha" >/dev/null ||
                { echo "$sha does not descend from $previous on its first-parent history" >&2; exit 1; }
            fi
            git push origin "$sha:refs/heads/$branch"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          bash "$release_helper" stable \
            "$release_ref" "$sha" >> "$GITHUB_OUTPUT"
          echo "stage_tag=$major.$minor.$patch-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  neighbour-sidecar:
    needs: preflight
    uses: ./.github/workflows/build-push-neighbour-sidecar.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      image_tag: ${{ needs.preflight.outputs.stage_tag }}

  packages:
    needs: preflight
    uses: ./.github/workflows/build-deb.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      pkg_version: ${{ needs.preflight.outputs.package_version }}

  images:
    needs: [preflight, packages, neighbour-sidecar]
    uses: ./.github/workflows/build-push-images.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      image_tag: ${{ needs.preflight.outputs.stage_tag }}
      stable: true
      release_tag: ${{ needs.preflight.outputs.image_tag }}
      neighbour_sidecar_prebuilt: true

  release:
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: verified-debs
          path: outdeb

      - uses: actions/download-artifact@v5
        with:
          name: release-images
          path: image-metadata

      - name: Check existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .assets[] | [.name, .digest] | @tsv')
          while IFS=$'\t' read -r name digest; do
            [[ -n $name ]] || continue
            [[ $name != */ && -f outdeb/$name ]] || { echo "Unexpected release asset: $name" >&2; exit 1; }
            expected="sha256:$(sha256sum "outdeb/$name" | cut -d' ' -f1)"
            [[ $digest == "$expected" ]] || { echo "Release asset differs: $name" >&2; exit 1; }
          done <<< "$assets"

      - name: Write release description
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          # The message of an annotated tag opens the description as release notes.
          notes=
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '"\(.object.type) \(.object.sha)"')
          read -r ref_type ref_sha <<< "$ref"
          if [[ $ref_type == tag ]]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.message' |
              sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')
          fi
          {
            [[ -z $notes ]] || printf '%s\n\n' "$notes"
            printf 'Release %s from commit %s.\n\n## Docker images\n\n' "$RELEASE_TAG" "$SOURCE_SHA"
            while IFS=$'\t' read -r image digest manifest_size; do
              printf -- '- `%s` (digest: `%s`; manifest: %s bytes)\n' \
                "$image" "$digest" "$manifest_size"
            done < image-metadata/images.tsv
            printf '\n## Verification\n\n```bash\n'
            while IFS=$'\t' read -r image _; do
              printf 'docker pull %s\n' "$image"
            done < image-metadata/images.tsv
            printf '```\n'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.release_tag }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            outdeb/*.deb
            outdeb/*.ddeb
