name: Comment Lint

on:
  push:
  pull_request:

jobs:
  commentlint:
    name: Pure-run comment separators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run comment lint
        run: make lint/comments
