name: Release scripts

# Tests the release helper on pull requests that can change how a release is
# checked and its branch prepared.
#
# Nothing else runs the helper before a real release does.
on:
  pull_request:
    paths:
      - ".github/scripts/release-ref.sh"
      - ".github/scripts/release-ref_test.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-candidate.yml"
      - ".github/workflows/release-scripts.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-ref:
    name: Test the release helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the release helper tests
        run: .github/scripts/release-ref_test.sh
