name: Fuzz test

# Every C and Go fuzz target runs in a job of its own, in parallel.
#
# The C target list comes from the build, so a module that registers a new
# fuzzer is fuzzed without editing this file. Each C target keeps its corpus
# between nights, and any input that crashes a fuzzer is kept as an artifact.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build C fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      targets: ${{ steps.collect.outputs.targets }}

    steps:
      - name: Free up disk space on GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq ccache

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ci/go-version
          cache: false

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: ccache
        with:
          key: ${{ runner.os }}-fuzz-build-cache
          max-size: 1G
          verbose: 2

      - name: Build fuzz targets
        run: make fuzz

      - name: Collect fuzz binaries
        id: collect
        run: |
          set -euo pipefail
          mkdir -p fuzz-out
          find build/tests/fuzzing/ -maxdepth 1 -type f -executable -exec cp {} fuzz-out/ \;
          targets=$(find fuzz-out -maxdepth 1 -type f -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          if [[ $targets == "[]" ]]; then
            echo "::error::no fuzz binaries were collected from build/tests/fuzzing/"
            exit 1
          fi
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

      - name: Upload fuzz binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-binaries
          path: fuzz-out/
          retention-days: 1
          overwrite: true

  c-fuzz-test:
    name: Fuzz ${{ matrix.module }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.targets) }}

    steps:
      - name: Download fuzz binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-binaries
          path: fuzz-binaries/

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.module }}-

      - name: Run fuzzer
        env:
          MODULE: ${{ matrix.module }}
        run: |
          chmod +x "fuzz-binaries/$MODULE"
          mkdir -p corpus findings
          "./fuzz-binaries/$MODULE" corpus/ -max_total_time=600 -artifact_prefix=findings/

      # A crash still grows the corpus, so it is kept either way.
      - name: Save corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.module }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.module }}
          path: findings/
          retention-days: 14

  go-fuzz-targets:
    name: List Go fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List Go fuzz targets
        id: list
        run: |
          set -euo pipefail
          # The functional suite's test setup boots a VM, so it is never fuzzed.
          targets=$(git grep -E '^func Fuzz[A-Za-z0-9_]*\(' -- '*_test.go' ':!tests/functional/main' |
            sed -E 's#^(.*)/[^/]+_test\.go:func (Fuzz[A-Za-z0-9_]*)\(.*#\1 \2#' |
            jq -Rsc 'split("\n") | map(select(length > 0) | split(" ") | {pkg: ("./" + .[0]), func: .[1]})')
          if [[ $targets == "[]" ]]; then
            echo "::error::no Go fuzz targets found"
            exit 1
          fi
          echo "targets=$targets" >>"$GITHUB_OUTPUT"

  go-fuzz-test:
    name: Go fuzz ${{ matrix.target.func }}
    runs-on: ubuntu-24.04
    needs: go-fuzz-targets
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.go-fuzz-targets.outputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq ccache

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ci/go-version
          cache: false

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      # The C fuzz build compiles the same tree and saves this cache.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: ccache
        with:
          key: ${{ runner.os }}-fuzz-build-cache
          max-size: 1G
          verbose: 2
          save: false

      # The cgo-backed fuzz targets link the sanitized libraries this builds.
      - name: Build fuzz targets
        run: make fuzz

      - name: Run Go fuzz target
        env:
          # The cgo test binary has to link the sanitizer runtimes the
          # instrumented archives reference, or it fails to link entirely.
          CGO_CFLAGS: -O2 -g -fsanitize=address,undefined
          CGO_LDFLAGS: -O2 -g -fsanitize=address,undefined
          # Without this, a caught sanitizer diagnostic prints but the
          # test still passes.
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_summary=1:print_stacktrace=1
          FUZZ_PKG: ${{ matrix.target.pkg }}
          FUZZ_FUNC: ${{ matrix.target.func }}
        run: go test "$FUZZ_PKG" -run '^$' -fuzz "^${FUZZ_FUNC}\$" -fuzztime 10m

      - name: Upload Go fuzz failure testdata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: go-fuzz-testdata-${{ matrix.target.func }}
          path: "**/testdata/fuzz/**"
          retention-days: 7
          overwrite: true

  notify-on-failure:
    name: Notify on fuzz test failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, c-fuzz-test, go-fuzz-targets, go-fuzz-test]
    if: failure() && github.event_name == 'schedule'
    env:
      Message: |
        ❌ Fuzz test failed
        Workflow: ${{ github.workflow }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Send failure notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_YANET_NOTIFICATIONS_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_YANET_CHAT_ID }}
          TOPIC_ID: ${{ vars.TELEGRAM_YANET_PR_TOPIC_ID }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "message_thread_id=${TOPIC_ID}" \
            --data-urlencode "text=${Message}" >/dev/null
