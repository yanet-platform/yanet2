name: Build and push images

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      stable:
        type: boolean
        required: true
      release_tag:
        type: string
        required: false
      neighbour_sidecar_prebuilt:
        description: The neighbour sidecar succeeded in this run for the same source SHA and image tag.
        type: boolean
        required: false
        default: false

jobs:
  build-neighbour-sidecar:
    if: ${{ !inputs.neighbour_sidecar_prebuilt }}
    uses: ./.github/workflows/build-push-neighbour-sidecar.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ inputs.source_sha }}
      image_tag: ${{ inputs.image_tag }}

  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dataplane
            dockerfile: deploy/dataplane.Dockerfile
          - component: controlplane
            dockerfile: deploy/controlplane.Dockerfile
          - component: bird-adapter
            dockerfile: deploy/bird-adapter.Dockerfile
          - component: generic-operator
            dockerfile: deploy/yanet-generic-operator.Dockerfile
          - component: pipeline-operator
            dockerfile: deploy/yanet-pipeline-operator.Dockerfile
          - component: route-operator
            dockerfile: deploy/yanet-route-operator.Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/download-artifact@v5
        with:
          name: debs-24.04-amd64
          path: deploy/packages/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/yanet-platform/yanet2/${{ matrix.component }}:${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote-images:
    name: Promote staged images
    if: >-
      ${{ !cancelled() && inputs.stable && needs.build-images.result == 'success' &&
          (needs.build-neighbour-sidecar.result == 'success' ||
           (inputs.neighbour_sidecar_prebuilt && needs.build-neighbour-sidecar.result == 'skipped')) }}
    needs: [build-images, build-neighbour-sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install registry copy tool
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact staged manifests
        env:
          STAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          helper=.github/scripts/release-images.sh
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            helper=release-tools/.github/scripts/release-images.sh
          fi
          bash "$helper" "$STAGE_TAG" "$RELEASE_TAG" images.tsv

      - uses: actions/upload-artifact@v5
        with:
          name: release-images
          overwrite: true
          if-no-files-found: error
          path: images.tsv
