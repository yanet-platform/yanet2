name: Build and push images

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      stable:
        type: boolean
        required: true
      release_tag:
        type: string
        required: false

jobs:
  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dataplane
            dockerfile: deploy/dataplane.Dockerfile
          - component: controlplane
            dockerfile: deploy/controlplane.Dockerfile
          - component: bird-adapter
            dockerfile: deploy/bird-adapter.Dockerfile
          - component: generic-operator
            dockerfile: deploy/yanet-generic-operator.Dockerfile
          - component: pipeline-operator
            dockerfile: deploy/yanet-pipeline-operator.Dockerfile
          - component: route-operator
            dockerfile: deploy/yanet-route-operator.Dockerfile
          - component: neighbour-sidecar
            dockerfile: deploy/yanet-neighbour-sidecar.Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/download-artifact@v5
        if: matrix.component != 'neighbour-sidecar'
        with:
          name: debs-24.04-amd64
          path: deploy/packages/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/yanet-platform/yanet2/${{ matrix.component }}:${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote-images:
    name: Promote staged images
    if: inputs.stable
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install registry copy tool
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact staged manifests
        env:
          STAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash .github/scripts/release-images.sh "$STAGE_TAG" "$RELEASE_TAG"
