name: Rust SDK

# The SDK must pass its Rust 1.88 tests, lints, formatting and bare-metal build;
# the packet crate must also build outside the workspace.
#
# Tests, lints and bare-metal checks cover both host architectures because C
# bindings and layouts can differ. C headers and Meson flags determine the
# bindings and common/dataplane shims, so changes to either retrigger the jobs.
# Meson setup supplies the database and generated headers without building the
# dataplane; the build script compiles the shims inside the CI image. Each
# cache family has one writer per architecture, on main, so later PRs can read it.

on:
  push:
    branches: ["main"]
    paths:
      - "lib/rust/**"
      - ".cargo/config.toml"
      - ".rustfmt.toml"
      - "common/**.h"
      - "lib/**.h"
      # The dataplane shim compiles these C sources into the plugin.
      - "lib/dataplane/packet/**.c"
      - "subprojects/dpdk"
      - "**/meson.build"
      - "meson_options.txt"
      - ".github/workflows/rust-sdk.yml"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "lib/rust/**"
      - ".cargo/config.toml"
      - ".rustfmt.toml"
      - "common/**.h"
      - "lib/**.h"
      # The dataplane shim compiles these C sources into the plugin.
      - "lib/dataplane/packet/**.c"
      - "subprojects/dpdk"
      - "**/meson.build"
      - "meson_options.txt"
      - ".github/workflows/rust-sdk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # bindgen needs a clang and a libclang of the same LLVM major, both in the
  # CI image.
  CLANG_PATH: /usr/bin/clang-23
  LIBCLANG_PATH: /usr/lib/llvm-23/lib

defaults:
  run:
    # The runner's default shell, which container jobs would replace with sh.
    shell: bash -e {0}

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned with the root workspace's formatter, see rust-check.yml.
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-10-22
          components: rustfmt
      - working-directory: lib/rust
        run: cargo fmt -- --check

  # Every check on this toolchain runs in this one job, which owns the
  # rust-sdk cache family for the host and bare-metal builds.
  clippy:
    name: cargo clippy and std-free crates (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-none}
          - {arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-none}
    container: ghcr.io/yanet-platform/yanet2-ci@sha256:3cbb2aae05beb4efc16f160cfa4d5307deba5d3110005d6557fdb49e5e2ee7a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lib/rust
          shared-key: rust-sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Configuring is enough: the bindings crate reads the C flags from the
      # compilation database; the dataplane-only build needs no protobuf
      # tooling.
      - run: |
          meson setup build -Ddataplane_only=true
      # Workspace lints deny undocumented unsafe blocks and unsafe
      # operations in unsafe functions.
      - working-directory: lib/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The bare-metal build checks compatibility without the standard library.
      #
      # Bindings follow the host's Meson configuration, so the arm64 check
      # requires an arm64 runner.
      - if: matrix.arch != 'arm64' || runner.arch == 'ARM64'
        working-directory: lib/rust
        run: cargo check --locked --target ${{ matrix.target }} -p yanet-shm -p yanet-sys -p yanet-sdk -p yanet-packet

  test:
    name: cargo test (1.88) (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    container: ghcr.io/yanet-platform/yanet2-ci@sha256:3cbb2aae05beb4efc16f160cfa4d5307deba5d3110005d6557fdb49e5e2ee7a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lib/rust
          shared-key: rust-sdk-msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          meson setup build -Ddataplane_only=true
      - working-directory: lib/rust
        run: cargo test --workspace --locked

  packet:
    name: yanet-packet standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          targets: x86_64-unknown-none
      # Built outside the workspace, as its own repository would be: a path
      # dependency or workspace inheritance fails this build.
      - name: Test outside the workspace
        run: |
          cp -r lib/rust/yanet-packet "$RUNNER_TEMP/yanet-packet"
          cd "$RUNNER_TEMP/yanet-packet"
          cargo test
          cargo check --target x86_64-unknown-none
