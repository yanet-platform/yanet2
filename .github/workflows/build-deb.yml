name: Build DEB Packages

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      pkg_version:
        type: string
        required: true
      include_2204:
        type: boolean
        required: false
        default: false
  push:
    branches: ["main"]
    # Keep this list identical to the pull_request paths below.
    paths:
      - "dataplane/**"
      - "controlplane/**"
      - "modules/**"
      - "devices/**"
      - "operators/**"
      - "lib/**"
      - "api/**"
      - "bindings/**"
      - "common/**"
      - "cli/**"
      - "tests/**"
      - "debian/**"
      - "scripts/**"
      - "subprojects/**"
      - ".gitmodules"
      - "Makefile"
      - "meson.build"
      - "meson_options.txt"
      - "dataplane.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/build-deb.yml"
      # A later match wins, so these negations drop the documentation and
      # web sources that would otherwise ride in on the source trees above.
      - "!**.md"
      - "!modules/**/web/**"
      - "!devices/**/web/**"
      - "!operators/**/web/**"
  pull_request:
    branches: ["**"]
    paths:
      - "dataplane/**"
      - "controlplane/**"
      - "modules/**"
      - "devices/**"
      - "operators/**"
      - "lib/**"
      - "api/**"
      - "bindings/**"
      - "common/**"
      - "cli/**"
      - "tests/**"
      - "debian/**"
      - "scripts/**"
      - "subprojects/**"
      - ".gitmodules"
      - "Makefile"
      - "meson.build"
      - "meson_options.txt"
      - "dataplane.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/build-deb.yml"
      - "!**.md"
      - "!modules/**/web/**"
      - "!devices/**/web/**"
      - "!operators/**/web/**"
  workflow_dispatch:
    inputs:
      build_bpftime:
        description: "Build and test the bpftime runtime for one architecture instead of Debian packages"
        type: choice
        options: [none, amd64, arm64]
        default: none
      include_2204:
        description: "Include Ubuntu 22.04 build"
        type: boolean
        default: false

concurrency:
  # Pushes key on the ref, so a newer push supersedes an older one still
  # running. A manual dispatch keys on its run id instead, so two explicit
  # packaging runs (e.g. a 22.04 build alongside a default one) never collide.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  build-bpftime:
    if: inputs.build_bpftime == 'amd64' || inputs.build_bpftime == 'arm64'
    name: Build ${{ inputs.build_bpftime }} bpftime runtime (manual)
    runs-on: ${{ inputs.build_bpftime == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: eunomia-bpf/bpftime
          ref: 6bde654abce3649fe8e6943b16419dfdf71ebf38
          path: scripts/uprobe/.deps/upstream
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/apt-failover
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 clang-16 llvm-16-dev cmake make libboost-dev \
            libelf-dev zlib1g-dev libncurses-dev libbpf-dev \
            meson ninja-build pkg-config python3-pyelftools \
            libnuma-dev libpcap-dev libyaml-dev libibverbs-dev

      - name: Build runtime and test userspace lock probes
        shell: bash
        run: .github/scripts/build-bpftime.sh 2>&1 | tee "bpftime-${{ inputs.build_bpftime }}.log"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bpftime-${{ inputs.build_bpftime }}
          path: |
            bpftime-${{ inputs.build_bpftime }}.log
            scripts/uprobe/.deps/bpftime-${{ inputs.build_bpftime }}.tar.gz*

      - name: Publish tested runtime
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.build_bpftime }}
        run: |
          gh release create "bpftime-v0.9.0-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            scripts/uprobe/.deps/bpftime-$ARCH.tar.gz* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "bpftime v0.9.0 $ARCH runtime" \
            --notes 'Pinned upstream v0.9.0 (6bde654), LLVM JIT; validated with yanet-uprobe userspace probes. See bundled notices.'

  set-matrix:
    if: inputs.build_bpftime != 'amd64' && inputs.build_bpftime != 'arm64'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [[ "${{ inputs.include_2204 }}" == "true" ]]; then
            echo 'matrix={"include":[{"unbtver":"24.04","arch":"amd64","runner":"ubuntu-24.04","artifact":"debs-24.04-amd64"},{"unbtver":"24.04","arch":"arm64","runner":"ubuntu-24.04-arm","artifact":"debs-24.04-arm64"},{"unbtver":"22.04","arch":"amd64","runner":"ubuntu-22.04","artifact":"debs-22.04-amd64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"unbtver":"24.04","arch":"amd64","runner":"ubuntu-24.04","artifact":"debs-24.04-amd64"},{"unbtver":"24.04","arch":"arm64","runner":"ubuntu-24.04-arm","artifact":"debs-24.04-arm64"}]}' >> "$GITHUB_OUTPUT"
          fi

  test-deb-artifacts:
    if: inputs.build_bpftime != 'amd64' && inputs.build_bpftime != 'arm64'
    name: Test Debian artifact scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Debian artifact tests
        run: |
          set -euo pipefail
          bash -n scripts/verify-deb-artifacts.sh \
            .github/scripts/release-deb-artifacts.sh \
            .github/scripts/verify-deb-artifacts_test.sh
          .github/scripts/verify-deb-artifacts_test.sh

  build-deb:
    name: Build DEB (${{ matrix.unbtver }}, ${{ matrix.arch }})
    needs: [set-matrix, test-deb-artifacts]
    env:
      PKG_VERSION: ${{ inputs.pkg_version }}
      DEB_BUILD_PROFILES: ${{ matrix.unbtver == '22.04' && 'pkg.yanet2.nouprobe' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: true

      - env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: ./.github/actions/apt-failover

      - name: Fetch git history for versioning
        run: |
          git fetch --prune --unshallow --tags --filter=blob:none origin \
            || git fetch --tags --filter=blob:none origin \
            || true

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-deb-ccache-${{ matrix.unbtver }}-${{ matrix.arch }}
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: update apt (act hack)
        if: ${{ env.ACT }}
        run: |
          apt-get update

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # Only the cargo home is cached. Debuild runs the clean target first,
      # which removes the target directory, so an entry holding it would be
      # deleted before the build could use it.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: deb-${{ matrix.unbtver }}-${{ matrix.arch }}
          cache-targets: false

      - name: Install packaging tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true
      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache
      - name: Install Debian build dependencies
        if: hashFiles('.github/actions/go-buildcache/action.yml') != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo -E apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y --allow-downgrades --allow-remove-essential --allow-change-held-packages build-dep . 2>&1 | tee build-deps.log
      - name: Restore Go build cache
        if: ${{ hashFiles('.github/actions/go-buildcache/action.yml') != '' && !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: deb
      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Build packages
        run: |
          build_deb_args=()
          if [[ -f .github/actions/go-buildcache/action.yml ]]; then
            build_deb_args+=(--skip-build-deps)
          fi
          sudo -E env "PATH=$PATH" "PKG_VERSION=$PKG_VERSION" "GOCACHE=${GOCACHE:-}" ./scripts/build-deb.sh "${build_deb_args[@]}"
          sudo chown -R $(id -u) ~/.cargo  # fix caching for Rust

      - name: Restore Go build cache ownership
        if: always() && steps.go-buildcache.outputs.path != ''
        env:
          GOCACHE_PATH: ${{ steps.go-buildcache.outputs.path }}
        run: |
          if [[ -d "$GOCACHE_PATH" ]]; then
            sudo chown -R "$(id -u):$(id -g)" -- "$GOCACHE_PATH"
          fi

      - name: Verify package artifacts
        run: sudo ./scripts/verify-deb-artifacts.sh outdeb '${{ matrix.arch }}'

      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual_host_arch=$(dpkg --print-architecture)
          expected_host_arch='${{ matrix.arch }}'
          if [[ "$actual_host_arch" != "$expected_host_arch" ]]; then
            echo "Runner architecture mismatch: $actual_host_arch (expected $expected_host_arch)" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          overwrite: true
          path: |
            outdeb/*.changes
            outdeb/*.buildinfo
            outdeb/*.deb
            outdeb/*.ddeb

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && steps.go-buildcache.outputs.path != '' && steps.go-buildcache.outputs.key != ''
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}

  verify-release:
    if: inputs.pkg_version != ''
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - uses: actions/download-artifact@v5
        with:
          pattern: debs-*
          path: artifacts

      - name: Install Debian verification tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts

      - name: Verify release packages
        env:
          EXPECTED_VERSION: ${{ inputs.pkg_version }}
          INCLUDE_2204: ${{ inputs.include_2204 }}
        run: |
          args=(artifacts outdeb --expected-version "$EXPECTED_VERSION")
          if [[ "$INCLUDE_2204" == true ]]; then
            args+=(--include-2204)
          fi
          helper=.github/scripts/release-deb-artifacts.sh
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            helper=release-tools/.github/scripts/release-deb-artifacts.sh
          fi
          bash "$helper" "${args[@]}"

      - uses: actions/upload-artifact@v5
        with:
          name: verified-debs
          overwrite: true
          path: |
            outdeb/*.deb
            outdeb/*.ddeb
