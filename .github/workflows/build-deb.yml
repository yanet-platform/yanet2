name: Build DEB Packages

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # Keep this list identical to the pull_request paths below.
    paths:
      - "dataplane/**"
      - "controlplane/**"
      - "modules/**"
      - "devices/**"
      - "operators/**"
      - "lib/**"
      - "api/**"
      - "bindings/**"
      - "common/**"
      - "cli/**"
      - "tests/**"
      - "debian/**"
      - "scripts/**"
      - "subprojects/**"
      - ".gitmodules"
      - "Makefile"
      - "meson.build"
      - "meson_options.txt"
      - "dataplane.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/workflows/build-deb.yml"
      # A later match wins, so these negations drop the documentation and
      # web sources that would otherwise ride in on the source trees above.
      - "!**.md"
      - "!modules/**/web/**"
      - "!devices/**/web/**"
      - "!operators/**/web/**"
  pull_request:
    branches: ["**"]
    paths:
      - "dataplane/**"
      - "controlplane/**"
      - "modules/**"
      - "devices/**"
      - "operators/**"
      - "lib/**"
      - "api/**"
      - "bindings/**"
      - "common/**"
      - "cli/**"
      - "tests/**"
      - "debian/**"
      - "scripts/**"
      - "subprojects/**"
      - ".gitmodules"
      - "Makefile"
      - "meson.build"
      - "meson_options.txt"
      - "dataplane.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go.mod"
      - "go.sum"
      - ".github/actions/**"
      - ".github/workflows/build-deb.yml"
      - "!**.md"
      - "!modules/**/web/**"
      - "!devices/**/web/**"
      - "!operators/**/web/**"
  workflow_dispatch:
    inputs:
      include_2204:
        description: "Include Ubuntu 22.04 build"
        type: boolean
        default: false

concurrency:
  # Pushes key on the ref, so a newer push supersedes an older one still
  # running. A manual dispatch keys on its run id instead, so two explicit
  # packaging runs (e.g. a 22.04 build alongside a default one) never collide.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.include_2204 }}" == "true" ]]; then
            echo 'matrix={"unbtver":["24.04","22.04"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"unbtver":["24.04"]}' >> $GITHUB_OUTPUT
          fi

  build-deb:
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    runs-on: ubuntu-${{ matrix.unbtver }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-failover

      - name: Fetch git history for versioning
        run: |
          git fetch --prune --unshallow --tags --filter=blob:none origin \
            || git fetch --tags --filter=blob:none origin \
            || true

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-deb-ccache-${{ matrix.unbtver }}
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: update apt (act hack)
        if: ${{ env.ACT }}
        run: |
          apt-get update

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # Only the cargo home is cached. Debuild runs the clean target first,
      # which removes the target directory, so an entry holding it would be
      # deleted before the build could use it.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: deb-${{ matrix.unbtver }}
          cache-targets: false

      - name: Install packaging tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
          check-latest: true
      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache
      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Build packages
        run: |
          sudo -E env "PATH=$PATH" ./scripts/build-deb.sh
          sudo chown -R $(id -u) ~/.cargo  # fix caching for Rust

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.unbtver }}
          path: |
            outdeb/*.changes
            outdeb/*.deb
            outdeb/*.ddeb

  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Verify downloaded packages
        run: ./scripts/verify-deb-artifacts.sh artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p outdeb
          find artifacts -type f \( -name "*.changes" -o -name "*.deb" -o -name "*.ddeb" \) -exec cp {} outdeb/ \;
          ./scripts/verify-deb-artifacts.sh outdeb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            outdeb/*.deb
            outdeb/*.ddeb
