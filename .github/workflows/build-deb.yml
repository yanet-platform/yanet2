name: Build DEB Packages

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # Keep this list identical to the pull_request paths-ignore below.
    paths-ignore:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/CODEOWNERS"
      - "**.md"
      - ".claude/**"
      - "docs/**"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "web/**"
      - "modules/**/web/**"
      - "devices/**/web/**"
      - "operators/**/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/CODEOWNERS"
      - "**.md"
      - ".claude/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      include_2204:
        description: "Include Ubuntu 22.04 build"
        type: boolean
        default: false

concurrency:
  # Pushes key on the ref, so a newer push supersedes an older one still
  # running. A manual dispatch keys on its run id instead, so two explicit
  # packaging runs (e.g. a 22.04 build alongside a default one) never collide.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.include_2204 }}" == "true" ]]; then
            echo 'matrix={"unbtver":["24.04","22.04"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"unbtver":["24.04"]}' >> $GITHUB_OUTPUT
          fi

  build-deb:
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    runs-on: ubuntu-${{ matrix.unbtver }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Fetch git history for versioning
        run: |
          git fetch --prune --unshallow --tags --filter=blob:none origin \
            || git fetch --tags --filter=blob:none origin \
            || true

      - uses: hendrikmuhs/ccache-action@v1.2.18
        name: ccache
        with:
          key: ${{ runner.os }}-deb-ccache-${{ matrix.unbtver }}
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: update apt (act hack)
        if: ${{ env.ACT }}
        run: |
          apt-get update

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Only the cargo home is cached. Debuild runs the clean target first,
      # which removes the target directory, so an entry holding it would be
      # deleted before the build could use it.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: deb-${{ matrix.unbtver }}
          cache-targets: false

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
          check-latest: true
      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache
      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Build packages
        run: |
          sudo -E env "PATH=$PATH" ./scripts/build-deb.sh
          sudo chown -R $(id -u) ~/.cargo  # fix caching for Rust

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.unbtver }}
          path: |
            outdeb/*.deb
            outdeb/*.ddeb

  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p outdeb
          find artifacts -type f -name "*.deb" -exec cp {} outdeb/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: outdeb/*
