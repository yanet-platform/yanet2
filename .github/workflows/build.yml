name: Build YANET

on:
  push:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - ".gitmodules"
      # Protoc-generated Go is a build product, not a tracked file.
      - "**.proto"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/build.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/go-modcache/**"
  pull_request:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - ".gitmodules"
      # Protoc-generated Go is a build product, not a tracked file.
      - "**.proto"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/build.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/go-modcache/**"

concurrency:
  # The run_id fallback keeps non-PR runs from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-asan-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - uses: hendrikmuhs/ccache-action@v1.2.18
        name: ccache
        with:
          key: ${{ runner.os }}-build-asan-test-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Build YANET (sanitize)
        run: |
          make go-cache-clean
          meson setup build -Dbuildtype=debug -Doptimization=0 -Db_sanitize=address,undefined
          make dataplane

      - name: Build and run tests (sanitize)
        run: make test-asan-only

      - name: Show meson test log
        if: always()
        run: grep -v 'Inherited environment' build/meson-logs/testlog.txt || true

  build-tsan-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - uses: hendrikmuhs/ccache-action@v1.2.18
        name: ccache
        with:
          key: ${{ runner.os }}-build-tsan-test-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Run TSAN tests
        run: make test-tsan

      - name: Show TSAN test log
        if: always()
        run: grep -v 'Inherited environment' build-tsan/meson-logs/testlog.txt || true

  build-release-artifacts:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # A cache written on a pull-request ref is readable only from that
      # same pull request, so only main writes this one.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: build-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: hendrikmuhs/ccache-action@v1.2.18
        name: ccache
        with:
          key: ${{ runner.os }}-build-release-artifacts-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        id: go-modcache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Build YANET (release)
        run: |
          make go-cache-clean
          meson setup build -Dbuildtype=release
          make dataplane cli

      - name: Build and run tests (release)
        run: make test-only

      - name: Show meson test log
        if: always()
        run: grep -v 'Inherited environment' build/meson-logs/testlog.txt || true

      # This job is the designated writer of the shared Go module cache key:
      # its `make test-only` resolves the whole module list, unlike tsan's
      # suite, which never invokes `go test` and would freeze a partial
      # cache under the exact key. Saving here rather than via the cache
      # action's post step avoids publishing a half-populated cache when an
      # earlier step fails the job.
      - name: Save Go module cache
        if: steps.go-modcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-modcache.outputs.path }}
          key: ${{ steps.go-modcache.outputs.key }}

      - name: Verify binaries before upload
        run: |
          echo "=== DIAGNOSTIC: Verifying binaries before artifact upload ==="
          echo "Current git commit: $(git rev-parse HEAD)"
          echo "Current git commit short: $(git rev-parse --short HEAD)"
          echo ""

          echo "yanet-dataplane:"
          if [ -f "build/dataplane/yanet-dataplane" ]; then
              stat build/dataplane/yanet-dataplane
              md5sum build/dataplane/yanet-dataplane
              strings build/dataplane/yanet-dataplane | grep -E "yanet|version" | head -20 || true
          else
              echo "ERROR: build/dataplane/yanet-dataplane not found!"
              exit 1
          fi

          echo ""
          echo "yanet-controlplane:"
          if [ -f "build/controlplane/yanet-controlplane" ]; then
              stat build/controlplane/yanet-controlplane
              md5sum build/controlplane/yanet-controlplane
              strings build/controlplane/yanet-controlplane | grep -E "yanet|version" | head -20 || true
          else
              echo "ERROR: build/controlplane/yanet-controlplane not found!"
              exit 1
          fi

          echo ""
          echo "yanet-cli binaries:"
          if ls target/release/yanet-cli* 1>/dev/null 2>&1; then
              stat target/release/yanet-cli* || true
              md5sum target/release/yanet-cli* || true
          else
              echo "ERROR: No yanet-cli binaries found in target/release/!"
              exit 1
          fi

      - name: Upload YANET binaries
        uses: actions/upload-artifact@v4
        with:
          name: yanet2-binaries
          path: |
            build/dataplane/yanet-dataplane
            build/controlplane/yanet-controlplane
            target/release/yanet-cli*

  functional-tests:
    name: Run Functional Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: build-release-artifacts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clean any pre-existing build artifacts
        run: |
          echo "=== Cleaning any cached build artifacts before downloading from build job ==="
          rm -rf build/ target/ || true
          echo "Cleaned build/ and target/ directories"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - uses: ./.github/actions/apt-packages
        with:
          packages: qemu-system-x86 qemu-utils genisoimage cloud-image-utils wget curl jq libpcap-dev

      - name: Configure system for QEMU
        run: |
          # Enable KVM access if available
          if [ -e /dev/kvm ]; then
              echo "KVM is available, configuring KVM access"
              sudo usermod -aG kvm $USER || true
              sudo chmod 666 /dev/kvm || true
          else
              echo "KVM is not available, will use TCG emulation"
          fi

          # Configure 9P filesystem support
          sudo modprobe 9p || true
          sudo modprobe 9pnet_virtio || true

          # Check QEMU capabilities
          qemu-system-x86_64 --version

      - name: Cache Ubuntu cloud image
        id: cache-ubuntu-image
        uses: actions/cache@v4
        with:
          path: tests/functional/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ runner.os }}-ubuntu-image-${{ hashFiles('tests/functional/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-image-

      - name: Cache QEMU image
        id: cache-qemu-image
        uses: actions/cache@v4
        with:
          path: |
            tests/functional/yanet-test.qcow2
            tests/functional/*.iso
          key: ${{ runner.os }}-qemu-disk-v2-${{ hashFiles('tests/functional/Makefile') }}-${{ hashFiles('tests/functional/cloud-init-user-data.yaml') }}-${{ hashFiles('tests/functional/meta-data') }}

      - name: Normalize cached VM artifact timestamps
        if: steps.cache-qemu-image.outputs.cache-hit == 'true' || steps.cache-ubuntu-image.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail

          cd tests/functional

          # Git checkout sets source files mtimes to "now". Cached artifacts keep old mtimes,
          # so `make` treats them as stale and rebuilds QCOW2/ISO every run. Touch artifacts
          # (deps first, then target) to keep make from doing unnecessary work.
          if [ -f ubuntu-24.04-minimal-cloudimg-amd64.img ]; then
              touch ubuntu-24.04-minimal-cloudimg-amd64.img
          fi

          if ls -1 *.iso >/dev/null 2>&1; then
              touch *.iso
          fi

          if [ -f yanet-test.qcow2 ]; then
              touch yanet-test.qcow2
          fi

      - name: Download YANET binaries from build job
        uses: actions/download-artifact@v4
        with:
          name: yanet2-binaries
          path: ./

      - name: Place downloaded binaries
        run: |
          mkdir -p build/dataplane build/controlplane target/release
          [ -f "./yanet-dataplane" ] && mv -f ./yanet-dataplane build/dataplane/
          [ -f "./yanet-controlplane" ] && mv -f ./yanet-controlplane build/controlplane/
          if ls ./yanet-cli* 1>/dev/null 2>&1; then
              mv -f ./yanet-cli-* target/release/
          fi
          chmod +x build/dataplane/yanet-dataplane 2>/dev/null || true
          chmod +x build/controlplane/yanet-controlplane 2>/dev/null || true
          chmod +x target/release/yanet-cli* 2>/dev/null || true

      - name: Prepare test environment
        working-directory: tests/functional
        run: |
          make check-deps

          echo "=== Starting QEMU VM preparation ==="

          # Run with timeout and monitoring
          timeout 7200 make prepare-vm &
          QEMU_PID=$!

          # Monitor QEMU progress
          for i in {1..120}; do
              echo "=== QEMU status check $i/120 ==="
              ps aux | grep qemu | grep -v grep || echo "QEMU process not found"

              if [ -f qemu_debug.log ]; then
                  echo "=== QEMU log size: $(wc -l <qemu_debug.log) lines ==="
                  echo "=== Last 10 lines of QEMU log ==="
                  tail -10 qemu_debug.log
              fi

              sleep 60

              # Check if QEMU is still running
              if ! kill -0 $QEMU_PID 2>/dev/null; then
                  echo "QEMU process finished"
                  break
              fi
          done

          # Wait for QEMU to finish
          wait $QEMU_PID
          QEMU_EXIT_CODE=$?

          echo "=== QEMU exit code: $QEMU_EXIT_CODE ==="

          if [ -f qemu_debug.log ]; then
              echo "=== Final QEMU log (last 50 lines) ==="
              tail -50 qemu_debug.log
          fi

          if [ $QEMU_EXIT_CODE -ne 0 ]; then
              echo "QEMU preparation failed with exit code $QEMU_EXIT_CODE"
              exit $QEMU_EXIT_CODE
          fi

        timeout-minutes: 130

      - name: Run functional tests
        working-directory: tests/functional
        run: |
          set +e
          export YANET_TEST_DEBUG=1
          export YANET_VM_POOL_SIZE=5
          make test
          ret=$?

          echo "=== main/test.log (last 100 lines) ==="
          tail -n 100 main/test.log 2>/dev/null || echo "main/test.log not found"

          echo ""
          echo "=== converted/test.log (last 100 lines) ==="
          tail -n 100 converted/test.log 2>/dev/null || echo "converted/test.log not found"

          exit $ret
        timeout-minutes: 45

      - name: Upload functional test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-logs
          path: |
            tests/functional/main/test.log
            tests/functional/converted/test.log
