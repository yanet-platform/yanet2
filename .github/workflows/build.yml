name: Build YANET

on:
  push:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
  pull_request:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"

jobs:
  build:
    runs-on: ubuntu-24.04    
    env:
      cache_name: build-and-test

    steps:
      - name: Free up disk space on GitHub runner
        run: |
          echo "=== Initial disk space ==="
          df -h
          
          echo "=== Removing unnecessary software ==="
          # Remove large packages that are not needed
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean apt cache
          sudo apt-get clean
          
          # Remove docker images
          docker rmi $(docker images -q) 2>/dev/null || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: update apt (act hack)
        if: ${{ env.ACT }}
        run: |
          apt-get update

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}-
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: meson clang python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq clang-tidy-19
          version: 1.1

      - name: Install LLVM 19 toolchain
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1.1"
          directory: ${{ runner.temp }}/llvm

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Diagnostic - Check for cached build artifacts
        run: |
          echo "=== DIAGNOSTIC: Checking for pre-existing cached artifacts ==="
          echo "Current git commit: $(git rev-parse HEAD)"
          echo "Current git commit short: $(git rev-parse --short HEAD)"
          echo ""
          
          echo "Checking build/ directory:"
          if [ -d "build" ]; then
            echo "WARNING: build/ directory exists (from cache?)"
            ls -lah build/ || true
            if [ -f "build/dataplane/yanet-dataplane" ]; then
              echo "WARNING: Cached yanet-dataplane found!"
              stat build/dataplane/yanet-dataplane
              md5sum build/dataplane/yanet-dataplane
            fi
            if [ -f "build/controlplane/yanet-controlplane" ]; then
              echo "WARNING: Cached yanet-controlplane found!"
              stat build/controlplane/yanet-controlplane
              md5sum build/controlplane/yanet-controlplane
            fi
          else
            echo "build/ directory does not exist (clean state)"
          fi
          
          echo ""
          echo "Checking target/ directory:"
          if [ -d "target" ]; then
            echo "WARNING: target/ directory exists (from Rust cache?)"
            ls -lah target/ || true
            if [ -d "target/release" ]; then
              echo "target/release/ contents:"
              ls -lah target/release/ || true
              if ls target/release/yanet-cli* 1> /dev/null 2>&1; then
                echo "WARNING: Cached yanet-cli binaries found!"
                stat target/release/yanet-cli* || true
                md5sum target/release/yanet-cli* || true
              fi
            fi
          else
            echo "target/ directory does not exist (clean state)"
          fi

      - uses: hendrikmuhs/ccache-action@v1.2.18
        name: ccache
        with:
          key: ${{ runner.os }}-build-cache

      - name: Cache DPDK build
        uses: actions/cache@v4
        with:
          path: |
            build/subprojects/dpdk
          key: ${{ runner.os }}-dpdk-${{ hashFiles('subprojects/dpdk/**') }}-${{ hashFiles('**/meson.build') }}
          restore-keys: |
            ${{ runner.os }}-dpdk-${{ hashFiles('subprojects/dpdk/**') }}-
            ${{ runner.os }}-dpdk-

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
          check-latest: true
      # https://github.com/actions/setup-go/issues/358
      - name: Get Go environment
        run: |
          echo "cache=$(go env GOCACHE)" >> $GITHUB_ENV
          echo "modcache=$(go env GOMODCACHE)" >> $GITHUB_ENV
      - name: Set up go cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.cache }}
            ${{ env.modcache }}
          key: ${{ env.cache_name }}-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ env.cache_name }}-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('**/go.mod') }}-
            ${{ env.cache_name }}-${{ runner.os }}-go-

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Check disk space before debug build
        run: |
          echo "=== Disk space before debug build ==="
          df -h
          echo "=== Largest directories ==="
          du -sh /* 2>/dev/null | sort -hr | head -20 || true
          du -sh /home/runner/* 2>/dev/null | sort -hr | head -20 || true

      - name: Build YANET in debug (dataplane -> modules -> controlplane)
        run: |
          make go-cache-clean
          meson setup --reconfigure build -Dbuildtype=debug -Doptimization=0 -Db_sanitize=address,undefined
          make dataplane cli

      - name: Build and run tests in debug
        run: |
          make go-cache-clean
          make test-debug
      - name: Show meson test log
        run:
          grep -v 'Inherited environment' build/meson-logs/testlog.txt

      - name: Clean debug build artifacts to free space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Build directory size ==="
          du -sh build/ || true
          
          echo "=== Cleaning debug build artifacts ==="
          # Completely remove build directory to free maximum space
          rm -rf build/
          
          # Clean Docker build cache if exists
          docker system prune -af 2>/dev/null || true
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Build YANET in release (dataplane -> modules -> controlplane)
        run: |
          # Fresh setup is required because the build/ dir was removed above
          make go-cache-clean
          meson setup build -Dbuildtype=release
          make dataplane cli

      - name: Build and run tests in release
        run: |
          make test
      - name: Show meson test log
        run:
          grep -v 'Inherited environment' build/meson-logs/testlog.txt

      - name: Run clang-tidy (LLVM 19, robust, DB-aware)
        env:
          LLVM_DIR: ${{ steps.llvm.outputs.directory }}
        run: |
          set -euo pipefail
          # Ensure compilation database exists
          test -f build/compile_commands.json || { echo "ERROR: build/compile_commands.json not found"; ls -la build || true; exit 1; }

          # Prefer LLVM 19 installed by install-llvm-action
          if [ -n "${LLVM_DIR:-}" ] && [ -x "$LLVM_DIR/bin/clang-tidy" ]; then
            CTIDY="$LLVM_DIR/bin/clang-tidy"
            # run-clang-tidy.py location in LLVM install
            if [ -f "$LLVM_DIR/share/clang/run-clang-tidy.py" ]; then
              RTIDY="$LLVM_DIR/share/clang/run-clang-tidy.py"
            elif [ -f "$LLVM_DIR/lib/clang/run-clang-tidy.py" ]; then
              RTIDY="$LLVM_DIR/lib/clang/run-clang-tidy.py"
            else
              RTIDY=""
            fi
          else
            CTIDY="$(command -v clang-tidy-19 || true)"
            [ -z "$CTIDY" ] && CTIDY="$(command -v clang-tidy || true)"
            RTIDY="$(command -v run-clang-tidy.py || true)"
          fi

          if [ -z "${CTIDY:-}" ]; then
            echo "ERROR: clang-tidy not found (checked LLVM_DIR, clang-tidy-19, clang-tidy)"; exit 1
          fi
          echo "Using clang-tidy binary: $CTIDY"
          [ -n "${RTIDY:-}" ] && echo "Using run-clang-tidy helper: $RTIDY"

          # Build file list from database (C files, exclude subprojects)
          FILES="$(jq -r '.[].file' build/compile_commands.json | sort -u | grep '\.c$' | grep -v '/subprojects/' || true)"
          if [ -z "$FILES" ]; then
            echo "No source files to lint (after filtering)."; exit 0;
          fi

          if [ -n "${RTIDY:-}" ] && [ -f "$RTIDY" ]; then
            # Use run-clang-tidy.py (handles DB well and parallelism)
            python3 "$RTIDY" \
              -p build \
              -j "$(nproc)" \
              -clang-tidy-binary "$CTIDY" \
              -header-filter='^(?!.*\/subprojects\/).*' \
              $FILES
          else
            # Fallback: invoke clang-tidy directly from DB directory
            cd build
            printf "%s\n" $FILES \
              | xargs -n1 -P"$(nproc)" -I{} "$CTIDY" \
                  -p . \
                  -header-filter='^(?!.*\/subprojects\/).*' \
                  {}
          fi

      - name: Verify binaries before upload
        run: |
          echo "=== DIAGNOSTIC: Verifying binaries before artifact upload ==="
          echo "Current git commit: $(git rev-parse HEAD)"
          echo "Current git commit short: $(git rev-parse --short HEAD)"
          echo ""
          
          echo "yanet-dataplane:"
          if [ -f "build/dataplane/yanet-dataplane" ]; then
            stat build/dataplane/yanet-dataplane
            md5sum build/dataplane/yanet-dataplane
            strings build/dataplane/yanet-dataplane | grep -E "yanet|version" | head -20 || true
          else
            echo "ERROR: build/dataplane/yanet-dataplane not found!"
            exit 1
          fi
          
          echo ""
          echo "yanet-controlplane:"
          if [ -f "build/controlplane/yanet-controlplane" ]; then
            stat build/controlplane/yanet-controlplane
            md5sum build/controlplane/yanet-controlplane
            strings build/controlplane/yanet-controlplane | grep -E "yanet|version" | head -20 || true
          else
            echo "ERROR: build/controlplane/yanet-controlplane not found!"
            exit 1
          fi
          
          echo ""
          echo "yanet-cli binaries:"
          if ls target/release/yanet-cli* 1> /dev/null 2>&1; then
            stat target/release/yanet-cli* || true
            md5sum target/release/yanet-cli* || true
          else
            echo "ERROR: No yanet-cli binaries found in target/release/!"
            exit 1
          fi

      - name: Upload YANET binaries
        uses: actions/upload-artifact@v4
        with:
          name: yanet2-binaries
          path: |
            build/dataplane/yanet-dataplane
            build/controlplane/yanet-controlplane
            target/release/yanet-cli*

  functional-tests:
    name: Run Functional Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Clean any pre-existing build artifacts
      run: |
        echo "=== Cleaning any cached build artifacts before downloading from build job ==="
        rm -rf build/ target/ || true
        echo "Cleaned build/ and target/ directories"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        cache: true

    - name: update apt (act hack)
      if: ${{ env.ACT }}
      run: |
        apt-get update
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: qemu-system-x86 qemu-utils genisoimage cloud-image-utils wget curl jq
        version: 1.1

    - name: Configure system for QEMU
      run: |
        # Enable KVM access if available
        if [ -e /dev/kvm ]; then
          echo "KVM is available, configuring KVM access"
          sudo usermod -aG kvm $USER || true
          sudo chmod 666 /dev/kvm || true
        else
          echo "KVM is not available, will use TCG emulation"
        fi
        
        # Configure 9P filesystem support
        sudo modprobe 9p || true
        sudo modprobe 9pnet_virtio || true
        
        # Check QEMU capabilities
        qemu-system-x86_64 --version

    - name: Cache Ubuntu cloud image
      uses: actions/cache@v4
      with:
        path: tests/functional/ubuntu-24.04-minimal-cloudimg-amd64.img
        key: ${{ runner.os }}-ubuntu-image-${{ hashFiles('tests/functional/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-ubuntu-image-

    - name: Cache QEMU image
      uses: actions/cache@v4
      with:
        path: |
          tests/functional/yanet-test.qcow2
          tests/functional/*.iso
        key: ${{ runner.os }}-qemu-image-${{ hashFiles('tests/functional/Makefile') }}-${{ hashFiles('tests/functional/cloud-init-user-data.yaml') }}
        restore-keys: |
          ${{ runner.os }}-qemu-image-

    - name: Download YANET binaries from build job
      uses: actions/download-artifact@v4
      with:
        name: yanet2-binaries
        path: ./

    - name: Display structure of downloaded files
      run: |
        echo "=== Downloaded files structure ==="
        ls -la ./
        echo "=== Build directory ==="
        ls -la build/ || echo "Build directory not found"
        echo "=== Target directory ==="
        ls -la target/ || echo "Target directory not found"
        
        echo ""
        echo "=== DIAGNOSTIC: Check for cached binaries BEFORE moving artifacts ==="
        if [ -d "build/dataplane" ]; then
          echo "build/dataplane exists (from cache?)"
          ls -lah build/dataplane/ || true
          if [ -f "build/dataplane/yanet-dataplane" ]; then
            echo "WARNING: yanet-dataplane already exists in build/dataplane/ (cached?)"
            stat build/dataplane/yanet-dataplane
            md5sum build/dataplane/yanet-dataplane
          fi
        fi
        if [ -d "build/controlplane" ]; then
          echo "build/controlplane exists (from cache?)"
          ls -lah build/controlplane/ || true
          if [ -f "build/controlplane/yanet-controlplane" ]; then
            echo "WARNING: yanet-controlplane already exists in build/controlplane/ (cached?)"
            stat build/controlplane/yanet-controlplane
            md5sum build/controlplane/yanet-controlplane
          fi
        fi
        if [ -d "target/release" ]; then
          echo "target/release exists (from cache?)"
          ls -lah target/release/ || true
          if ls target/release/yanet-cli* 1> /dev/null 2>&1; then
            echo "WARNING: yanet-cli binaries already exist in target/release/ (cached?)"
            stat target/release/yanet-cli* || true
            md5sum target/release/yanet-cli* || true
          fi
        fi
        
        echo ""
        echo "=== DIAGNOSTIC: Check downloaded artifact binaries ==="
        if [ -f "./yanet-dataplane" ]; then
          echo "Downloaded yanet-dataplane:"
          stat ./yanet-dataplane
          md5sum ./yanet-dataplane
        fi
        if [ -f "./yanet-controlplane" ]; then
          echo "Downloaded yanet-controlplane:"
          stat ./yanet-controlplane
          md5sum ./yanet-controlplane
        fi
        if ls ./yanet-cli* 1> /dev/null 2>&1; then
          echo "Downloaded yanet-cli binaries:"
          stat ./yanet-cli* || true
          md5sum ./yanet-cli* || true
        fi
        
        # Ensure directories exist
        mkdir -p build/dataplane build/controlplane
        mkdir -p target/release
        
        # Move binaries to correct locations if they were downloaded to root
        if [ -f "./yanet-dataplane" ]; then
          echo "Moving yanet-dataplane to build/dataplane/"
          mv -f ./yanet-dataplane build/dataplane/
        fi
        if [ -f "./yanet-controlplane" ]; then
          echo "Moving yanet-controlplane to build/controlplane/"
          mv -f ./yanet-controlplane build/controlplane/
        fi
        if [ -f "./yanet-cli-nat64" ]; then
          echo "Moving yanet-cli-* to target/release/"
          mv -f ./yanet-cli-* target/release/
        fi
        
        # Make binaries executable
        chmod +x build/dataplane/yanet-dataplane || true
        chmod +x build/controlplane/yanet-controlplane || true
        chmod +x target/release/yanet-cli* || true
        
        echo ""
        echo "=== DIAGNOSTIC: Final binary verification ==="
        echo "yanet-dataplane:"
        stat build/dataplane/yanet-dataplane
        md5sum build/dataplane/yanet-dataplane
        echo "yanet-controlplane:"
        stat build/controlplane/yanet-controlplane
        md5sum build/controlplane/yanet-controlplane
        echo "yanet-cli binaries:"
        stat target/release/yanet-cli* || true
        md5sum target/release/yanet-cli* || true
        
    - name: Prepare test environment
      working-directory: tests/functional
      run: |
        make check-deps
        
        echo "=== Starting QEMU VM preparation ==="
        
        # Run with timeout and monitoring
        timeout 7200 make prepare-vm &
        QEMU_PID=$!
        
        # Monitor QEMU progress
        for i in {1..120}; do
          echo "=== QEMU status check $i/120 ==="
          ps aux | grep qemu | grep -v grep || echo "QEMU process not found"
          
          if [ -f qemu_debug.log ]; then
            echo "=== QEMU log size: $(wc -l < qemu_debug.log) lines ==="
            echo "=== Last 10 lines of QEMU log ==="
            tail -10 qemu_debug.log
          fi
          
          sleep 60
          
          # Check if QEMU is still running
          if ! kill -0 $QEMU_PID 2>/dev/null; then
            echo "QEMU process finished"
            break
          fi
        done
        
        # Wait for QEMU to finish
        wait $QEMU_PID
        QEMU_EXIT_CODE=$?
        
        echo "=== QEMU exit code: $QEMU_EXIT_CODE ==="
        
        if [ -f qemu_debug.log ]; then
          echo "=== Final QEMU log (last 50 lines) ==="
          tail -50 qemu_debug.log
        fi
        
        if [ $QEMU_EXIT_CODE -ne 0 ]; then
          echo "QEMU preparation failed with exit code $QEMU_EXIT_CODE"
          exit $QEMU_EXIT_CODE
        fi
        
      timeout-minutes: 130

    - name: Run functional tests
      working-directory: tests/functional
      run: |
        export YANET_TEST_DEBUG=1
        make test || tail -n 100 test.log
      timeout-minutes: 35

    - name: Upload functional test logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: functional-test-logs
        path: |
          tests/functional/test.log
