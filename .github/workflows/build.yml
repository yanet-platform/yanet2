name: Build YANET

on:
  push:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - ".gitmodules"
      # Protoc-generated Go is a build product, not a tracked file.
      - "**.proto"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Justfile"
      - "scripts/go_cdeps.py"
      - "scripts/test_go_cdeps.py"
      - "lab/**"
      - "docs/lab.md"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/apt-failover/**"
      - ".github/actions/go-modcache/**"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/protoc-plugins/**"
      - "tests/functional/**"
  pull_request:
    # A stacked pull request has a non-main base, so a main-only filter would skip it.
    branches: ["**"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - ".gitmodules"
      # Protoc-generated Go is a build product, not a tracked file.
      - "**.proto"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Justfile"
      - "scripts/go_cdeps.py"
      - "scripts/test_go_cdeps.py"
      - "lab/**"
      - "docs/lab.md"
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - ".github/workflows/build.yml"
      - ".github/actions/apt-packages/**"
      - ".github/actions/apt-failover/**"
      - ".github/actions/go-modcache/**"
      - ".github/actions/go-buildcache/**"
      - ".github/actions/protoc-plugins/**"
      - "tests/functional/**"

concurrency:
  # The run_id fallback keeps non-PR runs from cancelling each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-asan-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        id: apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-build-asan-test-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: asan
          apt-fingerprint: ${{ steps.apt-packages.outputs.fingerprint }}

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Build and run tests (sanitize)
        run: make test-asan-only

      - name: Show meson test log
        if: always()
        run: grep -v 'Inherited environment' build/meson-logs/testlog.txt || true

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}

  # Most pull requests get no package build, so this job checks the arm64
  # build with the flags the packages use and runs the unit tests on arm64.
  test-release-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        id: apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      # The meson build compiles a Rust regex library of its own.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-test-release-arm64-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: release
          apt-fingerprint: ${{ steps.apt-packages.outputs.fingerprint }}

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      # Debian's hardening flags turn warnings the plain release build never
      # sees into errors, as they do in the package build.
      - name: Build and run tests (release, packaging flags)
        run: |
          flags=$(DEB_BUILD_MAINT_OPTIONS=hardening=+all DEB_CFLAGS_MAINT_APPEND=-fno-lto DEB_LDFLAGS_MAINT_APPEND=-fno-lto dpkg-buildflags --export=sh)
          eval "$flags"
          meson setup build -Dbuildtype=release
          make dataplane
          make test-only

      - name: Show meson test log
        if: always()
        run: grep -v 'Inherited environment' build/meson-logs/testlog.txt || true

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}

  # The CLI's bundled C libraries pick up the package flags too, so the arm64
  # CLI build runs with them in a job of its own, beside the one above.
  build-cli-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: cmake protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # A cache written on a pull-request ref is readable only from that
      # same pull request, so only main writes this one.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: build-release-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build CLI (release, packaging flags)
        run: |
          flags=$(DEB_BUILD_MAINT_OPTIONS=hardening=+all DEB_CFLAGS_MAINT_APPEND=-fno-lto DEB_LDFLAGS_MAINT_APPEND=-fno-lto dpkg-buildflags --export=sh)
          eval "$flags"
          make cli

  build-tsan-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-build-tsan-test-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Run TSAN tests
        run: make test-tsan

      - name: Show TSAN test log
        if: always()
        run: grep -v 'Inherited environment' build-tsan/meson-logs/testlog.txt || true

  # Functional tests need only binaries, so the CLI build and the release
  # unit tests run in their own jobs instead of delaying them.
  build-release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Every meson-built binary the functional tests and lab scenarios copy
      # into their VMs.
      FUNCTIONAL_BINARIES: |
        build/dataplane/yanet-dataplane
        build/controlplane/yanet-controlplane
        build/operators/route/yanet-route-operator
        build/operators/generic/yanet-generic-operator
        build/operators/pipeline/yanet-pipeline-operator
        build/operators/bird-adapter/yanet-bird-adapter

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: ./.github/actions/apt-packages
        id: apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq

      # The meson build compiles a Rust regex library of its own.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-build-release-artifacts-cache
          max-size: 2G
          verbose: 2
          save: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        uses: ./.github/actions/go-modcache

      # The release test job compiles a superset of these packages and is the
      # one that saves this cache.
      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        uses: ./.github/actions/go-buildcache
        with:
          profile: release
          apt-fingerprint: ${{ steps.apt-packages.outputs.fingerprint }}

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Build YANET (release)
        run: |
          meson setup build -Dbuildtype=release
          make dataplane

      - name: Check functional test binaries
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if [[ -n $path && ! -x $path ]]; then
              echo "missing functional test binary: $path" >&2
              exit 1
            fi
          done <<<"$FUNCTIONAL_BINARIES"

      # Artifacts keep paths relative to the build directory and drop the
      # executable bit; the functional test job restores both.
      - name: Upload YANET binaries
        uses: actions/upload-artifact@v5
        with:
          name: yanet2-binaries
          if-no-files-found: error
          path: ${{ env.FUNCTIONAL_BINARIES }}

  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: cmake protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # A cache written on a pull-request ref is readable only from that
      # same pull request, so only main writes this one.
      - name: Cache rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: build-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build CLI (release)
        run: make cli

      - name: Verify CLI crypto linkage
        run: |
          for binary in target/release/yanet-cli target/release/yanet-cli-*; do
            if [ ! -x "$binary" ]; then
              continue
            fi
            if readelf -d "$binary" | grep -E 'NEEDED.*\[(libssl|libcrypto|[^]]*aws[-_]lc)[^]]*\.so'; then
              echo "$binary must not depend on a shared TLS or crypto library" >&2
              exit 1
            fi
          done

      # Artifacts keep paths relative to the release directory and drop the
      # executable bit; the functional test job restores both.
      - name: Upload YANET CLI
        uses: actions/upload-artifact@v5
        with:
          name: yanet2-cli
          if-no-files-found: error
          path: |
            target/release/yanet-cli
            target/release/yanet-cli-*
            !target/release/*.d

  test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The package list must match the artifacts job's, since it is part of
      # the Go build cache key both jobs share.
      - uses: ./.github/actions/apt-packages
        id: apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      # The artifacts job compiles the same tree and saves this cache.
      - uses: hendrikmuhs/ccache-action@v1.2.23
        name: ccache
        with:
          key: ${{ runner.os }}-build-release-artifacts-cache
          max-size: 2G
          verbose: 2
          save: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
          check-latest: true

      - name: Restore Go module cache
        id: go-modcache
        uses: ./.github/actions/go-modcache

      - name: Restore Go build cache
        if: ${{ !env.ACT }}
        id: go-buildcache
        uses: ./.github/actions/go-buildcache
        with:
          profile: release
          apt-fingerprint: ${{ steps.apt-packages.outputs.fingerprint }}

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      # Building the binaries before the tests keeps their cgo-free packages in
      # the Go build cache this job saves for the artifacts job.
      - name: Build and run tests (release)
        run: |
          meson setup build -Dbuildtype=release
          make dataplane
          make test-only

      - name: Show meson test log
        if: always()
        run: grep -v 'Inherited environment' build/meson-logs/testlog.txt || true

      - name: Clang syntax sweep
        run: make lint/clang-syntax

      # This job is the designated writer of the shared Go module cache key:
      # its `make test-only` resolves the whole module list, unlike tsan's
      # suite, which never invokes `go test` and would freeze a partial
      # cache under the exact key. Saving here rather than via the cache
      # action's post step avoids publishing a half-populated cache when an
      # earlier step fails the job.
      - name: Save Go module cache
        if: steps.go-modcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-modcache.outputs.path }}
          key: ${{ steps.go-modcache.outputs.key }}

      - name: Save Go build cache
        if: success() && github.ref == 'refs/heads/main' && steps.go-buildcache.outputs.cache-hit != 'true' && !env.ACT
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.go-buildcache.outputs.path }}
          key: ${{ steps.go-buildcache.outputs.key }}

  # The two suites boot their own VMs, so they run on separate runners.
  functional-tests:
    name: Run ${{ matrix.suite == 'lab' && 'Lab Scenarios' || 'Functional Tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [build-release-artifacts, build-cli]
    strategy:
      fail-fast: false
      matrix:
        suite: [functional, lab]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      # The setup-go cache is keyed on the module list alone, so only one leg
      # may write it; the lab leg restores modules only and compiles cold.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: ${{ matrix.suite == 'functional' }}

      - name: Restore Go module cache
        if: matrix.suite == 'lab'
        uses: ./.github/actions/go-modcache

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: qemu-system-x86 qemu-utils genisoimage cloud-image-utils wget curl jq libpcap-dev just

      - name: Configure system for QEMU
        run: |
          # Enable KVM access if available
          if [ -e /dev/kvm ]; then
              echo "KVM is available, configuring KVM access"
              sudo usermod -aG kvm $USER || true
              sudo chmod 666 /dev/kvm || true
          else
              echo "KVM is not available, will use TCG emulation"
          fi

          # Configure 9P filesystem support
          sudo modprobe 9p || true
          sudo modprobe 9pnet_virtio || true

          # Check QEMU capabilities
          qemu-system-x86_64 --version

      # Both legs restore the VM images; only the functional leg saves them.
      - name: Restore Ubuntu cloud image
        id: cache-ubuntu-image
        uses: actions/cache/restore@v5
        with:
          path: tests/functional/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ runner.os }}-ubuntu-image-${{ hashFiles('tests/functional/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-image-

      - name: Restore QEMU image
        id: cache-qemu-image
        uses: actions/cache/restore@v5
        with:
          path: |
            tests/functional/yanet-test.qcow2
            tests/functional/*.iso
          key: ${{ runner.os }}-qemu-disk-v2-${{ hashFiles('tests/functional/Makefile') }}-${{ hashFiles('tests/functional/cloud-init-user-data.yaml') }}-${{ hashFiles('tests/functional/meta-data') }}

      - name: Normalize cached VM artifact timestamps
        if: steps.cache-qemu-image.outputs.cache-hit == 'true' || steps.cache-ubuntu-image.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail

          cd tests/functional

          # Git checkout sets source files mtimes to "now". Cached artifacts keep old mtimes,
          # so `make` treats them as stale and rebuilds QCOW2/ISO every run. Touch artifacts
          # (deps first, then target) to keep make from doing unnecessary work.
          if [ -f ubuntu-24.04-minimal-cloudimg-amd64.img ]; then
              touch ubuntu-24.04-minimal-cloudimg-amd64.img
          fi

          if ls -1 *.iso >/dev/null 2>&1; then
              touch *.iso
          fi

          if [ -f yanet-test.qcow2 ]; then
              touch yanet-test.qcow2
          fi

      - name: Download YANET binaries
        uses: actions/download-artifact@v5
        with:
          name: yanet2-binaries
          path: build

      - name: Download YANET CLI
        uses: actions/download-artifact@v5
        with:
          name: yanet2-cli
          path: target/release

      - name: Restore executable bits
        run: chmod +x build/dataplane/yanet-dataplane build/controlplane/yanet-controlplane build/operators/*/yanet-* target/release/yanet-cli*

      - name: Prepare test environment
        working-directory: tests/functional
        timeout-minutes: 60
        run: |
          set -euo pipefail
          if ! make prepare-vm; then
            tail -n 50 qemu_debug.log 2>/dev/null || true
            exit 1
          fi

          # Watch file length: actions/cache restores the image dense, so disk
          # size roughly doubles on every cache hit even with no real regrowth.
          qemu-img info yanet-test.qcow2 || true

      - name: Run functional tests
        if: matrix.suite == 'functional'
        working-directory: tests/functional
        run: |
          set +e
          export YANET_TEST_DEBUG=1
          export YANET_VM_POOL_SIZE=5
          make test
          ret=$?

          echo "=== main/test.log (last 100 lines) ==="
          tail -n 100 main/test.log 2>/dev/null || echo "main/test.log not found"

          exit $ret
        timeout-minutes: 45

      - name: Run reusable lab scenarios
        if: matrix.suite == 'lab'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          trap 'go run ./cmd/yanet-lab down || true' EXIT
          go run ./cmd/yanet-lab up
          for scenario in forward-route decap nat64; do
            go run ./cmd/yanet-lab reset
            go run ./cmd/yanet-lab scenario run "$scenario"
          done

      - name: Save Ubuntu cloud image
        if: success() && matrix.suite == 'functional' && steps.cache-ubuntu-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tests/functional/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.cache-ubuntu-image.outputs.cache-primary-key }}

      - name: Save QEMU image
        if: success() && matrix.suite == 'functional' && steps.cache-qemu-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            tests/functional/yanet-test.qcow2
            tests/functional/*.iso
          key: ${{ steps.cache-qemu-image.outputs.cache-primary-key }}

      - name: Upload functional test logs
        uses: actions/upload-artifact@v5
        if: always() && matrix.suite == 'functional'
        with:
          name: functional-test-logs
          path: tests/functional/main/test.log

      - name: Upload lab logs
        uses: actions/upload-artifact@v5
        if: always() && matrix.suite == 'lab'
        with:
          name: lab-logs
          path: |
            /tmp/yanet2-lab-*/**/supervisor.log
            /tmp/yanet2-lab-*/**/last-report.json
