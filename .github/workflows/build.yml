name: Build YANET

on:
  push:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "cli/Makefile"
      - "**.rs"
      - "**/build.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "tests/functional/**"
      - "subprojects/dpdk"
      - ".gitmodules"
      - ".github/workflows/build.yml"
      - ".github/actions/setup/**"
  pull_request:
    branches: ["main"]
    paths:
      - "**.h"
      - "**.c"
      - "**/meson.build"
      - "meson_options.txt"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "cli/Makefile"
      - "**.rs"
      - "**/build.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "tests/functional/**"
      - "subprojects/dpdk"
      - ".gitmodules"
      - ".github/workflows/build.yml"
      - ".github/actions/setup/**"

jobs:
  build-sanitize:
    runs-on: ubuntu-24.04
    name: build-sanitize (${{ matrix.profile.id }})
    strategy:
      fail-fast: false
      matrix:
        profile:
          - id: asan
            # Keep flags in sync with Makefile (test-asan)
            flags: "-Dbuildtype=debug -Doptimization=0 -Dfuzzing=disabled -Db_sanitize=address,undefined"
            builddir: build
            test_target: test-asan
          - id: tsan
            flags: "-Dbuildtype=debug -Doptimization=0 -Db_sanitize=thread"
            builddir: build-tsan
            test_target: test-tsan

    steps:
      - name: Free up disk space on GitHub runner
        run: |
          echo "=== Initial disk space ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history so git-restore-mtime can attribute each file to its
          # last-touch commit. Without this it can't walk the log and leaves
          # every file at checkout-time mtime, defeating the build cache.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        id: setup
        with:
          profile: ${{ matrix.profile.id }}

      - name: Restore build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.profile.builddir }}
          key: build-${{ matrix.profile.id }}-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.profile.id }}-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-
            build-${{ matrix.profile.id }}-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-

      - name: Build YANET
        run: |
          make go-cache-clean
          if [ -f ${{ matrix.profile.builddir }}/meson-private/build.dat ]; then
              meson setup --reconfigure ${{ matrix.profile.builddir }} ${{ matrix.profile.flags }}
          else
              meson setup ${{ matrix.profile.builddir }} ${{ matrix.profile.flags }}
          fi
          # TSAN only runs unit tests via `make test-tsan`, which builds its
          # own test binaries through meson; the full dataplane and CLI are
          # not exercised, so we skip building them.
          if [ "${{ matrix.profile.id }}" != "tsan" ]; then
              make dataplane cli
          fi

      - name: Run tests
        run: |
          make go-cache-clean
          make ${{ matrix.profile.test_target }}

      - name: Show meson test log
        if: always()
        run: |
          log="${{ matrix.profile.builddir }}/meson-logs/testlog.txt"
          if [ -f "$log" ]; then
              grep -v 'Inherited environment' "$log"
          else
              echo "WARNING: $log not found"
          fi

      - name: Save build cache
        if: success() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.profile.builddir }}
          key: build-${{ matrix.profile.id }}-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-${{ github.sha }}

  build-release:
    runs-on: ubuntu-24.04
    name: build-release

    steps:
      - name: Free up disk space on GitHub runner
        run: |
          echo "=== Initial disk space ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history so git-restore-mtime can attribute each file to its
          # last-touch commit. Without this it can't walk the log and leaves
          # every file at checkout-time mtime, defeating the build cache.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        id: setup
        with:
          profile: release
          install-llvm: 'true'

      - name: Restore build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: build-release-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-${{ github.sha }}
          restore-keys: |
            build-release-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-
            build-release-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-

      - name: Build YANET
        run: |
          make go-cache-clean
          if [ -f build/meson-private/build.dat ]; then
              meson setup --reconfigure build -Dbuildtype=release
          else
              meson setup build -Dbuildtype=release
          fi
          make dataplane cli

      - name: Run tests
        run: |
          make go-cache-clean
          make test

      - name: Show meson test log
        if: always()
        run: |
          log="build/meson-logs/testlog.txt"
          if [ -f "$log" ]; then
              grep -v 'Inherited environment' "$log"
          else
              echo "WARNING: $log not found"
          fi

      - name: Save build cache
        if: success() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: build-release-${{ runner.os }}-${{ steps.setup.outputs.dpdk-sha }}-${{ hashFiles('**/meson.build', 'meson_options.txt') }}-${{ github.sha }}

      - name: Run clang-tidy
        env:
          LLVM_DIR: ${{ runner.temp }}/llvm
        run: |
          set -euo pipefail
          test -f build/compile_commands.json || {
              echo "ERROR: build/compile_commands.json not found"
              ls -la build || true
              exit 1
          }

          if [ ! -x "$LLVM_DIR/bin/clang-tidy" ]; then
              echo "ERROR: LLVM 19 clang-tidy not found at $LLVM_DIR/bin/clang-tidy"
              ls -la "$LLVM_DIR/bin" || true
              exit 1
          fi
          export PATH="$LLVM_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$LLVM_DIR/lib:${LD_LIBRARY_PATH:-}"

          CTIDY="$LLVM_DIR/bin/clang-tidy"
          if [ -f "$LLVM_DIR/share/clang/run-clang-tidy.py" ]; then
              RTIDY="$LLVM_DIR/share/clang/run-clang-tidy.py"
          elif [ -f "$LLVM_DIR/lib/clang/run-clang-tidy.py" ]; then
              RTIDY="$LLVM_DIR/lib/clang/run-clang-tidy.py"
          else
              RTIDY=""
          fi

          echo "Using clang-tidy binary: $CTIDY"
          [ -n "$RTIDY" ] && echo "Using run-clang-tidy helper: $RTIDY"

          FILES="$(jq -r '.[].file' build/compile_commands.json | sort -u | grep '\.c$' | grep -v '/subprojects/' || true)"
          if [ -z "$FILES" ]; then
              echo "No source files to lint (after filtering)."
              exit 0
          fi

          if [ -n "$RTIDY" ] && [ -f "$RTIDY" ]; then
              python3 "$RTIDY" \
                  -p build \
                  -j "$(nproc)" \
                  -clang-tidy-binary "$CTIDY" \
                  -header-filter='^(?!.*\/subprojects\/).*' \
                  $FILES
          else
              cd build
              printf "%s\n" $FILES |
                  xargs -P"$(nproc)" -I{} "$CTIDY" \
                      -p . \
                      -header-filter='^(?!.*\/subprojects\/).*' \
                      {}
          fi

      - name: Verify binaries before upload
        run: |
          echo "=== Verifying binaries before artifact upload ==="
          echo "Current git commit: $(git rev-parse HEAD)"

          for f in build/dataplane/yanet-dataplane build/controlplane/yanet-controlplane; do
              if [ -f "$f" ]; then
                  stat "$f"
                  md5sum "$f"
              else
                  echo "ERROR: $f not found!"
                  exit 1
              fi
          done

          if ls target/release/yanet-cli* 1>/dev/null 2>&1; then
              stat target/release/yanet-cli* || true
              md5sum target/release/yanet-cli* || true
          else
              echo "ERROR: No yanet-cli binaries found in target/release/!"
              exit 1
          fi

      - name: Upload YANET binaries
        uses: actions/upload-artifact@v4
        with:
          name: yanet2-binaries
          path: |
            build/dataplane/yanet-dataplane
            build/controlplane/yanet-controlplane
            target/release/yanet-cli*

  functional-tests:
    name: Run Functional Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: build-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clean any pre-existing build artifacts
        run: |
          echo "=== Cleaning any cached build artifacts before downloading from build job ==="
          rm -rf build/ target/ || true
          echo "Cleaned build/ and target/ directories"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache: false

      - name: update apt (act hack)
        if: ${{ env.ACT }}
        run: apt-get update
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: qemu-system-x86 qemu-utils genisoimage cloud-image-utils wget curl jq
          version: 1.1

      - name: Configure system for QEMU
        run: |
          if [ -e /dev/kvm ]; then
              echo "KVM is available, configuring KVM access"
              sudo usermod -aG kvm $USER || true
              sudo chmod 666 /dev/kvm || true
          else
              echo "KVM is not available, will use TCG emulation"
          fi

          sudo modprobe 9p || true
          sudo modprobe 9pnet_virtio || true

          qemu-system-x86_64 --version

      - name: Cache Ubuntu cloud image
        id: cache-ubuntu-image
        uses: actions/cache@v4
        with:
          path: tests/functional/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ runner.os }}-ubuntu-image-${{ hashFiles('tests/functional/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-image-

      - name: Cache QEMU image
        id: cache-qemu-image
        uses: actions/cache@v4
        with:
          path: |
            tests/functional/yanet-test.qcow2
            tests/functional/*.iso
          key: ${{ runner.os }}-qemu-image-${{ hashFiles('tests/functional/Makefile') }}-${{ hashFiles('tests/functional/cloud-init-user-data.yaml') }}-${{ hashFiles('tests/functional/meta-data') }}
          restore-keys: |
            ${{ runner.os }}-qemu-image-

      - name: Normalize cached VM artifact timestamps
        if: steps.cache-qemu-image.outputs.cache-hit == 'true' || steps.cache-ubuntu-image.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail

          cd tests/functional

          if [ -f ubuntu-24.04-minimal-cloudimg-amd64.img ]; then
              touch ubuntu-24.04-minimal-cloudimg-amd64.img
          fi

          if ls -1 *.iso >/dev/null 2>&1; then
              touch *.iso
          fi

          if [ -f yanet-test.qcow2 ]; then
              touch yanet-test.qcow2
          fi

      - name: Download YANET binaries from build job
        uses: actions/download-artifact@v4
        with:
          name: yanet2-binaries
          path: ./

      - name: Place downloaded binaries
        run: |
          mkdir -p build/dataplane build/controlplane target/release
          [ -f "./yanet-dataplane" ] && mv -f ./yanet-dataplane build/dataplane/
          [ -f "./yanet-controlplane" ] && mv -f ./yanet-controlplane build/controlplane/
          if ls ./yanet-cli* 1>/dev/null 2>&1; then
              mv -f ./yanet-cli* target/release/
          fi
          chmod +x build/dataplane/yanet-dataplane 2>/dev/null || true
          chmod +x build/controlplane/yanet-controlplane 2>/dev/null || true
          chmod +x target/release/yanet-cli* 2>/dev/null || true

      - name: Prepare test environment
        working-directory: tests/functional
        run: |
          set -uo pipefail
          make check-deps

          echo "=== Starting QEMU VM preparation ==="

          # Budgets must stack with margin: inner timeout < loop budget < step timeout.
          # 110 min  <  120 min  <  130 min.
          timeout 6600 make prepare-vm &
          QEMU_PID=$!

          for i in {1..120}; do
              echo "=== QEMU status check $i/120 ==="
              ps aux | grep qemu | grep -v grep || echo "QEMU process not found"

              if [ -f qemu_debug.log ]; then
                  echo "=== QEMU log size: $(wc -l <qemu_debug.log) lines ==="
                  echo "=== Last 10 lines of QEMU log ==="
                  tail -10 qemu_debug.log
              fi

              sleep 60

              if ! kill -0 $QEMU_PID 2>/dev/null; then
                  echo "QEMU process finished"
                  break
              fi
          done

          wait $QEMU_PID
          QEMU_EXIT_CODE=$?

          echo "=== QEMU exit code: $QEMU_EXIT_CODE ==="

          if [ -f qemu_debug.log ]; then
              echo "=== Final QEMU log (last 50 lines) ==="
              tail -50 qemu_debug.log
          fi

          if [ $QEMU_EXIT_CODE -eq 124 ]; then
              echo "QEMU preparation hit the inner 110-min timeout (exit 124)"
              exit 124
          elif [ $QEMU_EXIT_CODE -ne 0 ]; then
              echo "QEMU preparation failed with exit code $QEMU_EXIT_CODE"
              exit $QEMU_EXIT_CODE
          fi

        timeout-minutes: 130

      - name: Run functional tests
        working-directory: tests/functional
        run: |
          set +e
          export YANET_TEST_DEBUG=1
          make test
          ret=$?

          echo "=== main/test.log (last 100 lines) ==="
          tail -n 100 main/test.log 2>/dev/null || echo "main/test.log not found"

          echo ""
          echo "=== converted/test.log (last 100 lines) ==="
          tail -n 100 converted/test.log 2>/dev/null || echo "converted/test.log not found"

          exit $ret
        timeout-minutes: 35

      - name: Upload functional test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-logs
          path: |
            tests/functional/main/test.log
            tests/functional/converted/test.log
