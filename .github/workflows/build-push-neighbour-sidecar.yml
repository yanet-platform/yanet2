name: Build and push neighbour sidecar

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_tag:
        type: string
        required: true

jobs:
  build-image:
    name: Build neighbour-sidecar image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/yanet-neighbour-sidecar.Dockerfile
          push: true
          tags: ghcr.io/yanet-platform/yanet2/neighbour-sidecar:${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=neighbour-sidecar
          cache-to: type=gha,mode=max,scope=neighbour-sidecar
