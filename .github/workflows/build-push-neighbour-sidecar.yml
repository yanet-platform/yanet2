name: Build and push neighbour sidecar

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      image_tag:
        type: string
        required: true

jobs:
  build-image:
    name: Build neighbour-sidecar image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}

      - env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/yanet-neighbour-sidecar.Dockerfile
          push: true
          tags: ghcr.io/yanet-platform/yanet2/neighbour-sidecar:${{ inputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=neighbour-sidecar
          cache-to: type=gha,mode=max,scope=neighbour-sidecar
