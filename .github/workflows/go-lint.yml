name: Go Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'lint/style/**'
      - '.golangci.yml'
      - '.github/workflows/go-lint.yml'
      - '.github/actions/apt-packages/**'
      - '.github/actions/apt-failover/**'
      - '.github/actions/protoc-plugins/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'lint/style/**'
      - '.golangci.yml'
      - '.github/workflows/go-lint.yml'
      - '.github/actions/apt-packages/**'
      - '.github/actions/apt-failover/**'
      - '.github/actions/protoc-plugins/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  stylelint:
    name: Custom stylelint linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./lint/style/cmd/stylelint/

      - name: Run linter
        run: go run ./lint/style/cmd/stylelint/

  modernize:
    name: golangci-lint modernize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: meson clang cmake python3-pyelftools libnuma-dev libpcap-dev git protobuf-compiler

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Generate protobuf Go sources
        run: make proto-go

      # CGO test packages compile production translation units whose headers
      # reach DPDK, so typechecking needs a configured (not built) tree.
      - name: Configure build tree
        run: meson setup build -Dbuildtype=debug -Doptimization=0

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout 5m
