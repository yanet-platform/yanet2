name: Go Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'lint/style/**'
      - '.golangci.yml'
      - '.github/workflows/go-lint.yml'
      - '.github/actions/apt-packages/**'
      - '.github/actions/apt-failover/**'
      - '.github/actions/protoc-plugins/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'lint/style/**'
      - '.golangci.yml'
      - '.github/workflows/go-lint.yml'
      - '.github/actions/apt-packages/**'
      - '.github/actions/apt-failover/**'
      - '.github/actions/protoc-plugins/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  stylelint:
    name: Custom stylelint linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./lint/style/cmd/stylelint/

      - name: Run linter
        run: go run ./lint/style/cmd/stylelint/

  modernize:
    name: golangci-lint modernize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/apt-packages
        timeout-minutes: 10
        with:
          packages: protobuf-compiler libpcap-dev

      - name: Install Go Protobuf Plugins
        uses: ./.github/actions/protoc-plugins

      - name: Generate protobuf Go sources
        run: make proto-go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m
