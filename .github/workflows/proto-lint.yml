name: Proto Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.proto'
      - 'lint/protobuf/**'
      - 'buf.yaml'
      - '.github/workflows/proto-lint.yml'
  pull_request:
    paths:
      - '**/*.proto'
      - 'lint/protobuf/**'
      - 'buf.yaml'
      - '.github/workflows/proto-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  buf-lint:
    name: Buf lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true

      - name: Run buf lint
        run: buf lint

  buf-breaking:
    name: Buf breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true

      # Comparing against the base branch rather than main keeps a stacked pull
      # request from being blamed for its parent's breaking changes.
      - name: Run buf breaking
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Buf reads the fragment as a comma-separated option list, so a comma
          # in the branch name would arrive as extra options, not as the name.
          case "${BASE_REF}" in
            *,*)
              echo "::error::base branch name contains a comma: ${BASE_REF}"
              exit 1
              ;;
          esac
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${BASE_REF}"

  protolint:
    name: Custom protolint linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./lint/protobuf/cmd/protolint/

      - name: Run linter
        run: |
          go run ./lint/protobuf/cmd/protolint/ --exclude subprojects
