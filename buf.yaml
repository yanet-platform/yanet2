version: v2
modules:
  - path: .
    excludes:
      - subprojects
      - .claude
      - .assets
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - modules/route-mpls
      - operators/bird-adapter
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - common/filterpb
breaking:
  use:
    - PACKAGE
  # The agent instance generation removal (reserved fields in these two
  # files) is an intentional, breaking-marked deletion.
  ignore_only:
    FIELD_NO_DELETE:
      - controlplane/ynpb/v1/inspect.proto
      - controlplane/ynpb/v1/memory.proto
