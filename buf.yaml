version: v2
modules:
  - path: .
    excludes:
      - subprojects
      - .claude
      - .assets
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - modules/route-mpls
      - operators/bird-adapter
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - common/filterpb
breaking:
  use:
    - PACKAGE
  ignore:
    - modules/balancer2
    # No gateway registration ever exposed this service.
    - controlplane/ynpb/v1/module.proto
    # The Perf RPC and its messages went away together with the tsc perf
    # counters they exported.
    - controlplane/ynpb/v1/counters.proto
    # TODO: drop once main carries the fwstate-map object cutover (acl/fwstate
    # resolve state tables through named map objects).
    - modules/acl/controlplane/aclpb/v1/acl.proto
    - modules/fwstate/controlplane/fwstatepb/v1/fwstate.proto
    # TODO: drop after the NAT64 prefix wire cutover in #2197 reaches main.
    - modules/nat64/controlplane/nat64pb/v1/nat64.proto
    # ListEntries changes from a bidi stream to cursor-paginated unary calls
    # in the same cutover.
    - objects/fwstate/controlplane/fwstatemappb/v1/fwstatemap.proto
    # The forward and decap readiness services keep their names, but as
    # runtime service names of the shared static module operator, not as
    # proto packages of their own.
    - operators/forward/operatorpb
    - operators/decap/operatorpb
