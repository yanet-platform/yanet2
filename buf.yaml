version: v2
modules:
  - path: .
    excludes:
      - subprojects
      - .claude
      - .assets
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - modules/route-mpls
      - operators/bird-adapter
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - common/filterpb
breaking:
  use:
    - PACKAGE
  ignore_only:
    # The DSCP destination fields gain explicit direction names while their
    # numbers and types stay fixed. Legacy YAML keys remain decoding aliases.
    # Remove these name-only exceptions once the rename reaches the base.
    FIELD_SAME_NAME:
      - modules/dscp/controlplane/dscppb/v1/dscp.proto
    FIELD_SAME_JSON_NAME:
      - modules/dscp/controlplane/dscppb/v1/dscp.proto
  ignore:
    # TODO: drop once the fossil removal reaches main; the deprecated
    # acl SyncConfig is deleted with its field slots reserved by number
    # and name, the server never read them and show never set them, so
    # the wire form of old clients skips cleanly.
    - modules/acl/controlplane/aclpb/v1/acl.proto
    # TODO: drop once the endpoint-list cutover (#3224) reaches main; the
    # flat source/multicast/unicast fields are replaced by the repeated
    # endpoints message.
    - modules/fwstate/controlplane/fwstatepb/v1/fwstate.proto
