version: v2
modules:
  - path: .
    excludes:
      - subprojects
      - .claude
      - .assets
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - modules/route-mpls
      - operators/bird-adapter
    ENUM_VALUE_UPPER_SNAKE_CASE:
      - common/filterpb
breaking:
  use:
    - PACKAGE
  ignore:
    - modules/balancer2
  # sync_suppress_timeout intentionally dropped proto3 optional presence; the
  # wire format (field 13, varint) is unchanged. Drop this waiver once main
  # carries the plain field.
  ignore_only:
    FIELD_SAME_CARDINALITY:
      - modules/fwstate/controlplane/fwstatepb/v1/fwstate.proto
