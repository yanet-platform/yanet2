[package]
name = "yanet-sys"
description = "The C bindings of the Rust module SDK, with modules mirroring the C tree: the one bindgen output and the hand-written mirrors of the C structures a configuration embeds."
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netip = "0.4"
yanet-shm = { path = "../yanet-shm" }

[build-dependencies]
cc = "1"
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
serde_json = "1"
shlex = "1"

[dev-dependencies]
yanet-sdk-testing = { path = "../yanet-sdk-testing" }

# The classify query against the inline C one; see the benchmark's header.
[[bench]]
name = "classify"
harness = false

# The build of a production-shaped classifier and the cost of validating it;
# see the benchmark's header.
[[bench]]
name = "classify_build"
harness = false
