[package]
name = "yanet-sys"
description = "The C bindings of the Rust module SDK, with modules mirroring the C tree: the one bindgen output and the hand-written mirrors of the C structures a configuration embeds."
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
netip = "0.5.0"
yanet-packet = { path = "../yanet-packet" }
yanet-shm = { path = "../yanet-shm" }

[build-dependencies]
cc = "1"
bindgen = { version = "0.72", default-features = false, features = ["runtime"] }
serde_json = "1"
shlex = "1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
yanet-sdk-testing = { path = "../yanet-sdk-testing" }

[[bench]]
name = "dp"
harness = false
