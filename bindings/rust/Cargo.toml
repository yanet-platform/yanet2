# Rust module SDK workspace.
#
# A separate cargo workspace with its own lock file, not a member of the
# repository root workspace (the CLIs).
[workspace]
resolver = "3"
members = [
    "yanet-sdk",
    "yanet-sdk-derive",
    "yanet-sdk-fixture",
    "yanet-sdk-plugin",
    "yanet-sdk-testing",
    "yanet-shm",
    "yanet-sys",
    "yanet-packet",
    "yanet-layout",
]
# Every member but the generator of the Go views, which make native-layout
# runs, so a plain cargo build or test leaves it out.
default-members = [
    "yanet-sdk",
    "yanet-sdk-derive",
    "yanet-sdk-fixture",
    "yanet-sdk-plugin",
    "yanet-sdk-testing",
    "yanet-shm",
    "yanet-sys",
    "yanet-packet",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
publish = false

# rust-sdk.yml runs cargo shear, and unused_crate_dependencies on library
# targets only: rustc checks it per target, so tests would name every crate.
[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
missing_docs = "deny"
raw_borrows_via_references = "deny"
trivial_casts = "deny"
unit_bindings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
alloc_instead_of_core = "deny"
as_ptr_cast_mut = "deny"
borrow_as_ptr = "deny"
cast_ptr_alignment = "deny"
doc_markdown = "deny"
large_stack_arrays = "deny"
missing_panics_doc = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
transmute_ptr_to_ptr = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
wildcard_imports = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# Plugins build with thin LTO, the rest of the workspace without.
#
# The precompiled `core` references the unwinder's personality routine, which
# a `no_std` plugin does not define and the loader would fail to resolve.
# Whole-program optimisation drops it. A `no_std` cdylib cannot unwind.
[profile.plugin]
inherits = "release"
lto = "thin"
panic = "abort"
