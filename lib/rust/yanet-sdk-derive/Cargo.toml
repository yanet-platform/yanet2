[package]
name = "yanet-sdk-derive"
description = "Derive macros of the Rust module SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }

[dev-dependencies]
yanet-sdk = { path = "../yanet-sdk" }
yanet-sys = { path = "../yanet-sys" }
yanet-sdk-api = { path = "../yanet-sdk-api" }
