# Logging configuration.
logging:
  # Logging priority.
  #
  # Higher levels are more important.
  #
  # Possible values: "debug", "info", "warning", "error".
  level: debug
gateway:
  server:
    endpoint: &gateway_endpoint "[::1]:8080"
modules:
  route:
    endpoint: "[::1]:0"
    gateway_endpoint: *gateway_endpoint
