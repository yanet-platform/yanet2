# Logging configuration.
logging:
  # Logging priority.
  #
  # Higher levels are more important.
  #
  # Possible values: "debug", "info", "warning", "error".
  level: debug
# MemoryPath is the path to the shared-memory file that is used to
# communicate with dataplane.
memory_path: &memory_path /dev/hugepages/yanet
gateway:
  # Which dataplane instance this gateway serves. Required, 0 is a valid
  # value but must be written down.
  instance_id: 0
  server:
    endpoint: "[::1]:8080"
    http_endpoint: "[::1]:8081"
    # TLS is optional. When present both gRPC and HTTP listeners use it.
    # The certificate's SubjectAltName must include whatever host the
    # in-process loopback uses (defaults to the host from `endpoint`,
    # i.e. ::1). Override via `server_name` if you need a different SNI.
    # Cert rotation requires a director restart.
    # tls:
    #   cert_file: /etc/yanet2/tls/server.pem
    #   key_file:  /etc/yanet2/tls/server.key
    #   server_name: localhost
  auth:
    disabled: true
    # Enabling auth means setting `disabled: false` plus all three keys
    # below: an identity source, an authenticator, a permissions policy.
    # None of the referenced files ships with the package — add per site.
    # identity_providers:
    #   - type: file
    #     path: /etc/yanet2/auth/identities.yaml
    # authenticators:
    #   - type: basic
    #     config:
    #       credentials_path: /etc/yanet2/auth/basic_auth.yaml
    # permissions_path: /etc/yanet2/auth/permissions.yaml
  registry:
    # The gateway drops backends that stopped refreshing their registration,
    # so a stopped operator disappears from the registry instead of
    # lingering.
    #
    # Set to true to keep every backend registered until the gateway stops,
    # even after it disappears.
    preserve_stale_backends: false
    # How long a backend may go silent before it is evicted.
    #
    # Raise this above the registration period of any operator configured to
    # re-register more slowly than the default.
    ttl: 5m
    # How often the eviction check runs.
    sweep_interval: 30s
# A module listed below is started and attaches an agent to the named
# dataplane instance; a module left out is not started at all.
# instance_id is mandatory for every listed module.
modules:
  route:
    instance_id: 0
    # MemoryPath is the path to the shared-memory file that is used
    # to communicate with the dataplane.
    memory_path: *memory_path
    # Memory requirements for a single FIB-push transaction.
    memory_requirements: 16MB
  route-mpls:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  decap:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  dscp:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  forward:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  mirror:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  nat64:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  pdump:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  acl:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 8GB
  fwstate:
    instance_id: 0
    memory_path: *memory_path
    # The fwstate-map objects linked by acl and fwstate configs allocate
    # in this module's agent zone.
    memory_requirements: 8GB
  blackhole:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 4MB
  unrdup:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 32MB
devices:
  plain:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  vlan:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
