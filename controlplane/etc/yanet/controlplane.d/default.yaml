# Logging configuration.
logging:
  # Logging priority.
  #
  # Higher levels are more important.
  #
  # Possible values: "debug", "info", "warning", "error".
  level: debug
# MemoryPath is the path to the shared-memory file that is used to
# communicate with dataplane.
memory_path: &memory_path /dev/hugepages/yanet
gateway:
  # Which dataplane instance this gateway serves. Required, 0 is a valid
  # value but must be written down.
  instance_id: 0
  server:
    # Deprecated listener keys, kept here until issue #2983 removes them, so
    # the director logs a deprecation warning. With tls set, endpoint and
    # http_endpoint serve TLS instead of plaintext.
    endpoint: "[::1]:8080"
    http_endpoint: "[::1]:8081"
    # tls:
    #   key_pairs:
    #     - type: file
    #       config:
    #         cert_file: /etc/yanet2/tls/server.pem
    #         key_file:  /etc/yanet2/tls/server.key
    # The grpc and http sections replace these keys, each for its own
    # protocol. A section takes a plaintext endpoint, a TLS listener, or both
    # side by side, so clients can move to TLS one at a time.
    #
    # Both listeners serve every service. The certificate only has to match
    # the hosts clients dial; a handshake gets the first key pair that is
    # valid and that the client supports, else the first. Renewed files are
    # picked up within an hour without a restart: replace them by rename or
    # symlink swap, since a key and certificate written one after the other
    # keep the old pair until both match. Key pair paths cannot be set from
    # the environment. The gRPC TLS listener alone asks for client
    # certificates; HTTPS never does.
    # grpc:
    #   endpoint: "[::1]:8080"
    #   tls:
    #     endpoint: "[::1]:8443"
    #     # Clients reconnect within this age plus 10%, presenting their
    #     # current certificate; a running stream keeps its connection until
    #     # it ends.
    #     #
    #     # Off by default, at least 1s when set. Deploy a renewed client pair
    #     # more than 1h plus 1.1 times the age before the old one expires; a
    #     # day is plenty.
    #     max_connection_age: 1h
    #     key_pairs:
    #       - type: file
    #         config:
    #           cert_file: /etc/yanet2/tls/server.pem
    #           key_file:  /etc/yanet2/tls/server.key
    # http:
    #   endpoint: "[::1]:8081"
    #   tls:
    #     endpoint: "[::1]:8444"
    #     key_pairs:
    #       - type: file
    #         config:
    #           cert_file: /etc/yanet2/tls/server.pem
    #           key_file:  /etc/yanet2/tls/server.key
  # auth:
    # Audit admits RPCs after transport TLS checks and logs verified identities.
    # Enabled enforces identity lookup and permissions; disabled is anonymous.
    #
    # Replace legacy disabled: true/false with mode: disabled/enabled. Remove
    # the old key and YANET_GATEWAY_AUTH_DISABLED when setting mode or
    # YANET_GATEWAY_AUTH_MODE; both policy spellings together are an error.
    # mode: disabled
    # For SSH-agent certificate audit logging, select mode: audit and
    # configure the SSH certificate authenticator below with a trusted CA.
    #
    # Audit needs no identity source or permissions file. None of these
    # site-specific files ships with the package.
    # authenticators:
    #   - type: sshcert
    #     config:
    #       ca_sources:
    #         - /etc/yanet2/auth/ssh-ca.pub
    # Additional authenticators can be appended to the same list.
    #   - type: basic
    #     config:
    #       credentials_path: /etc/yanet2/auth/basic_auth.yaml
    #   # A client certificate identifies a caller that sends no token by its
    #   # verified common name.
    #   #
    #   # Enabled mode requires this name in the identities file; audit records
    #   # it directly. Requires a gRPC TLS listener (server.grpc.tls, or the
    #   # deprecated server.tls), the only listener that checks certificates;
    #   # plaintext callers stay anonymous. Revocation lists are optional and
    #   # must be signed by one of the authorities.
    #   - type: x509
    #     config:
    #       ca_sources:
    #         - /etc/yanet2/auth/client-ca.pem
    #       crl_sources:
    #         - https://pki.example.com/yanet-clients.crl
    #       refresh_interval: 5m
    # Enabled mode also requires an identity source and permissions policy.
    # identity_providers:
    #   - type: file
    #     path: /etc/yanet2/auth/identities.yaml
    # permissions_path: /etc/yanet2/auth/permissions.yaml
  registry:
    # The gateway drops backends that stopped refreshing their registration,
    # so a stopped operator disappears from the registry instead of
    # lingering.
    #
    # Set to true to keep every backend registered until the gateway stops,
    # even after it disappears.
    preserve_stale_backends: false
    # How long a backend may go silent before it is evicted.
    #
    # Raise this above the registration period of any operator configured to
    # re-register more slowly than the default.
    ttl: 5m
    # How often the eviction check runs.
    sweep_interval: 30s
# A module listed below is started and attaches an agent to the named
# dataplane instance; a module left out is not started at all.
# instance_id is mandatory for every listed module.
modules:
  route:
    instance_id: 0
    # MemoryPath is the path to the shared-memory file that is used
    # to communicate with the dataplane.
    memory_path: *memory_path
    # Memory requirements for a single FIB-push transaction.
    memory_requirements: 16MB
  route-mpls:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  decap:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  dscp:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  forward:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  mirror:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  nat64:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  pdump:
    instance_id: 0
    memory_path: *memory_path
    # Ring objects a pdump config links allocate in this agent's arena,
    # with no separate reserve. Configs capture into a shared ring
    # without multiplying its cost.
    #
    # A 1 MiB ring on a 16-worker dataplane takes about 16 MiB, so this
    # default holds several such rings with headroom. Raise it to fit
    # more or larger rings.
    memory_requirements: 128MB
  acl:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 8GB
  fwstate:
    instance_id: 0
    memory_path: *memory_path
    # The fwstate-map objects linked by acl and fwstate configs allocate
    # in this module's agent zone.
    memory_requirements: 8GB
  blackhole:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 4MB
  unrdup:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 32MB
devices:
  plain:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  vlan:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
  vxlan:
    instance_id: 0
    memory_path: *memory_path
    memory_requirements: 16MB
