syntax = "proto3";

package ynpb;

option go_package = "github.com/yanet-platform/yanet2/controlplane/ynpb;ynpb";

service CountersService {
	// Inspect retrieves the current configuration state.
	rpc Device(DeviceCountersRequest) returns (CountersResponse) {
	}
	rpc Pipeline(PipelineCountersRequest) returns (CountersResponse) {
	}
	rpc Function(FunctionCountersRequest) returns (CountersResponse) {
	}
	rpc Chain(ChainCountersRequest) returns (CountersResponse) {
	}
	rpc Module(ModuleCountersRequest) returns (CountersResponse) {
	}
	rpc ModuleAggregate(ModuleAggregateCountersRequest) returns
		(ModuleAggregateCountersResponse) {}
}

message DeviceCountersRequest {
	string device = 1;
}

message PipelineCountersRequest {
	string device = 1;
	string pipeline = 2;
}

message FunctionCountersRequest {
	string device = 1;
	string pipeline = 2;
	string function = 3;
}

message ChainCountersRequest {
	string device = 1;
	string pipeline = 2;
	string function = 3;
	string chain = 4;
}

message ModuleCountersRequest {
	string device = 1;
	string pipeline = 2;
	string function = 3;
	string chain = 4;
	string module_type = 5;
	string module_name = 6;
	// CounterQuery filters counters by name. If empty, returns all
	// counters.
	//
	// TODO: support wildcards or regex?
	repeated string counter_query = 7;
}

message CounterInstanceInfo {
	repeated uint64 values = 1;
}

message CounterInfo {
	string name = 1;
	repeated CounterInstanceInfo instances = 2;
}

message CountersResponse {
	repeated CounterInfo counters = 1;
}

message ModuleAggregateCountersRequest {
	string device = 1;
	string pipeline = 2;
	string function = 3;
	string chain = 4;
	string module_type = 5;
	string module_name = 6;
}

// ModulePerfLatency represents latency distribution for a specific batch size range.
// Each entry tracks the number of packet batches that fell within a specific latency bucket.
message ModulePerfLatency {
	uint32 min_latency = 1;
	uint64 batches = 2;
}

// ModulePerfCounters aggregates performance metrics for packet batches of a specific size range.
// Batch sizes follow powers of 2: hist_0 (1 packet), hist_1 (2-3 packets), hist_2 (4-7 packets), etc.
message ModulePerfCounters {
	uint32 min_batch_size = 1;
	uint64 mean_latency = 2;
	repeated ModulePerfLatency latencies = 3;
}

// ModuleAggregateCounters provides aggregated statistics for a module across all worker instances.
// Includes packet/byte counts and detailed performance histograms for different batch sizes.
message ModuleAggregateCounters {
	uint64 tx_count = 1;
	uint64 tx_bytes = 2;
	uint64 rx_count = 3;
	uint64 rx_bytes = 4;
	repeated ModulePerfCounters packet_batches = 5;
}

// ModuleAggregateCountersResponse contains aggregated counter data for the requested module.
message ModuleAggregateCountersResponse {
	repeated ModuleAggregateCounters counters = 1;
}
