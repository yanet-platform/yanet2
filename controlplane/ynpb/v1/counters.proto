syntax = "proto3";

package controlplane.ynpb.v1;

option go_package = "github.com/yanet-platform/yanet2/controlplane/ynpb/v1;ynpb";

service CountersService {
  rpc ByTags(CountersByTagsRequest) returns (CountersByTagsResponse);
  rpc Workers(WorkerCountersRequest) returns (WorkerCountersResponse);
  rpc Ports(PortCountersRequest) returns (PortCountersResponse);
}

message CounterTag {
  string key = 1;
  string value = 2;
}

message CountersByTagsRequest {
  repeated CounterTag tags = 1;
  // Whole-name patterns in Rust regex syntax, any one of which may match.
  repeated string query = 2;
}

message CounterGroup {
  repeated CounterTag tags = 1;
  repeated CounterInfo counters = 2;
}

message CountersByTagsResponse { repeated CounterGroup groups = 1; }

message CounterInstanceInfo { repeated uint64 values = 1; }

message CounterInfo {
  string name = 1;
  repeated CounterInstanceInfo instances = 2;
}

// Requests a snapshot of raw cumulative worker polling and traffic counters.
message WorkerCountersRequest {}

// Returns one cumulative counter record per dataplane worker thread.
message WorkerCountersResponse { repeated WorkerCounter workers = 1; }

message WorkerCounter {
  // Stable worker index in the dataplane worker table.
  uint32 worker_idx = 1;
  // CPU core currently assigned to this worker.
  uint32 core_id = 2;
  // Device identifier used by this worker for RX/TX.
  uint32 device_id = 3;
  // RX queue identifier polled by this worker.
  uint32 queue_id = 4;
  // Maximum valid burst index for rx_bursts.
  uint32 max_burst_size = 5;
  // RX poll histogram: index 0 is empty polls, index n is polls with n packets.
  repeated uint64 rx_bursts = 6;
  // Total worker loop iterations since the counters were reset.
  uint64 iterations = 7;
  // Total packets received by this worker.
  uint64 rx_packets = 8;
  // Total received bytes counted by this worker.
  uint64 rx_bytes = 9;
  // Total packets transmitted by this worker.
  uint64 tx_packets = 10;
  // Total transmitted bytes counted by this worker.
  uint64 tx_bytes = 11;
  // Total packets received from remote workers.
  uint64 remote_rx_packets = 12;
  // Total packets sent to remote workers.
  uint64 remote_tx_packets = 13;
  // Packets dropped because the local NIC TX burst could not accept them.
  uint64 local_tx_drops = 14;
  // Packets dropped because the inter-worker data pipe was full or absent.
  uint64 remote_tx_drops = 15;
  // Packets this worker itself freed rather than forwarded.
  //
  // Covers malformed input, transmit failures, and deliberate module policy
  // drops such as an ACL deny, so nonzero alone is not a fault. Already
  // includes every local_tx_drops and remote_tx_drops packet.
  uint64 disposed = 16;
}

// Requests a snapshot of raw cumulative per-port extended stats counters.
message PortCountersRequest {}

// Returns the counters of every DPDK port, grouped per port.
message PortCountersResponse { repeated PortCountersGroup ports = 1; }

// Counters of a single DPDK port.
message PortCountersGroup {
  uint32 port_id = 1;
  string port_name = 2;
  repeated PortCounter counters = 3;
}

message PortCounter {
  string name = 1;
  uint64 value = 2;
}
